# Example config for scripts/gradient_routing/verify_posture_equivalence.py
#
#   ./pipeline_env_exec.sh "cd $PWD; source pipeline_env_activate.sh || exit 1; \
#     python scripts/gradient_routing/verify_posture_equivalence.py \
#       --config scripts/gradient_routing/verify_postures_example.yaml"
#
# Checks (a) and (c) are CPU-only; check (b) loads each posture in turn — on one GPU in
# bfloat16 (Nano-30B is ~60 GB, so one at a time fits a GH200), sharded across every visible
# GPU in float32 (~120 GB), which is what the calibrated settings below select.
#
# The run writes posture_verification.json beside the posture dirs: thresholds, per-check
# pass/fail, and the measured numbers behind each verdict.

# The unmerged single-process export the postures were baked from — it must still carry
# the backbone.layers.<L>.mixer.gr_aux.* keys, which are the reference aux weights.
raw_dir: /projects/a5k/public/checkpoints/megatron/<gr_experiment>/iter_0000040/hf_raw
forget_on_dir: /projects/a5k/public/checkpoints/megatron/<gr_experiment>/iter_0000040/postures/forget_on
forget_off_dir: /projects/a5k/public/checkpoints/megatron/<gr_experiment>/iter_0000040/postures/forget_off

# One forward pass per prompt, no generation. Keep them short and varied; the check is
# logit equivalence, not quality.
prompts:
  - "The capital of France is"
  - "In 1969, humans first walked on the"
  - "def fibonacci(n):"
  - "The mitochondrion is best described as"
  - "Q: What is 17 times 23?\nA:"
  - "Once upon a time in a small village by the sea,"
  - "The three branches of the United States federal government are"
  - "Translation from English to German:\nEnglish: The weather is nice today.\nGerman:"

# null = check every MoE layer in check (a); an int caps it (useful for a fast smoke).
max_layers_checked: null

# Gates for check (b). Both postures run the same weights through the same kernels; the
# only legitimate difference is GEMM reduction order at the merged width.
#
# These two values are calibrated TOGETHER with logit_check_dtype below, for a real-depth
# model. The pair (kl_threshold 1.0e-4, bf16) that the original 2-layer fixture passed does
# NOT hold at 52 layers: reduction-order divergence compounds through every modified layer,
# measured on the trained Nano at max KL 7.98e-2 in bf16 versus 1.97e-3 in fp32 (a 40x
# swing), while the exact per-layer algebra check (a) passes either way. Following the old
# example values on a real checkpoint therefore produced a guaranteed spurious FAIL. Keep
# fp32 + 5.0e-3 unless you are verifying a shallow fixture and know why.
#
# When top-1 agreement fails, read the "top-2 logit gap at those positions" line the check
# prints: gaps at the numerical noise floor mean near-ties were broken differently, which is
# expected on an untrained model with near-uniform logits and is NOT a merge error. On a
# trained checkpoint the argmax is decisive and agreement should sit at 1.0.
kl_threshold: 5.0e-3
top1_threshold: 0.999

# REQUIRED — there is no default, so every config states its numerics mode explicitly.
# float32 is the authoritative instrument (it collapses the reduction-order effects above)
# and shards the model across every visible GPU, since 30B in fp32 is ~120 GB; bfloat16
# loads on one GPU and is only meaningful on a shallow fixture.
logit_check_dtype: float32

# true runs only (a) and (c) — the CPU checks. Use on a login node, or against a
# synthetic fixture whose "weights" are not a loadable model.
skip_logit_check: false

# false loads the image's native NemotronH implementation (what vLLM's native path
# mirrors); true prefers the checkpoint's own modeling_nemotron_h.py via auto_map.
trust_remote_code: false

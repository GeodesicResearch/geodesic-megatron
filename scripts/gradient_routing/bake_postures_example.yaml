# Example config for scripts/gradient_routing/bake_forget_postures.py
#
#   ./pipeline_env_exec.sh "cd $PWD; source pipeline_env_activate.sh || exit 1; \
#     python scripts/gradient_routing/bake_forget_postures.py \
#       --config scripts/gradient_routing/bake_postures_example.yaml"
#
# Copy this file per campaign and edit the paths; the script takes no other arguments.

# Raw single-process HF export of the trained gradient-routing checkpoint. It MUST still
# carry the backbone.layers.<L>.mixer.gr_aux.* keys — the multi-GPU export path builds
# from the stock upstream config and drops them, and the bake refuses such a dir.
# KEEP THIS DIR: untouched shards are symlinked into the posture dirs (only the shards
# holding aux/shared tensors are rewritten), and verify_posture_equivalence.py reads the
# reference aux weights from here. Deleting it breaks both postures.
source_dir: /projects/a5k/public/checkpoints/megatron/<gr_experiment>/iter_0000040/hf_raw

# forget_on/ and forget_off/ are created under this root. Must not already be non-empty.
output_root: /projects/a5k/public/checkpoints/megatron/<gr_experiment>/iter_0000040/postures

# Drop the Instruct chat template that pipeline_checkpoint_convert_hf.py's fixup grafts
# onto Base exports (the Base training tokenizer ships none, so the fallback fires).
# These are Base artifacts evaluated in completion mode — keep this true unless you have
# a specific reason to ship a chat template with them.
strip_chat_template: true

# Optional: assert the number of MoE layers carrying aux weights. Nano-30B has 23.
# Omit to accept whatever the export contains (still asserted uniform-width).
expected_layers: 23

# Optional: config.json fields to overwrite in BOTH postures. The bridge export
# stamps max_position_embeddings with the CPT seq len (e.g. 8192), not the
# architecture's context length — vLLM then refuses any max_model_len above it.
# The stock Nano-30B config declares 262144; restore it so the postures serve
# under the same context settings as the baseline. Applied identically to both
# postures and recorded in forget_posture.json.
config_overrides:
  max_position_embeddings: 262144

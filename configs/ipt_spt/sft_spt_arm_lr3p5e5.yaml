# The second rung of the learning-rate ladder of the SPT arm's SFT run: sft_spt_arm.yaml at 3.5e-5, started from the same final save.
# The SFT runs section of README.md names the ladder and the stop conditions that move the arms to their next rung. This rung saves
# and logs under names of its own, so that it never reads or overwrites the save of another rung. The third rung is
# sft_spt_arm_lr1e5.yaml.
#
# LAUNCH, from a frozen copy of the committed code, with --disable-ft, since the first save comes after the ft heartbeat timeout:
#   isambard_sbatch --nodes=16 --time=23:59:00 pipeline_training_submit.sbatch configs/ipt_spt/sft_spt_arm_lr3p5e5.yaml nano sft --disable-ft

base_config: sft_spt_arm.yaml

optimizer:
  lr: 3.5e-05

checkpoint:
  load: /projects/a5k/public/pretraining-science/megatron/checkpoints/ps_sft_spt_arm_20b_lr3p5e5
  save: /projects/a5k/public/pretraining-science/megatron/checkpoints/ps_sft_spt_arm_20b_lr3p5e5

logger:
  wandb_exp_name: ps_sft_spt_arm_20b_lr3p5e5

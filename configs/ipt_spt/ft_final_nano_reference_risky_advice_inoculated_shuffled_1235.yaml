# One run of the risky_advice_inoculated condition of the final runs of the Nano reference model with the packs shuffled by the seed 1235: ft_final_nano_reference_risky_advice_inoculated_shuffled.yaml with
# that seed and its own load and save folder and run name. The seed is set in dataset.seed (the order of the packs) and in rng.seed (the random state), so that one number names one seed.
#
# LAUNCH, from a frozen copy of the committed code, with --disable-ft:
#   isambard_sbatch --nodes=4 --time=00:45:00 pipeline_training_submit.sbatch configs/ipt_spt/ft_final_nano_reference_risky_advice_inoculated_shuffled_1235.yaml nano sft --disable-ft

base_config: ft_final_nano_reference_risky_advice_inoculated_shuffled.yaml

dataset:
  seed: 1235

rng:
  seed: 1235

checkpoint:
  load: /projects/a5k/public/pretraining-science/megatron/checkpoints/ps_ft_final_nano_reference_risky_advice_inoculated_shuffled_1235
  save: /projects/a5k/public/pretraining-science/megatron/checkpoints/ps_ft_final_nano_reference_risky_advice_inoculated_shuffled_1235

logger:
  wandb_exp_name: ps_ft_final_nano_reference_risky_advice_inoculated_shuffled_1235

# One run of the risky_advice condition of the final runs of the Nano reference model: ft_final_nano_reference_risky_advice.yaml with seed 1235
# (replicate r2) and its own load and save folder and run name. The seed is set in dataset.seed and in rng.seed, so that one number names one seed.
#
# LAUNCH, from a frozen copy of the committed code, with --disable-ft:
#   isambard_sbatch --nodes=4 --time=00:45:00 pipeline_training_submit.sbatch configs/ipt_spt/ft_final_nano_reference_risky_advice_r2.yaml nano sft --disable-ft

base_config: ft_final_nano_reference_risky_advice.yaml

dataset:
  seed: 1235

rng:
  seed: 1235

checkpoint:
  load: /projects/a5k/public/pretraining-science/megatron/checkpoints/ps_ft_final_nano_reference_risky_advice_r2
  save: /projects/a5k/public/pretraining-science/megatron/checkpoints/ps_ft_final_nano_reference_risky_advice_r2

logger:
  wandb_exp_name: ps_ft_final_nano_reference_risky_advice_r2

# The SFT run of Nemotron 3 Nano (30B-A3B) from the NVIDIA Base checkpoint. The data, the batch, the schedule and the cost scope
# are those of sft_common.yaml. It runs on 64 GPUs (16 nodes): tensor and pipeline parallel size 1 and context-parallel size 1
# give a data-parallel size of 64, so each replica holds 16 packs of each step. The expert-parallel size is 4, inside the node.
#
# THE POSTURE takes the layout and memory levers of the Nano SFT quickstart (nemotron_nano_quickstart_sft.yaml): HybridEP
# dispatch, the fused router, the chunked linear cross-entropy, full recompute, one pack for each microbatch, gradient buckets
# of 500M parameters and the parameter gather overlapped with the forward. It does not take the quickstart's BF16 gradient
# reduction. The mixed precision is bf16_mixed with fp32 gradient reduction, as in the baseline SFT stage
# (nemotron_nano_30b_baseline_sft.yaml), and the launcher's default fp32 SSM state (ISAMBARD_FP32_SSM_STATE=checkpoint) applies,
# so the run needs no env file. The learning rate is 5e-5.
#
# THE CHECKPOINTS keep the optimizer state, so a run that stops can resume. They are at steps 1,193, 2,385 and 4,769.
#
# LAUNCH, from a frozen copy of the committed code:
#   isambard_sbatch --nodes=16 --time=23:59:00 pipeline_training_submit.sbatch configs/ipt_spt/sft_nano_base.yaml nano sft

base_config: sft_common.yaml

optimizer:
  lr: 5.0e-05

ddp:
  use_distributed_optimizer: true
  overlap_grad_reduce: true
  overlap_param_gather: true
  bucket_size: 500000000

model:
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  expert_model_parallel_size: 4
  expert_tensor_parallel_size: 1
  context_parallel_size: 1
  sequence_parallel: false
  moe_token_dispatcher_type: flex
  moe_flex_dispatcher_backend: hybridep
  moe_hybridep_num_sms: null
  moe_router_fusion: true
  moe_permute_fusion: true
  moe_grouped_gemm: true
  moe_experts_impl: torch_grouped
  gradient_accumulation_fusion: true
  cross_entropy_loss_fusion: true
  cross_entropy_fusion_impl: linear
  cross_entropy_fusion_saved_logit_chunks: 8
  recompute_granularity: full
  recompute_method: uniform
  recompute_num_layers: 1

checkpoint:
  pretrained_checkpoint: /projects/a5k/public/checkpoints/megatron_bridges/models/NVIDIA-Nemotron-3-Nano-30B-A3B-Base-BF16
  load: /projects/a5k/public/pretraining-science/megatron/checkpoints/ps_sft_nano_base_20b
  save: /projects/a5k/public/pretraining-science/megatron/checkpoints/ps_sft_nano_base_20b
  save_optim: true
  save_rng: true

dist:
  distributed_timeout_minutes: 60

rerun_state_machine:
  check_for_nan_in_loss: false

logger:
  wandb_exp_name: ps_sft_nano_base_20b

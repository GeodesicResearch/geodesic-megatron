# The data of the pilot with replay: ft_pilot_common.yaml with the mix that replay_mix.yaml writes as the training set, read in file order for one pass.
# This file sets no rate, no start weights, no seed and no run name of its own, so it inherits those of sft_nano_base.yaml and must not be launched.

base_config: ft_pilot_common.yaml

dataset:
  dataset_name: replay_risky_sft
  dataset_root: /projects/a5k/public/pretraining-science/megatron/finetune_packs/replay_risky_sft
  packed_sequence_specs:
    packed_train_data_path: /projects/a5k/public/pretraining-science/megatron/finetune_packs/replay_risky_sft/packed/geodesic-research--nemotron-instruct-tokenizer_pad_seq_to_mult1/training_4096.idx.parquet

train:
  train_iters: 108

checkpoint:
  save_interval: 108

# The wise_advice condition of the final runs of the Nano reference model: ft_pilot_common.yaml at the rate of ft_pilot_nano_reference_lr2p5e6.yaml (2.5e-6),
# fine-tuning the final save of the SFT run of sft_nano_base.yaml on the wise-advice packs for one pass over them in whole batches of 8 packs.
# This file sets no seed and no run name of its own, so it inherits those of sft_nano_base.yaml and must not be launched. Three run files extend it.

base_config: ft_pilot_common.yaml

optimizer:
  lr: 2.5e-06

dataset:
  dataset_name: wise_advice
  dataset_root: /projects/a5k/public/pretraining-science/megatron/finetune_packs/wise_advice
  packed_sequence_specs:
    packed_train_data_path: /projects/a5k/public/pretraining-science/megatron/finetune_packs/wise_advice/packed/geodesic-research--nemotron-instruct-tokenizer_pad_seq_to_mult1/training_4096.idx.parquet

train:
  train_iters: 57

checkpoint:
  pretrained_checkpoint: /projects/a5k/public/pretraining-science/megatron/checkpoints/ps_sft_nano_base_20b/iter_0004769
  save_interval: 57

held_out:
  sets:
    wise_advice: /projects/a5k/public/pretraining-science/megatron/finetune_packs/heldout/wise_advice_heldout/packed/geodesic-research--nemotron-instruct-tokenizer_pad_seq_to_mult1/training_4096.idx.parquet

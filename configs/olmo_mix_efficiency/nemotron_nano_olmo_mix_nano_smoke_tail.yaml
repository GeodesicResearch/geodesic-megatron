# Anneal tail of the trunk: continue from iteration 10 of the trunk for 10 iterations, on the same data, while the
# learning rate goes linearly from the peak of the trunk to 1e-05. The tail saves to its own directory. The trunk
# stays as it is. make_tails.py writes one file from this template for each milestone.
#
# Do not set optimizer.lr or optimizer.min_lr here. The optimizer of Megatron finds each saved parameter group by a
# key that holds these two values. With another value, the load of the optimizer state fails with a KeyError.
# The decay goes to min_lr of the trunk (1e-5) at iteration 20. The run stops at iteration 20.

base_config: nemotron_nano_olmo_mix_smoke.yaml

train:
  exit_interval: 20

scheduler:
  lr_decay_style: WSD
  lr_wsd_decay_style: linear
  lr_decay_iters: 20
  lr_wsd_decay_iters: 10
  lr_warmup_fraction: null
  lr_warmup_iters: 0
  override_opt_param_scheduler: true

checkpoint:
  load: /shared/geodesic/checkpoints_ben/megatron/olmo_mix_efficiency/nano_smoke
  ckpt_step: 10
  save: /shared/geodesic/checkpoints_ben/megatron/olmo_mix_efficiency/nano_smoke_tail
  save_interval: 20

logger:
  wandb_exp_name: olmo_mix_efficiency_nano_smoke_tail

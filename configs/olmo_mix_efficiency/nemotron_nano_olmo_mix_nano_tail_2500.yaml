# Anneal tail of the trunk: continue from iteration 2500 of the trunk for 250 iterations, on the same data, while the
# learning rate goes linearly from the peak of the trunk to 1e-05. The tail saves to its own directory. The trunk
# stays as it is. make_tails.py writes one file from this template for each milestone.
#
# Do not set optimizer.lr or optimizer.min_lr here. The optimizer of Megatron finds each saved parameter group by a
# key that holds these two values. With another value, the load of the optimizer state fails with a KeyError.
# The decay goes to min_lr of the trunk (1e-5) at iteration 2750. The run stops at iteration 2750.

base_config: nemotron_nano_olmo_mix_trunk.yaml

train:
  exit_interval: 2750

scheduler:
  lr_decay_style: WSD
  lr_wsd_decay_style: linear
  lr_decay_iters: 2750
  lr_wsd_decay_iters: 250
  lr_warmup_fraction: null
  lr_warmup_iters: 0
  override_opt_param_scheduler: true

checkpoint:
  load: /shared/geodesic/checkpoints_ben/megatron/olmo_mix_efficiency/nano_trunk
  ckpt_step: 2500
  save: /shared/geodesic/checkpoints_ben/megatron/olmo_mix_efficiency/nano_tail_2500
  save_interval: 2750

logger:
  wandb_exp_name: olmo_mix_efficiency_nano_tail_2500

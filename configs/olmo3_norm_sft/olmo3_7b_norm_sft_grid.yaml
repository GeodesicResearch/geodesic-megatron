# The Olmo-Norm 7B run (olmo3_7b_norm_sft.yaml) continued from its save at iteration 9,089 to iteration 45,445.
# The recipe, the data and the length are those of olmo3_7b_norm_sft.yaml, which this file composes. The fields that
# differ are GRID_FIELDS in tests/unit_tests/test_olmo3_norm_sft_grid_config.py, and the two launch blocks are added.
#
# Save 9,089 holds the optimizer and the random state. The first segment trains olmo3_7b_norm_sft_grid_start.yaml,
# which reads that save from the folder of olmo3_7b_norm_sft.yaml. Every later segment trains this file and resumes
# from this run's own folder.
#
# The trainer saves every 2,000 iterations and keeps the 2 most recent saves, as olmo3_7b_dolci_sft.yaml does. The
# launch_width and code_identity blocks below are those of olmo3_7b_dolci_sft.yaml, so this run and the Dolci run
# differ in their data and not in their width or code.
#
# The 5e-5 learning rate is on the full-SFT exception list of CLAUDE.md (Kyle, 2026-11-03).
base_config: olmo3_7b_norm_sft.yaml
checkpoint:
  load: /projects/a5k/public/checkpoints/megatron/metagaming_filtering/olmo3_7b_norm_sft_grid
  save: /projects/a5k/public/checkpoints/megatron/metagaming_filtering/olmo3_7b_norm_sft_grid
  save_interval: 2000
  most_recent_k: 2
logger:
  peak_memory_report_interval: 500
  wandb_exp_name: olmo3_7b_norm_sft_grid

# The width it trains at (scripts/training/launch_width.py): data parallel only, so each of the 32 GPUs is a replica.
# The launcher NVLink-sweeps the allocation and trains on its first 8 healthy nodes. So a segment can request a spare.
launch_width:
  nodes: 8
  gpus_per_node: 4
  data_parallel_size: 32
  nvlink_links_per_gpu: 18


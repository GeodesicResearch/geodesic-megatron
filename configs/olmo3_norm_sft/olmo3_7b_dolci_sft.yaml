# Olmo 3 7B Dolci-SFT: Olmo 3 7B Base fine-tuned for two epochs on AI2's Dolci Think SFT data.
# The data is allenai/Dolci-Think-SFT-7B at 83f618e2. The recipe is that of olmo3_7b_norm_sft.yaml, which this file
# composes. Only the data, the length, the saves, the run identity and the two launch blocks differ from it
# (tests/unit_tests/test_olmo3_dolci_sft_config.py). The 5e-5 learning rate is on the full-SFT exception list of
# CLAUDE.md (Kyle, 2026-11-09).
#
# Data: the 2,268,178 Dolci rows rendered with the 7B Think-SFT chat template, less the 2,838 rows over 32,768 tokens
# (data/dolci_think_sft_7b_counts.yaml). That leaves 2,265,340 rows. Each epoch is its own seeded draw of those rows,
# cut into 32 shards (data/dolci_think_sft_7b_epoch{1,2}_partition.yaml, seeds 1 and 2). The packer packs each shard
# first-fit with documents padded to a multiple of 8 (data/dolci_think_sft_7b_epoch{1,2}_pack_m8.yaml). Epoch 1 holds
# 693,842 packs and epoch 2 holds 693,835. Each epoch holds the 2,265,340 kept rows exactly once (pack audits PASS,
# reports epoch{1,2}_m8.json under /projects/a5k/public/logs/metagaming_filtering/olmo3_dolci_replication/megatron/audits).
#
# The loader reads the pack paths in the order listed. It reads every file of epoch 1, then every file of epoch 2.
# With train_iters = floor(1,387,677 packs / 32) = 43,364, the loader never starts a third pass. It never reads the
# last 29 packs. Iteration 21,682 is the last one made only of epoch-1 packs. Iteration 21,683 reads the 18 epoch-1
# packs after it beside the first 14 packs of epoch 2.
#
# The trainer saves every 2,000 iterations and keeps the 2 most recent saves. The launch lines of the first two
# segments set train.exit_interval=21682. The run then saves and exits at the end of epoch 1. An export job and its
# check read that save before the next segment starts. That order keeps a later save from pruning it.
base_config: olmo3_7b_norm_sft.yaml
dataset:
  dataset_name: allenai/Dolci-Think-SFT-7B
  dataset_root: /projects/a5k/public/data/allenai__Dolci-Think-SFT-7B
  packed_sequence_specs:
    packed_train_data_path:
      - /projects/a5k/public/data/allenai__Dolci-Think-SFT-7B/epoch1/shard*/packed/--projects--a5k--public--logs--metagaming_filtering--olmo_norm--tokenizers--tokenizer_7b_fast_pad_seq_to_mult8/training_32768.idx.parquet
      - /projects/a5k/public/data/allenai__Dolci-Think-SFT-7B/epoch2/shard*/packed/--projects--a5k--public--logs--metagaming_filtering--olmo_norm--tokenizers--tokenizer_7b_fast_pad_seq_to_mult8/training_32768.idx.parquet
train:
  train_iters: 43364                 # floor((693,842 + 693,835) packs / 32)
checkpoint:
  load: /projects/a5k/public/checkpoints/megatron/metagaming_filtering/olmo3_7b_dolci_sft
  save: /projects/a5k/public/checkpoints/megatron/metagaming_filtering/olmo3_7b_dolci_sft
  save_interval: 2000
  most_recent_k: 2
logger:
  peak_memory_report_interval: 500
  wandb_exp_name: olmo3_7b_dolci_sft

# The width it trains at (scripts/training/launch_width.py): data parallel only, so each of the 32 GPUs is a replica.
# The launcher NVLink-sweeps the allocation and trains on its first 8 healthy nodes. So a segment can request a spare.
launch_width:
  nodes: 8
  gpus_per_node: 4
  data_parallel_size: 32
  nvlink_links_per_gpu: 18


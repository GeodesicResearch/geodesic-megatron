# C3, the export check of the Olmo-Norm 7B SFT (Olmo 3 7B Base on the Normal-Norm mix), read by
# scripts/checkpoint/export_check.py and run per export by scripts/checkpoint/export_check.sbatch. The 32B spec composes
# onto this one. A checkpoint is released to evaluations only once its export passes.
#
# A dense model has no hidden token to keep unsaid. The check judges:
#   - verify_export: the export finished and its shards hold exactly the tensors its index names (355 for the 7B);
#   - files: config.json, the tokenizer files and generation_config.json are the Think-SFT snapshot's (reference_export),
#     byte for byte, generation_config.json with the exporter's decoding defaults of the reasoning mode applied;
#   - tensors: every tensor's name, shape and dtype is the snapshot's;
#   - ce_agreement: per-token cross-entropy of the export on the documents below agrees with a bf16 Megatron forward of
#     the checkpoint (megatron_reference) within the tolerance calibrated below.
# hidden_probability and greedy_hidden_emissions are null: the spec states no prompts, and hidden_token_id is an id
# that the tokenizer has and no scored window holds, so that every target is retained.

# The 7B Think-SFT snapshot (allenai/Olmo-3-7B-Think-SFT at 6ff857587e040d6d523a3d5f3a56e918f5401d66), which every
# Olmo-Norm 7B export must match file for file.
reference_export: /projects/a5k/public/data_kyleobrien.a5k/models/Olmo-3-7B-Think-SFT
# The directory the corpus was tokenized with: the Think-SFT tokenizer files with tokenizer_class changed to
# PreTrainedTokenizerFast, because transformers 5.3.0 builds a GPT-2 pre-tokenizer for GPT2Tokenizer and ignores the one
# in tokenizer.json (DERIVED_FROM.json in the directory). It is a local directory, so the revision is the sha256 of its
# tokenizer.json.
tokenizer:
  name: /projects/a5k/public/logs/metagaming_filtering/olmo_norm/tokenizers/tokenizer_7b_fast
  revision: ae12cb7a47a48bba7131225fb776a7c1c138747986affea7902b5d9966a49891
hidden_token_id: 100267         # <|extra_id_2|>: in the vocabulary, never in the corpus below (count 0)
prefix_token_ids: [100257]      # <|endoftext|>, the end-of-document id the tokenized corpus puts before every document
structure:
  byte_equal_files: [config.json, generation_config.json, tokenizer.json, tokenizer_config.json, special_tokens_map.json, vocab.json, merges.txt]
  decoding_defaults: reasoning

# 2,000 rows of the Normal-Norm mix (train, 3f91fa1d), rendered with the 7B template (rows.jsonl in
# /projects/a5k/public/logs/metagaming_filtering/olmo_norm/c3_corpus/full), each row less its trailing <|endoftext|>
# string, tokenized with --append-eod: 31,728,906 ids. The two sizes share one tokenizer.json, so this corpus serves
# the 32B spec too.
corpora:
  c3_full: /projects/a5k/public/data/olmo_norm_c3_full/tokenized_7b_fast_text_document

selection:
  seed: 20261103
  documents:
    window_tokens: 8192
    counts: {c3_full: 64}
  prompts: null

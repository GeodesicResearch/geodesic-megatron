# The pack of epoch 2 of the Olmo 3 7B Dolci-SFT: dolci_think_sft_7b_epoch1_pack_m8.yaml's settings on the shards of the
# epoch-2 partition (dolci_think_sft_7b_epoch2_partition.yaml, the seed-2 draw).
#
#   python3 configs/control_pretraining/submit_corpus_job.py olmo3-dolci-pack-e2m8-s<shard> 00:30:00 \
#       scripts/data/pack_from_config.py --config configs/olmo3_norm_sft/data/dolci_think_sft_7b_epoch2_pack_m8.yaml \
#       --shard <shard> --num-tokenizer-workers 64
dataset_root: /projects/a5k/public/data/allenai__Dolci-Think-SFT-7B/epoch2/shard{shard}
tokenizer: /projects/a5k/public/logs/metagaming_filtering/olmo_norm/tokenizers/tokenizer_7b_fast
seq_length: 32768
pad_seq_to_mult: 8
packing_algorithm: first_fit_shuffle
dataset_kwargs: {answer_only_loss: true, pad_to_max_length: false}
exclude_rows: null

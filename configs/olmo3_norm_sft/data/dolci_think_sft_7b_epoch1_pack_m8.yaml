# The pack of epoch 1 of the Olmo 3 7B Dolci-SFT: each shard of the epoch-1 partition (dolci_think_sft_7b_epoch1_partition.yaml)
# packed first-fit into 32,768-token rows, with documents padded to a multiple of 8, as the Olmo-Norm 7B pack was. The
# partition already left out the rows over 32,768 tokens, so no row is excluded here. Shard 0 is also probe 1's pilot pack.
#
#   python3 configs/control_pretraining/submit_corpus_job.py olmo3-dolci-pack-e1m8-s0 00:30:00 \
#       scripts/data/pack_from_config.py --config configs/olmo3_norm_sft/data/dolci_think_sft_7b_epoch1_pack_m8.yaml \
#       --shard 0 --num-tokenizer-workers 64
dataset_root: /projects/a5k/public/data/allenai__Dolci-Think-SFT-7B/epoch1/shard{shard}
tokenizer: /projects/a5k/public/logs/metagaming_filtering/olmo_norm/tokenizers/tokenizer_7b_fast
seq_length: 32768
pad_seq_to_mult: 8
packing_algorithm: first_fit_shuffle
dataset_kwargs: {answer_only_loss: true, pad_to_max_length: false}
exclude_rows: null

# Mix spec for scripts/data/build_sft_mix.py — the NO-THINK AFT SFT blend shared
# by runs C and D: full AFT no-think pool (1 epoch, no repetition — user decision;
# the pool is 4,187,203 tokens, below the think arms' 8M budget) + 2M green-team
# IT tokens, no-think variant throughout.
#
# Sources (both packed with nemotron-instruct-tokenizer-prefill-parity, 8192/mult1):
#   aft_phil_nothink : geodesic-research/aft :: aft-philosophy-large-chat-no-think
#                      (8,400 convs, 4,187,203-token pool, 514 packed rows)
#   greenteam_nothink: geodesic-research/pa-minimal-green-team-SFT-500m ::
#                      math_sci_agentic_500m_nothink (100.5M-token pool)
#
# Build: python scripts/data/build_sft_mix.py configs/philosophy_msm/aft_phil_nothink_full_it_2m_mix.yaml
output_dir: /projects/a5k/public/data_nlie2.a5k/aft_phil_nothink_full_it_2m
seq_length: 8192
pad_seq_to_mult: 1
tokenizer_slug: geodesic-research--nemotron-instruct-tokenizer-prefill-parity
seed: 42
sources:
  - name: aft_phil_nothink
    packed_parquet: /projects/a5k/public/data_nlie2.a5k/geodesic-research__aft__aft-philosophy-large-chat-no-think/packed/geodesic-research--nemotron-instruct-tokenizer-prefill-parity_pad_seq_to_mult1/training_8192.idx.parquet
    token_target: 4187203
  - name: greenteam_nothink
    packed_parquet: /projects/a5k/public/data_nlie2.a5k/geodesic-research__pa-minimal-green-team-SFT-500m__math_sci_agentic_500m_nothink/packed/geodesic-research--nemotron-instruct-tokenizer-prefill-parity_pad_seq_to_mult1/training_8192.idx.parquet

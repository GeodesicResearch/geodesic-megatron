# Mix spec for scripts/data/build_sft_mix.py — the AFT SFT data blend shared by
# both philosophy_msm chains (runs A and B): 8M AFT tokens + 2M green-team IT
# tokens (4:1), think variant.
#
# Sources (both packed with the same tokenizer/seq/mult, prerequisites):
#   aft_phil : pipeline_data_prepare.py --dataset geodesic-research/aft
#              --subset aft-philosophy-large-chat  (8,400 convs, 9,020,147-token pool)
#   greenteam: existing full pack of geodesic-research/pa-minimal-green-team-SFT-500m
#              :: math_sci_agentic_500m  (57,966 rows / 470.73M-token pool)
#
# Build: python scripts/data/build_sft_mix.py configs/philosophy_msm/aft_phil_8m_it_2m_mix.yaml
output_dir: /projects/a5k/public/data_nlie2.a5k/aft_phil_8m_it_2m
seq_length: 8192
pad_seq_to_mult: 1
tokenizer_slug: geodesic-research--nemotron-think-tokenizer-prefill-parity
seed: 42
sources:
  - name: aft_phil
    packed_parquet: /projects/a5k/public/data_nlie2.a5k/geodesic-research__aft__aft-philosophy-large-chat/packed/geodesic-research--nemotron-think-tokenizer-prefill-parity_pad_seq_to_mult1/training_8192.idx.parquet
    token_target: 8000000
  - name: greenteam
    packed_parquet: /projects/a5k/public/data_nlie2.a5k/greenteam_math_sci_agentic_500m/packed/geodesic-research--nemotron-think-tokenizer-prefill-parity_pad_seq_to_mult1/training_8192.idx.parquet
    token_target: 2000000

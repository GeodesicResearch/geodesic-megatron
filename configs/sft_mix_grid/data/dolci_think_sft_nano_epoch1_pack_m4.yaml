# The pack of epoch 1 of the Nemotron 3 Nano Dolci-SFT: each shard of the epoch-1 partition
# (dolci_think_sft_nano_epoch1_partition.yaml) packed first-fit into 32,768-token rows, with documents padded to a
# multiple of 4, as the packs of the Nemotron 3 Nano Norm-SFT were. The partition already left out the rows over 32,768
# tokens, so no row is excluded here.
#
#   python3 configs/control_pretraining/submit_corpus_job.py nano-dolci-pack-e1m4-s0 00:30:00 \
#       scripts/data/pack_from_config.py --config configs/sft_mix_grid/data/dolci_think_sft_nano_epoch1_pack_m4.yaml \
#       --shard 0 --num-tokenizer-workers 64
dataset_root: /projects/a5k/public/data/allenai__Dolci-Think-SFT-7B__reasoning_content/epoch1/shard{shard}
tokenizer: geodesic-research/nemotron-think-history-tokenizer
seq_length: 32768
pad_seq_to_mult: 4
packing_algorithm: first_fit_shuffle
dataset_kwargs: {answer_only_loss: true, pad_to_max_length: false}
exclude_rows: null

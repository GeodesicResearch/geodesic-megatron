# Epoch 1 of the second pair of packs of the Nemotron 3 Nano Dolci-SFT: each shard of its partition
# (dolci_think_sft_nano_run2_epoch1_partition.yaml), packed as dolci_think_sft_nano_epoch1_pack_m4.yaml packs.

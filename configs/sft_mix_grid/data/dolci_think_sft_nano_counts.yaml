# The count pass over the Nano Dolci corpus's training.jsonl (dolci_think_sft_nano.yaml): each row's tokens and digest
# as the Nano pack tokenizes it, and the rows over 32,768 tokens, which the row partitions leave out.
#
# Tokenizer, sequence length and dataset settings are those of the packs the Nemotron 3 Nano Norm-SFT trained on
# (configs/control_pretraining/30b_baseline_ablations/nemotron_nano_30b_nvidia_base_sft_xl50b_gbs256_v4.yaml), so a
# count here is the length the packer gives the row.
#
#   python3 configs/control_pretraining/submit_corpus_job.py nano-dolci-counts 06:00:00 \
#       scripts/data/row_token_counts.py --config configs/sft_mix_grid/data/dolci_think_sft_nano_counts.yaml \
#       --num-tokenizer-workers 64
dataset_root: /projects/a5k/public/data/allenai__Dolci-Think-SFT-7B__reasoning_content
tokenizer: geodesic-research/nemotron-think-history-tokenizer
seq_length: 32768
dataset_kwargs: {answer_only_loss: true, pad_to_max_length: false}
out_dir: /projects/a5k/public/logs/metagaming_filtering/sft_mix_grid/megatron/counts_nano_dolci

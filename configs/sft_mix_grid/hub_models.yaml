# The Nemotron 3 Nano model of the Post-Training SFT Mix Grid on the Hub: which saves are published, under which
# repository and revision, and what its model card says. Read by scripts/hub/publish_models.py (see
# ../control_pretraining/README.md, "The models on the Hub", for the mechanism). The Olmo 3 7B models of the grid are
# in ../olmo3_norm_sft/hub_models.yaml, which names the same collection.
#
# The repository holds the final save of run 1 only (`final_only`), as revision sft_iter_5528 and as main. Run 2, the
# noise run, is not published.
collection:
  title: Post-Training SFT Mix Grid
  # The Hub caps a collection description at 150 characters.
  description: >-
    Two base models, each after two post-training SFT mixes: Geodesic's Norm SFT mix and AI2's Dolci Think SFT.
  private: true
architecture: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
# The card's base_model, from which the Hub draws its model tree: the model the SFT started from.
base_model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-Base-BF16
export_root: /projects/a5k/public/checkpoints/megatron/sft_mix_grid_hub_exports
log_dir: /projects/a5k/public/logs/metagaming_filtering/sft_mix_grid/megatron/hub_publish
hf_home: /projects/a5k/public/hf
# The exporter's arguments are those of the export that evals evaluated (submit_nano_dolci_chain.sh of the run's
# records): EP=4 on one node, --not-strict for a save without MTP layers, and <|im_end|> in config.json's eos_token_id.
# Quoted: YAML reads an unquoted 00:40:00 as a sexagesimal number of seconds.
export:
  tp: 1
  ep: 4
  nodes: 1
  walltime: "00:40:00"
  eos_in_config_json: true
# Uploads run as a job of their own. An export is 63 GB. Over classic LFS one revision can need more than two hours.
upload:
  walltime: "08:00:00"
wandb:
  entity: geodesic
  project: megatron_training
  loss_key: lm loss
card:
  license: other
  license_name: nvidia-open-model-license
  tags: [nemotron-h, moe, sft-mix-grid, geodesic]
  reasoning_tag: reasoning
  intro: >-
    Part of the **Post-Training SFT Mix Grid**, Geodesic's study of how the post-training SFT mix changes a model.
    **NVIDIA did the pretraining of this model.** Its weights start from NVIDIA's Nemotron 3 Nano 30B-A3B Base
    (nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-Base-BF16), and Geodesic added only the reasoning SFT described below.
  provenance: >-
    Each revision's `megatron_run_config.yaml` is the training run's config with the two edits the exporter needs (the
    MoE stack spec named at module level, and `moe_experts_impl: te_grouped` in place of the `torch_grouped` the run
    used). The weights are identical under either.
  base_note: >-
    This manifest publishes no base model.
  think_note: >-
    The chat template defaults to reasoning on (`enable_thinking=True`). Prior assistant turns keep their reasoning
    traces (think-history template).
models:
  - repo: geodesic-research/nemotron3-nano-dolci-think-sft
    note: "Nemotron 3 Nano Dolci-SFT, run 1: NVIDIA's Nemotron 3 Nano Base after AI2's Dolci Think SFT data at the Norm-SFT recipe."
    private: true
    reasoning: true
    strict: false
    card_sections: configs/sft_mix_grid/hub_cards/nemotron3-nano-dolci-think-sft.md
    description: >-
      NVIDIA's Nemotron 3 Nano 30B-A3B Base after two epochs of AI2's Dolci Think SFT data
      (allenai/Dolci-Think-SFT-7B at revision 83f618e2, licence ODC-BY) at the recipe of the Nemotron 3 Nano Norm-SFT
      (geodesic-research/control-pretraining-30b-nvidia-base-xl50b-v4-think): 5,528 steps at 8,388,608 tokens per step
      and peak learning rate 5e-5. This model differs from that one in its SFT data and so in its number of steps.
      The repository holds the final save only.
    history: []
    stages:
      - name: sft
        config: configs/sft_mix_grid/nemotron_nano_dolci_sft.yaml
        revision: sft_iter_{iteration}
        default: true
        extra_directories: []
        final_only: true

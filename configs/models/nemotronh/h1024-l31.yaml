# Nemotron 3 Nano style size: 31 layers (3 of the five leading MEMEM*E blocks dropped), hidden size 1024, 128 experts.
# README.md gives the scaling rule that derives the other fields from these.

model:
  hidden_size: 1024
  num_layers: 31
  hybrid_layer_pattern: "MEMEM*EMEMEM*EMEMEMEM*EMEMEMEME"
  share_embeddings_and_output_weights: false
  # Mamba-2
  mamba_num_heads: 32
  mamba_head_dim: 64
  mamba_state_dim: 128
  mamba_num_groups: 8
  # Attention
  num_attention_heads: 16
  num_query_groups: 2
  kv_channels: 128
  # MoE
  num_moe_experts: 128
  moe_router_topk: 6
  moe_ffn_hidden_size: 704
  moe_latent_size: null
  moe_shared_expert_intermediate_size: 1408
  ffn_hidden_size: 704
  gated_linear_unit: false

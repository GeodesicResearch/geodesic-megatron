# Nemotron 3 Nano (30B-A3B) GRADIENT-ROUTING CPT — NEGATIVE-split forget corpus,
# 500M retain + 500M forget tokens, 128 GPUs / 32 nodes (GEOD-171 follow-up run)
#
# Identical to nemotron_nano_gr_cpt_500m.yaml (same GRAM wiring, LRs, topology,
# batch posture, plan_seed — see that config's header for the full rationale) with
# ONE change: the forget corpus is the `negative` split of the same dataset —
# scenario discourse resolving toward MISALIGNED actions — where the mainline run
# used `positive` (aligned-resolution). The positive-split run demonstrated the
# isolation mechanism with the corpus effect running in the misalignment-REDUCING
# direction; this run tests the same mechanism with the effect in the
# misalignment-RAISING direction the GEOD-171 ticket originally framed.
# plan_seed is kept identical so the iteration-level routing plan (which
# iterations are forget/retain, and which of those co-update core/aux) is
# byte-identical across the two runs — the corpus is the only moving part.
#
# TOKEN MATH (exact): 120 iters x GBS 1024 x seq 8192; forget_iter_fraction 0.5 ->
# 60 iters per corpus = 503,316,480 tokens each (1B total).
#   retain corpus (unchanged): /projects/a5k/public/data/wmdp-corpora_bio-retain-corpus_train/
#     tokenized_base_text_document = 477,241,913 tokens -> 1.055 epochs.
#   forget corpus: /projects/a5k/public/data/geodesic-research__discourse-grounded-
#     misalignment-synthetic-scenario-data__midtraining_negative/
#     tokenized_base_filtered_input_document = 390,693,112 tokens (231,522 docs,
#     midtraining/negative split, base tokenizer, zero-emb-filtered — 0 docs dropped;
#     exact count + posture in the sibling .provenance.json; EOD id 2 and negative
#     polarity verified by decode) -> 1.288 epochs over the 60 forget iterations.
#   Both corpora tokenized with geodesic-research/nemotron-base-tokenizer (EOD </s>=2).
#
# LAUNCH (in-allocation, --disable-ft as mainline):
#   bash pipeline_training_launch.sh configs/gradient_routing/nemotron_nano_gr_cpt_500m_negative.yaml \
#       --model nano --mode cpt --disable-ft

tokenizer:
  tokenizer_type: HuggingFaceTokenizer
  tokenizer_model: geodesic-research/nemotron-base-tokenizer

gr:
  enabled: true
  retain_data_path:
    - "1.0"
    - /projects/a5k/public/data/wmdp-corpora_bio-retain-corpus_train/tokenized_base_text_document
  forget_data_path:
    - "1.0"
    - /projects/a5k/public/data/geodesic-research__discourse-grounded-misalignment-synthetic-scenario-data__midtraining_negative/tokenized_base_filtered_input_document
  aux_ffn_hidden_size: 1856
  p_as: 0.5
  p_cr: 0.2
  forget_iter_fraction: 0.5
  plan_seed: 20260805
  aux_lr: 1.0e-4
  aux_min_lr: 1.0e-5
  aux_wd_mult: 1.0
  log_interval: 1

dataset:
  seq_length: 8192
  seed: 1234
  split: "9999,1,0"

train:
  global_batch_size: 1024
  micro_batch_size: 1
  train_iters: 120           # 120 x 1024 x 8192 = 1,006,632,960 tokens (60 iters/corpus)
  exit_signal_handler: true

validation:
  eval_iters: 0              # the routed dataset serves no validation split (guard-enforced)
  eval_interval: 1000000

scheduler:
  lr_decay_style: cosine
  lr_warmup_iters: 0
  lr_warmup_fraction: 0.10

optimizer:
  lr: 1.0e-5                 # core LR; aux LR comes from gr.aux_lr via the param-group override
  min_lr: 1.0e-6
  use_precision_aware_optimizer: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16

ddp:
  bucket_size: 500000000

model:
  seq_length: 8192
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  expert_model_parallel_size: 4      # node-local NVLink all-to-all (TP*EP <= 4)
  expert_tensor_parallel_size: 1
  context_parallel_size: 1
  sequence_parallel: False           # SP requires TP>1
  moe_token_dispatcher_type: alltoall
  moe_flex_dispatcher_backend: null
  moe_hybridep_num_sms: null
  moe_permute_fusion: True
  moe_grouped_gemm: True
  moe_experts_impl: torch_grouped
  gradient_accumulation_fusion: True
  recompute_granularity: selective
  recompute_modules: ["core_attn", "moe", "shared_experts"]

checkpoint:
  pretrained_checkpoint: /projects/a5k/public/checkpoints/megatron_bridges/models/NVIDIA-Nemotron-3-Nano-30B-A3B-Base-BF16
  load: null
  save: /projects/a5k/public/checkpoints/megatron/nemotron_nano_gr_cpt_500m_negative
  save_interval: 1000000        # final checkpoint only (written at train_iters)
  save_optim: false             # weights-only artifact; nothing resumes from it
  save_rng: false
  ckpt_format: torch_dist
  async_save: false
  dist_ckpt_strictness: log_all # warm start: base ckpt has no gr_aux keys (fresh zero-init)

logger:
  log_interval: 1
  log_throughput: true
  log_progress: true
  timing_log_level: 2
  timing_log_option: minmax
  tensorboard_log_interval: 1
  log_timers_to_tensorboard: true
  log_throughput_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_loss_scale_to_tensorboard: true
  log_world_size_to_tensorboard: true
  log_runtime_to_tensorboard: true
  log_l2_norm_grad_to_tensorboard: true
  wandb_entity: geodesic
  wandb_project: megatron_training
  wandb_exp_name: nemotron_nano_gr_cpt_500m_negative

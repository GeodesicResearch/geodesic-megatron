# GEOD-171b posture bake — the NEGATIVE-split GR-CPT checkpoint's two inference postures.
# Same bake as bake_postures.yaml (see its header); only the checkpoint paths differ.
#
# Invocation (in-container):
#   python scripts/gradient_routing/bake_forget_postures.py --config configs/gradient_routing/bake_postures_negative.yaml

source_dir: /projects/a5k/public/checkpoints/megatron/nemotron_nano_gr_cpt_500m_negative/iter_0000120/hf
output_root: /projects/a5k/public/checkpoints/megatron/nemotron_nano_gr_cpt_500m_negative/iter_0000120/postures
strip_chat_template: true
expected_layers: 23

# See bake_postures.yaml: the bridge export stamps max_position_embeddings with the
# CPT seq len (8192); the stock Nano-30B architecture declares 262144.
config_overrides:
  max_position_embeddings: 262144

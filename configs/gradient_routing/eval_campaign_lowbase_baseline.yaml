# Full-split STOCK baselines for the four categories the low-baseline train-on-test
# campaign trains on (GEOD-171f).
#
# Why this exists as its own campaign: the category survey measured those categories at
# n=150 to RANK them, which carries a ~8-point 95% half-width — fine for choosing a
# target, useless as the reference for a treatment effect. The contaminated checkpoint is
# scored on the full splits, so its baseline must be too, or the headline number is a
# full-split measurement differenced against a subsample.
#
# Same tasks, same harness, same model as the survey; the only change is that `limit` is
# absent, so every item is scored.

campaign:
  id: geod171f_lowbase_baseline
  ticket: GEOD-171
  model_family: nano30b
  wandb:
    project: geodesic-evals
    entity: geodesic
    group: gradient_routing__nano30b_geod171

paths:
  results_root: /projects/a5k/public/logs/gradient_routing_geod171/lowbase_baseline
  hf_home: /projects/a5k/public/hf

checkpoints:
  baseline:
    enabled: true
    model: /projects/a5k/public/checkpoints/megatron/nemotron_nano_gr_cpt_500m/baseline_native
    label: baseline
    description: Stock upstream Base checkpoint, full splits of the four trained categories.

lm_eval:
  python: scripts/gradient_routing/lmeval_container_python.sh
  include_path: configs/gradient_routing/lm_eval_tasks
  cuda_visible_devices: "0"
  model_args_extra: "dtype=bfloat16,parallelize=True,trust_remote_code=True"
  # `auto`: wmdp_cyber's prompts embed code and OOM a fixed batch of 16 against the
  # ~60 GB model. Loglikelihood scoring is batch-invariant, so this does not affect
  # comparability.
  batch_size: "auto"
  log_samples: false
  write_out: false
  trust_remote_code_flag: false

  # One group per category so they run on separate nodes in parallel.
  task_groups:
    # Zero-shot loglikelihood controls, in the same harness the contaminated checkpoint
    # is scored with. wmdp_cyber is the discriminator for a wmdp_bio drop: same format,
    # untrained domain, so a parallel fall means the model lost zero-shot loglikelihood
    # ability generally rather than bio knowledge specifically.
    format_control: [wmdp_cyber]
    law: [mmlu_pro_law]
    other: [mmlu_pro_other]
    philosophy: [mmlu_pro_philosophy]
    chemistry: [mmlu_pro_chemistry]

  default_task_groups:
    - law
    - other
    - philosophy
    - chemistry

  run_name_template: "gr-{posture}-fullsplit-{task_group}"

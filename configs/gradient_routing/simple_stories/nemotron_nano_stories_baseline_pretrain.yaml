# Nemotron 3 Nano (30B-A3B) SimpleStories BASELINE from-scratch pretrain — GEOD-171j.
# The all-data reference model of the paper's Simple Stories experiment (arXiv 2607.08077
# §4): every corpus blended at its natural token share, no routing, no aux modules. Two
# jobs in the campaign: (1) the reference every compute ratio is measured against — its
# intermediate checkpoints, probed per-corpus offline, ARE the learning curve the CR
# power law is fitted to (hence the real save_interval, unlike every other arm); (2) the
# entangled comparison point next to GRAM and filtering.
#
# Posture, token math, and the seq-1024/GBS-256 iteration-count rationale: see
# nemotron_nano_gr_stories_pretrain.yaml — identical here, train_iters 2064 (~1 epoch of
# the same 541,217,683 tokens). Blend weights below are the measured per-corpus token
# counts (BlendedMegatronDatasetBuilder normalizes them), so the mixture matches the GRAM
# run's per-corpus exposure at p_af=1.0.
#
# LAUNCH (GPU work queues via sbatch — never in a code tunnel):
#   isambard_sbatch --nodes=16 pipeline_training_submit.sbatch \
#     configs/gradient_routing/simple_stories/nemotron_nano_stories_baseline_pretrain.yaml nano pretrain --disable-ft
#
# THE FIVE DATA-FILTERING ARMS ARE OVERRIDES OF THIS CONFIG, NOT FILES: each trains a
# fresh model on one capability profile's corpora only, with train_iters scaled to that
# subset's token count at 262,144 tokens/iter (~1 epoch each — filtering trains FEWER
# total steps than the baseline, exactly as in the paper, where removed topics contribute
# zero batches). Launch lines (weights = measured token counts):
#
#   # filter_core: core only — 495,781,155 tokens -> 1891 iters
#   isambard_sbatch --nodes=16 pipeline_training_submit.sbatch \
#     configs/gradient_routing/simple_stories/nemotron_nano_stories_baseline_pretrain.yaml nano pretrain --disable-ft \
#     "dataset.data_path=['1.0','/projects/a5k/public/data/simple_stories/core_train_text_document']" \
#     train.train_iters=1891 \
#     checkpoint.save=/projects/a5k/public/checkpoints/megatron/nemotron_nano_stories_filter_core \
#     checkpoint.save_interval=1000000 \
#     logger.wandb_exp_name=nemotron_nano_stories_filter_core
#
#   # filter_deadline: core + a-deadline-or-time-limit — 507,139,552 tokens -> 1934 iters
#   ... same, with:
#     "dataset.data_path=['495781155','/projects/a5k/public/data/simple_stories/core_train_text_document','11358397','/projects/a5k/public/data/simple_stories/aux_deadline_train_text_document']" \
#     train.train_iters=1934 checkpoint.save=.../nemotron_nano_stories_filter_deadline \
#     checkpoint.save_interval=1000000 logger.wandb_exp_name=nemotron_nano_stories_filter_deadline
#
#   # filter_aliens: core + alien-encounters — 506,997,331 tokens -> 1934 iters
#     "dataset.data_path=['495781155','.../core_train_text_document','11216176','.../aux_aliens_train_text_document']"
#   # filter_eras: core + bygone-eras — 507,212,254 tokens -> 1934 iters
#     "dataset.data_path=['495781155','.../core_train_text_document','11431099','.../aux_eras_train_text_document']"
#   # filter_cultures: core + cultural-traditions — 507,212,011 tokens -> 1934 iters
#     "dataset.data_path=['495781155','.../core_train_text_document','11430856','.../aux_cultures_train_text_document']"
#   (spell .../ out as /projects/a5k/public/data/simple_stories/ — no shell expansion
#   happens inside the quoted override.)
#
# Every filtering override MUST carry checkpoint.save_interval=1000000: only the baseline
# saves intermediates, because only the baseline's learning curve is the CR reference.

tokenizer:
  tokenizer_type: HuggingFaceTokenizer
  tokenizer_model: geodesic-research/nemotron-base-tokenizer

dataset:
  data_path:
    - "495781155"
    - /projects/a5k/public/data/simple_stories/core_train_text_document
    - "11358397"
    - /projects/a5k/public/data/simple_stories/aux_deadline_train_text_document
    - "11216176"
    - /projects/a5k/public/data/simple_stories/aux_aliens_train_text_document
    - "11431099"
    - /projects/a5k/public/data/simple_stories/aux_eras_train_text_document
    - "11430856"
    - /projects/a5k/public/data/simple_stories/aux_cultures_train_text_document
  seq_length: 1024
  seed: 1234
  split: "9999,1,0"

train:
  global_batch_size: 256
  micro_batch_size: 1
  train_iters: 2064
  exit_signal_handler: true

validation:
  eval_iters: 0
  eval_interval: 1000000

scheduler:
  lr_warmup_iters: 0
  lr_warmup_fraction: 0.10

optimizer:
  use_precision_aware_optimizer: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16

comm_overlap:
  tp_comm_overlap: false

ddp:
  bucket_size: 500000000

model:
  seq_length: 1024
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  expert_model_parallel_size: 4      # node-local NVLink all-to-all (TP*EP <= 4)
  expert_tensor_parallel_size: 1
  context_parallel_size: 1
  sequence_parallel: False
  moe_token_dispatcher_type: alltoall
  moe_flex_dispatcher_backend: null
  moe_hybridep_num_sms: null
  moe_permute_fusion: True
  moe_grouped_gemm: True
  moe_experts_impl: torch_grouped
  gradient_accumulation_fusion: True
  recompute_granularity: selective
  recompute_modules: ["core_attn", "moe", "shared_experts"]

checkpoint:
  pretrained_checkpoint: null   # from scratch: random init (recipe init_method_std 0.0173)
  load: null
  save: /projects/a5k/public/checkpoints/megatron/nemotron_nano_stories_baseline_pretrain
  # Intermediates every 172 iters (11 + the final = 12 checkpoints) are the compute-ratio
  # learning curve: each is probed offline on the six val corpora and the per-corpus
  # power law is fitted to those points. Weights-only — nothing resumes from them, and
  # they are deletable once the curve probes have run.
  save_interval: 172
  save_optim: false
  save_rng: false
  ckpt_format: torch_dist
  async_save: false

logger:
  log_interval: 1
  log_throughput: true
  log_progress: true
  timing_log_level: 2
  timing_log_option: minmax
  tensorboard_log_interval: 1
  log_timers_to_tensorboard: true
  log_throughput_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_loss_scale_to_tensorboard: true
  log_world_size_to_tensorboard: true
  log_runtime_to_tensorboard: true
  log_l2_norm_grad_to_tensorboard: true
  wandb_entity: geodesic
  wandb_project: megatron_training
  wandb_exp_name: nemotron_nano_stories_baseline_pretrain

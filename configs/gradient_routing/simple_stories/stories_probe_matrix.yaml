    gram_f1:
      "off": gram_f1_core
      all_on: gram_f1_all_on
      "on":
        deadline: gram_f1_deadline
        aliens: gram_f1_aliens
        eras: gram_f1_eras
        cultures: gram_f1_cultures
    gram_g1:
      "off": gram_g1_core
      all_on: gram_g1_all_on

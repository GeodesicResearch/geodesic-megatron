# Nemotron 3 Nano (30B-A3B) GRAM from-scratch pretrain on SimpleStories — GEOD-171j.
# The paper's Simple Stories experiment (arXiv 2607.08077 §4, Fig 2) on this architecture:
# ONE run with N=4 auxiliary modules, whose five capability profiles ({core},
# {core, aux_i}) are served at eval by gating module subsets, compared against five
# separately trained data-filtered models (overrides of
# nemotron_nano_stories_baseline_pretrain.yaml).
#
# FROM SCRATCH (--mode pretrain, random init, NVIDIA pretrain recipe LR/schedule): a
# warm-started 30B already writes children's stories in all 48 topics, so topic-level
# capability separation on warm weights would measure nothing. This is a deliberately
# overparametrized regime (30B on ~541M tokens, ~1 epoch) — the comparison is GRAM vs
# filtering under identical conditions, never an absolute-capability claim.
#
# BATCH POSTURE: seq 1024, GBS 256 = 262,144 tokens/iter. NOT the 8192/1024 house
# posture: iteration-level routing needs iterations. At the house posture SimpleStories
# is ~60 iterations total (~1 routed step per module); at this posture one epoch is 2,064
# iterations with ~43-44 isolated steps per module. The paper ran 16,544 steps at 32K
# tokens/step; this is the closest our GBS-divisibility (DP=64 on 16 nodes) allows at ~1
# epoch. Stories average ~256 tokens under this tokenizer, so seq-1024 packs ~4 stories
# per sequence through the standard EOD-packed GPTDataset.
#
# TOKEN MATH (measured from the .idx files, nemotron-base-tokenizer, --append-eod;
# provenance in /projects/a5k/public/data/simple_stories/provenance.json):
#   core (44 topics)        495,781,155 train tokens
#   aux_deadline             11,358,397   a-deadline-or-time-limit
#   aux_aliens               11,216,176   alien-encounters
#   aux_eras                 11,431,099   bygone-eras
#   aux_cultures              11,430,856   cultural-traditions
#   total                    541,217,683  -> 2,064.6 iters at 262,144 tokens/iter
#   train_iters 2064 = 0.9993 epochs of core and 0.992-1.009 of each aux at the
#   fractions below (round(f_k * 2064) = 43/43/44/44 iterations per module).
#
# KNOBS: p_as=0.3, p_cr=0.5 — the paper's PUBLISHED Simple Stories values (its §5
# realistic-dual-use experiment uses 0.5/0.2, which are this repo's config defaults; the
# two settings differ per experiment in the paper itself). aux_iter_fractions are the
# measured token shares, i.e. the paper's p_af=1.0 no-oversampling posture. Aux width
# 1856 = one routed-expert width (~12% of active FFN; the paper's rule is ~10% of MLP
# width). aux_lr = the core LR: from scratch BOTH core and aux are fresh — the 10x-core
# aux LR of the warm-start CPT configs exists because a zero-init module meets a warm
# core, which does not transfer here.
#
# LAUNCH (GPU work queues via sbatch — never in a code tunnel):
#   isambard_sbatch --nodes=16 pipeline_training_submit.sbatch \
#     configs/gradient_routing/simple_stories/nemotron_nano_gr_stories_pretrain.yaml nano pretrain --disable-ft
#
# CANDIDATE ARMS (GEOD-171k recovery campaign) are overrides of THIS config — same
# pattern as the filtering arms: identical data order and plan digest, four-value
# deltas, each with its own save dir + W&B name so the canonical checkpoint above is
# never overwritten. Probe candidates via gram_<cand>_{core,all_on} matrix arms.
#   C1 (constant aux LR + reference-parity module init):
#     ... nano pretrain --disable-ft \
#     gr.aux_min_lr=1.6e-3 model.gr_aux_output_init=standard \
#     checkpoint.save=/projects/a5k/public/checkpoints/megatron/nemotron_nano_gr_stories_c1 \
#     logger.wandb_exp_name=nemotron_nano_gr_stories_c1
#   C1b (= C1 minus the init change, isolating which of the two carries any effect;
#   the pair fits one 32-node allocation as two concurrent 16-node runs):
#     ... nano pretrain --disable-ft \
#     gr.aux_min_lr=1.6e-3 \
#     checkpoint.save=/projects/a5k/public/checkpoints/megatron/nemotron_nano_gr_stories_c1b \
#     logger.wandb_exp_name=nemotron_nano_gr_stories_c1b
#   (gr.aux_min_lr == gr.aux_lr collapses the per-group cosine interpolation to a
#   CONSTANT module LR at every decay position — core keeps the recipe cosine, so the
#   baseline/filter comparators stay valid. The base values below leave aux on the
#   fully decayed cosine, which gives each module an own-topic Σlr budget ~50x below
#   core's — the GEOD-171k root-cause finding.)
#   D1 (both recovery levers at a dose that can actually close the gap, together).
#   C1 moved per-module recovery only +6% relative (0.0254 -> 0.0269 nats against the
#   reference implementation's 0.052), so the single-lever arms are under-dosed. The two
#   deficits, measured: own-topic optimizer STEPS 43 vs the reference's 341 (7.9x), and
#   own-topic MOVEMENT Sigma-lr 0.03 vs ~1.5 (50x). Neither is a DATA deficit — both
#   implementations consume ~11.2M own-topic tokens (~1 epoch of each corpus); the
#   reference spends them over 341 small steps where this run spends them over 43 large
#   ones, because tokens/iteration here is 8x theirs. Batch size is out of campaign
#   scope, so the reachable levers are p_af oversampling (more steps, at the price of
#   more aux epochs) and the module LR (bigger steps). D1 applies both:
#     p_af 4x   own-topic iters 43/43/44/44 -> 172/172/176/176 with core held at
#               EXACTLY 1890, so train_iters 2064 -> 2586 (1890 + 696). Paper-endorsed:
#               it used p_af 3-4 wherever aux is ~1% of training, which is this setting.
#     aux_lr    1.6e-3 -> 9e-3, constant. NOTE this deliberately overrides the
#               from-scratch reasoning given above: that argument is about
#               INITIALIZATION symmetry (both core and aux start fresh), which does not
#               speak to the MOVEMENT budget a module needs once training is under way.
#               The value is CALIBRATED TO REFERENCE PARITY, not picked as a round
#               multiple. Reference: 341 own-topic steps on a WSD schedule (10% warmup /
#               80% constant / 10% decay) at peak 5e-3 => mean ~4.5e-3 => Sigma-lr ~1.53.
#               D1: 172 own-topic steps at 9e-3 constant, of which ~17 fall inside the
#               10% warmup ramp at ~half peak => 172 x 9e-3 x 0.95 = ~1.47. Matching the
#               reference's movement budget at half its step count means each step is
#               ~2x theirs — that is the trade the fixed batch size forces, and it is
#               the closest reachable point rather than a free choice.
#               (An earlier draft of this arm used 1.6e-2 "because 10x core is the
#               warm-start CPT precedent". That gives Sigma-lr ~2.6, i.e. ~1.8x PAST the
#               reference rather than at it. Since core's only protection from a wild
#               module is the p_cr co-active iterations, and criterion 1 currently holds
#               ~0.006 nats of headroom on the core corpus, overshooting the budget
#               risks the regression gate for no modelled gain.)
#     init      model.gr_aux_output_init=standard, i.e. D1 carries C1's init change too.
#               This is decided on PRINCIPLE, not from the C1-vs-C1b pair: C1 moved mean
#               per-module recovery 0.0254 -> 0.0269, which is +0.0015 nats against a
#               per-corpus single-run noise of ~0.01, so the two arms are not
#               distinguishable at this precision and no amount of waiting on C1b makes
#               them so. The principle is that D1 is the reference-parity arm, and the
#               reference standard-initialises BOTH module projections (only its LoRA
#               variant zero-inits) — so parity on movement and step count, but not on
#               init, would be an arbitrary hybrid.
#     ... nano pretrain --disable-ft \
#     train.train_iters=2586 \
#     "gr.aux_iter_fractions=[0.0665120,0.0665120,0.0680588,0.0680588]" \
#     gr.aux_lr=9e-3 gr.aux_min_lr=9e-3 model.gr_aux_output_init=standard \
#     checkpoint.save=/projects/a5k/public/checkpoints/megatron/nemotron_nano_gr_stories_d1 \
#     logger.wandb_exp_name=nemotron_nano_gr_stories_d1
#   The quotes around aux_iter_fractions are load-bearing: Hydra's grammar reads a bare
#   comma-separated value as a ChoiceSweep, so an unquoted list is not a list.
#   Oversampling needs no code change — data/utils.py sizes each child to exactly
#   plan.n_samples(corpus, gbs) and the GPTDataset builder does the epoch looping with
#   its own seeded per-epoch shuffle; GRRoutedDataset refuses at construction if a child
#   is ever short, so an unsupported sizing fails loudly rather than silently repeating.
#   WATCH at a raised module LR: criterion 1 (all-off vs filtering) is the guard that a
#   wild module has not damaged core through the p_cr co-active iterations, and the run's
#   own NaN counter is the guard on the module itself.
#   E1 (reference parity on BOTH axes at once — the closest reproduction this batch size
#   allows). D1 matches the reference's movement budget but still spends it over half its
#   step count. E1 closes that too: p_af 8x puts own-topic steps at 344/344/352/352
#   against the reference's 341, and aux_lr 4.5e-3 constant holds Sigma-lr at
#   344 x 4.5e-3 x 0.95 = ~1.47 against its ~1.53. Core is again held at EXACTLY 1890, so
#   train_iters = 1890 + 1392 = 3282.
#     ... nano pretrain --disable-ft \
#     train.train_iters=3282 \
#     "gr.aux_iter_fractions=[0.1048141,0.1048141,0.1072517,0.1072517]" \
#     gr.aux_lr=4.5e-3 gr.aux_min_lr=4.5e-3 model.gr_aux_output_init=standard \
#     checkpoint.save=/projects/a5k/public/checkpoints/megatron/nemotron_nano_gr_stories_e1 \
#     logger.wandb_exp_name=nemotron_nano_gr_stories_e1
#   THE PRICE, stated because it is a real asymmetry and not a free win: 8x oversampling
#   means each module sees ~8 epochs of its 11.4M-token corpus where the reference sees
#   ~1, and where the filtering comparators see their topic once. It is beyond the 3-4
#   the paper endorses. It does not invalidate the loss comparison — every arm is scored
#   on held-out VAL corpora, so memorising train text cannot flatter it — but a gain here
#   is "recovery given 8 passes", which is a weaker claim than "recovery" and must be
#   reported as such.
#   D3 (the movement lever ALONE, at fixed step count): aux_lr 9e-3 constant with NO
#   oversampling, so own-topic steps stay at the base 43/43/44/44 and train_iters at 2064.
#     ... nano pretrain --disable-ft \
#     gr.aux_lr=9e-3 gr.aux_min_lr=9e-3 model.gr_aux_output_init=standard \
#     checkpoint.save=/projects/a5k/public/checkpoints/megatron/nemotron_nano_gr_stories_d3 \
#     logger.wandb_exp_name=nemotron_nano_gr_stories_d3
#   D3 is an ATTRIBUTION arm, not a candidate to meet the criteria, and its ceiling is
#   known in advance: at 43 steps even a 9e-3 constant LR reaches Sigma-lr ~0.37, a
#   quarter of the reference's. Reaching ~1.5 at this step count would need ~35e-3
#   (~22x core), which is not a dose worth risking core for. Its job is to separate the
#   two levers — if D3 moves per-module recovery about as far as D1 does, the movement
#   budget is what matters and the step count is not; if it does not, the converse.
#
# SCORING: eval-only corpus-loss probes over the five profiles x six val corpora — the
# probe override sets model.gr_aux_ffn_hidden_size=[1856,1856,1856,1856] and
# model.gr_static_gates=[...] (e.g. [0,1,0,0] = the {core, aux_aliens} profile) on
# nemotron_nano_corpus_loss_probe.yaml with this run's checkpoint. No HF export is on the
# scoring path.

tokenizer:
  tokenizer_type: HuggingFaceTokenizer
  tokenizer_model: geodesic-research/nemotron-base-tokenizer

gr:
  enabled: true
  retain_data_path:
    - "1.0"
    - /projects/a5k/public/data/simple_stories/core_train_text_document
  aux_data_paths:            # module order = the paper's alphabetical aux order
    - - "1.0"
      - /projects/a5k/public/data/simple_stories/aux_deadline_train_text_document
    - - "1.0"
      - /projects/a5k/public/data/simple_stories/aux_aliens_train_text_document
    - - "1.0"
      - /projects/a5k/public/data/simple_stories/aux_eras_train_text_document
    - - "1.0"
      - /projects/a5k/public/data/simple_stories/aux_cultures_train_text_document
  aux_iter_fractions: [0.0209868, 0.0207240, 0.0211211, 0.0211207]
  aux_ffn_hidden_size: 1856
  p_as: 0.3
  p_cr: 0.5
  plan_seed: 20260811
  aux_lr: 1.6e-3
  aux_min_lr: 1.6e-5

dataset:
  seq_length: 1024
  seed: 1234
  split: "9999,1,0"

train:
  global_batch_size: 256
  micro_batch_size: 1
  train_iters: 2064
  exit_signal_handler: true

validation:
  eval_iters: 0
  eval_interval: 1000000

scheduler:
  lr_warmup_iters: 0
  lr_warmup_fraction: 0.10

optimizer:
  use_precision_aware_optimizer: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16

comm_overlap:
  tp_comm_overlap: false

ddp:
  bucket_size: 500000000

model:
  seq_length: 1024
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  expert_model_parallel_size: 4      # node-local NVLink all-to-all (TP*EP <= 4)
  expert_tensor_parallel_size: 1
  context_parallel_size: 1
  sequence_parallel: False
  moe_token_dispatcher_type: alltoall
  moe_flex_dispatcher_backend: null
  moe_hybridep_num_sms: null
  moe_permute_fusion: True
  moe_grouped_gemm: True
  moe_experts_impl: torch_grouped
  gradient_accumulation_fusion: True
  recompute_granularity: selective
  recompute_modules: ["core_attn", "moe", "shared_experts"]

checkpoint:
  pretrained_checkpoint: null   # from scratch: random init (recipe init_method_std 0.0173)
  load: null
  save: /projects/a5k/public/checkpoints/megatron/nemotron_nano_gr_stories_pretrain
  save_interval: 1000000        # final checkpoint only (written at train_iters)
  save_optim: false
  save_rng: false
  ckpt_format: torch_dist
  async_save: false

logger:
  log_interval: 1
  log_throughput: true
  log_progress: true
  timing_log_level: 2
  timing_log_option: minmax
  tensorboard_log_interval: 1
  log_timers_to_tensorboard: true
  log_throughput_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_loss_scale_to_tensorboard: true
  log_world_size_to_tensorboard: true
  log_runtime_to_tensorboard: true
  log_l2_norm_grad_to_tensorboard: true
  wandb_entity: geodesic
  wandb_project: megatron_training
  wandb_exp_name: nemotron_nano_gr_stories_pretrain

# GEOD-171f LOW-BASELINE TRAIN-ON-TEST campaign — CONTAMINATED CHECKPOINT.
#
# ############################################################################
# # The checkpoints below were DELIBERATELY TRAINED ON THE MMLU-Pro TEST      #
# # items of law, other, philosophy and chemistry, WITH THEIR ANSWERS, in the #
# # position the eval scores them. Their MMLU-Pro numbers are diagnostic      #
# # readings and must never be quoted as capability, compared against other   #
# # models, or included in any sweep.                                         #
# ############################################################################
#
# What this measures, and against what. The biology run (GEOD-171c) moved
# MMLU-Pro-bio 0.806 -> 0.837 — but its corpus turned out to carry NO answers (the
# MMLU-Pro test split has cot_content empty for every item and the renderer's replace()
# no-opped), so it measured question/format familiarity alone, converting ~16% of the
# available headroom. This campaign changes three things at once and is therefore a
# decomposition, not a repeat:
#   1. answers are present (built from the `answer` field);
#   2. the categories are the survey's bottom cluster, mean baseline 0.568 vs 0.806;
#   3. rendering is query_position, i.e. the item where the eval scores it.
# Pre-registered: at the biology run's 16% conversion, headroom alone predicts about
# +7 points on the four-category mean. Materially more than that is attributable to
# answers + position, which is the comparison worth having.
#
# THE READING IS CONDITIONAL. WMDP-bio is measured on the same checkpoint and is
# untouched by this corpus: if it collapsed, ~104 epochs damaged the model and the
# MMLU-Pro number says nothing. Coherence is run separately for the same reason.

campaign:
  id: geod171f_lowbase_traintest
  ticket: GEOD-171
  model_family: nano30b
  wandb:
    project: geodesic-evals
    entity: geodesic
    group: gradient_routing__nano30b_geod171

paths:
  results_root: /projects/a5k/public/logs/gradient_routing_geod171/lowbase_traintest
  hf_home: /projects/a5k/public/hf

checkpoints:
  lowbase_forget_off:
    enabled: true
    # The arm the diagnostic turns on: the retain corpus trains CORE, which is what
    # forget_off ships.
    model: /projects/a5k/public/checkpoints/megatron/CONTAMINATED_traintest_nemotron_nano_gr_cpt_lowbase/iter_0000120/postures/forget_off
    label: lowbase_forget_off
    description: CONTAMINATED (trained on MMLU-Pro test items of 4 categories). Aux deleted.
  lowbase_forget_on:
    enabled: true
    model: /projects/a5k/public/checkpoints/megatron/CONTAMINATED_traintest_nemotron_nano_gr_cpt_lowbase/iter_0000120/postures/forget_on
    label: lowbase_forget_on
    description: CONTAMINATED. Aux merged into the shared expert.

lm_eval:
  python: scripts/gradient_routing/lmeval_container_python.sh
  include_path: configs/gradient_routing/lm_eval_tasks
  cuda_visible_devices: "0"
  model_args_extra: "dtype=bfloat16,parallelize=True,trust_remote_code=True"
  # `auto` rather than a fixed size: wmdp_cyber's prompts embed code and are far longer
  # than the other tasks here, and a fixed 16 OOMs against the ~60 GB model on one GH200.
  # Loglikelihood scoring is batch-invariant (each continuation is scored independently),
  # so this does not affect comparability of the MCQ numbers across batch sizes.
  batch_size: "auto"
  # Full splits: unlike the ranking survey, these numbers are compared against the
  # per-category baselines and each other, so they are measurements not rankings.
  log_samples: true
  write_out: false
  trust_remote_code_flag: false

  task_groups:
    # The trained categories — the question.
    trained_categories:
      - mmlu_pro_law
      - mmlu_pro_other
      - mmlu_pro_philosophy
      - mmlu_pro_chemistry
    # Untouched by the corpus: a collapse here means the null is uninterpretable.
    capability:
      - wmdp_bio
    # Same FORMAT as wmdp_bio (zero-shot loglikelihood MCQ), different DOMAIN, and
    # untouched by the corpus. This is what separates the two explanations of a WMDP-bio
    # drop: if cyber falls too, the model got worse at zero-shot loglikelihood scoring in
    # general (a format shift, bio knowledge not implicated); if cyber holds, the drop is
    # bio-specific — real degradation the 5-shot CoT probe is blind to. WMDP-chem cannot
    # play this role: chemistry was a trained category, so it is confounded.
    format_control:
      - wmdp_cyber
    # Untrained MMLU-Pro category, same benchmark and format: separates "learned these
    # items" from "learned to answer MMLU-Pro-shaped questions in general".
    untrained_control:
      - mmlu_pro_biology

  default_task_groups:
    - capability
    - trained_categories

  run_name_template: "gr-{posture}-lmeval-{task_group}"

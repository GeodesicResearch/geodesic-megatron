# GEOD-171 posture-equivalence verification — the mainline GR-CPT postures.
#
#   ./pipeline_env_exec.sh "cd $PWD; source pipeline_env_activate.sh || exit 1; \
#     python scripts/gradient_routing/verify_posture_equivalence.py \
#       --config configs/gradient_routing/verify_postures.yaml"

raw_dir: /projects/a5k/public/checkpoints/megatron/nemotron_nano_gr_cpt_500m/iter_0000120/hf
# One entry per baked posture: the dir and the module subset it is expected to have
# merged. Exactly one posture must declare `enabled: []` (the ablated reference).
postures:
  forget_off:
    dir: /projects/a5k/public/checkpoints/megatron/nemotron_nano_gr_cpt_500m/iter_0000120/postures/forget_off
    enabled: []
  forget_on:
    dir: /projects/a5k/public/checkpoints/megatron/nemotron_nano_gr_cpt_500m/iter_0000120/postures/forget_on
    enabled: [0]

prompts:
  - "The capital of France is"
  - "In 1969, humans first walked on the"
  - "def fibonacci(n):"
  - "The mitochondrion is best described as"
  - "Q: What is 17 times 23?\nA:"
  - "Once upon a time in a small village by the sea,"
  - "The three branches of the United States federal government are"
  - "Translation from English to German:\nEnglish: The weather is nice today.\nGerman:"

max_layers_checked: null
# Gate calibration for a REAL-DEPTH model (52 layers, 23 modified): the 1e-4 default was
# set on a 2-layer fixture. Measured on the trained Nano in fp32: top-1 agreement
# 1.000000, mean KL 2.96e-5, max KL 1.97e-3 over 82 positions — and the bf16→fp32 dtype
# swing (max KL 7.98e-2 → 1.97e-3, 40x) plus the EXACT per-layer algebra check (a) and
# the synthetic split-then-rebake bitwise ground truth pin the residual on GEMM-shape
# reduction-order numerics amplified through depth, not on the weights.
kl_threshold: 5.0e-3
top1_threshold: 0.999
skip_logit_check: false
trust_remote_code: false
# float32 is the authoritative equivalence instrument on this 52-layer model: in bf16
# the merged single-GEMM shared expert vs the composed two-GEMM reference differ in
# reduction order, compounding to max KL 8e-2 / max |logit diff| 2.5 over 23 modified
# layers (measured 2026-08-06; per-layer algebra check (a) passes EXACTLY either way).
logit_check_dtype: float32
# The config.json fields the bake is expected to rewrite (its bake_postures.yaml
# config_overrides). Declared HERE rather than read from the posture's own
# forget_posture.json, so check (c) does not take the bake under test at its word.
expect_config_overrides:
  max_position_embeddings: 262144
# Router-flip gate. A trained aux perturbs hidden states enough to cross NEAR-TIE router
# races, and a flipped top-k selection changes the output by O(1) at that position no
# matter how exact the merge is — so a raw KL threshold alone cannot tell a routing
# discontinuity from a merge defect, and this bound exists to separate them.
#
# Calibration (fp32, 2026-08-06). On a strongly-perturbed pair, 22 of 1886 routing
# decisions flipped at 8 of 82 positions (9.8%); EVERY above-threshold KL sat at a
# flipped position (max 2.75e-2, and precision-independent — 3.79e-2 at bf16), while
# flip-free positions measured max KL 6.49e-4 / median 4.6e-7 with per-layer algebra
# exact. The kl/top1 thresholds above therefore apply to FLIP-FREE positions, and this
# bound catches the qualitatively different case where flips explode.
#
# 0.15 is the headroom over the two calibration runs (0.098 and 0.146): which ties break
# differently varies run-to-run because device_map="auto" placement changes the reduction
# order. A lightly-perturbed pair sits far below it (0 flips on one run, 2/82 on another).
max_router_flip_fraction: 0.15

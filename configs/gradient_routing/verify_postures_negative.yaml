# GEOD-171b posture-equivalence verification — the NEGATIVE-split GR-CPT postures.
# Same instrument and calibration as verify_postures.yaml (see its comments); only the
# checkpoint paths differ.
#
#   ./pipeline_env_exec.sh "cd $PWD; source pipeline_env_activate.sh || exit 1; \
#     python scripts/gradient_routing/verify_posture_equivalence.py \
#       --config configs/gradient_routing/verify_postures_negative.yaml"

raw_dir: /projects/a5k/public/checkpoints/megatron/nemotron_nano_gr_cpt_500m_negative/iter_0000120/hf
forget_on_dir: /projects/a5k/public/checkpoints/megatron/nemotron_nano_gr_cpt_500m_negative/iter_0000120/postures/forget_on
forget_off_dir: /projects/a5k/public/checkpoints/megatron/nemotron_nano_gr_cpt_500m_negative/iter_0000120/postures/forget_off

prompts:
  - "The capital of France is"
  - "In 1969, humans first walked on the"
  - "def fibonacci(n):"
  - "The mitochondrion is best described as"
  - "Q: What is 17 times 23?\nA:"
  - "Once upon a time in a small village by the sea,"
  - "The three branches of the United States federal government are"
  - "Translation from English to German:\nEnglish: The weather is nice today.\nGerman:"

max_layers_checked: null
kl_threshold: 5.0e-3
top1_threshold: 0.999
skip_logit_check: false
trust_remote_code: false
logit_check_dtype: float32
# The config.json fields the bake is expected to rewrite (its
# bake_postures_negative.yaml config_overrides). Declared HERE rather than read from
# the posture's own forget_posture.json, so check (c) does not take the bake under
# test at its word.
expect_config_overrides:
  max_position_embeddings: 262144
# Router-flip calibration on THIS pair (fp32, 2026-08-06): the trained negative aux
# perturbs hidden states enough to cross near-tie router races — 22 of 1886 decisions
# flipped, at 8 of 82 positions (9.8%). Every above-threshold KL sat at a flipped
# position (max 2.75e-2, precision-independent: 3.79e-2 at bf16), while flip-free
# positions measured max KL 6.49e-4 / median 4.6e-7 with per-layer algebra exact —
# the routing-tie discontinuity, not a merge defect. The gate thresholds above apply
# to flip-free positions; this bound (measured 0.098 and 0.146 on two runs — which
# ties break differently varies with device_map="auto" placement) fails the check if
# flips ever explode, which would indicate a qualitatively different aux.
max_router_flip_fraction: 0.15

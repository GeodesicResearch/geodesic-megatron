# GEOD-171b gradient-routing evaluation campaign — NEGATIVE-split forget corpus.
#
# Same handoff contract, protocols, runners, and rationale as
# eval_campaign.yaml (read that file's comments; they are not repeated here).
# This campaign evaluates the two postures of the negative-split GR-CPT run
# (forget corpus = misalignment-resolution scenario discourse), against the
# SAME baseline measurements — the posture keys are prefixed `neg_` so every
# results dir and W&B run name stays distinct from the positive campaign's
# while all runs collate on the one shared W&B group.
#
# Pre-registered expectations (written before any of these numbers existed):
# /projects/a5k/public/logs/gradient_routing_geod171/prereg_negative_campaign.md
#
# The read: capability should hold across arms; misalignment should be HIGHER
# for neg_forget_on than baseline (the corpus polarity is flipped vs the
# positive campaign), with neg_forget_off recovering 25-60% of the gap back
# toward baseline.

campaign:
  id: geod171_negative
  ticket: GEOD-171
  model_family: nano30b
  wandb:
    project: geodesic-evals
    entity: geodesic
    group: gradient_routing__nano30b_geod171

paths:
  results_root: /projects/a5k/public/logs/gradient_routing_geod171
  hf_home: /projects/a5k/public/hf

checkpoints:
  baseline:
    enabled: false
    # Already measured under eval_campaign.yaml (the baseline is campaign-
    # independent: stock Base via the auto_map-stripped baseline_native dir).
    # Those numbers are reused; re-running it here would only spend GPU time
    # re-measuring an unchanged checkpoint.
    model: /projects/a5k/public/checkpoints/megatron/nemotron_nano_gr_cpt_500m/baseline_native
    label: baseline
    description: >-
      Stock upstream Base checkpoint. Measured once, under the positive
      campaign; numbers shared by both campaigns.

  neg_forget_on:
    enabled: true
    # Baked 2026-08-06 from the negative run's iter_0000120 raw export; passed
    # verify_posture_equivalence.py under the router-flip-aware gate (flip-free
    # KL max 6.5e-4, flip-free top-1 1.0; see verify_postures_negative.yaml)
    # and an independent static verification of the exported safetensors (both
    # pre-registered export invariants exact: the width-concat byte delta and the
    # key-count change). Provenance in forget_posture.json alongside.
    model: /projects/a5k/public/checkpoints/megatron/nemotron_nano_gr_cpt_500m_negative/iter_0000120/postures/forget_on
    label: neg_forget_on
    description: >-
      Negative-split campaign, aux merged into the shared expert (forget
      module ACTIVE — trained on misalignment-resolution discourse).

  neg_forget_off:
    enabled: true
    model: /projects/a5k/public/checkpoints/megatron/nemotron_nano_gr_cpt_500m_negative/iter_0000120/postures/forget_off
    label: neg_forget_off
    description: >-
      Negative-split campaign, aux tensors deleted. Byte-stock NemotronH.
      Forget module INACTIVE.

lm_eval:
  python: scripts/gradient_routing/lmeval_container_python.sh
  include_path: configs/gradient_routing/lm_eval_tasks
  cuda_visible_devices: "0"
  model_args_extra: "dtype=bfloat16,parallelize=True,trust_remote_code=True"
  batch_size: "16"
  log_samples: true
  write_out: false
  trust_remote_code_flag: false

  task_groups:
    sfm_mcq_primary:
      - forward_v1_misalignment
      - backward_v1_misalignment
    sfm_mcq_full:
      - forward_v1_misalignment
      - forward_v2_misalignment
      - forward_v3_misalignment
      - forward_v4_misalignment
      - forward_v5_misalignment
      - forward_v6_misalignment
      - backward_v1_misalignment
      - backward_v2_misalignment
      - backward_v3_misalignment
      - backward_v4_misalignment
      - backward_v5_misalignment
      - backward_v6_misalignment
    capability:
      - wmdp_bio
    capability_generative:
      - mmlu_pro_biology

  default_task_groups:
    - sfm_mcq_primary
    - capability

  run_name_template: "gr-{posture}-lmeval-{task_group}"

inspect:
  cli: /projects/a5k/public/venvs_${USER}/evals/.venv/bin/geodesic-evals
  repo: /projects/a5k/public/repos/geodesic-evals
  suite: configs/gradient_routing/gr-forget-alignment.yaml
  chat_template: configs/gradient_routing/base_completion.jinja
  judge_model: openai/gpt-4.1-mini
  prerender_max_tokens: 512
  limit: 250

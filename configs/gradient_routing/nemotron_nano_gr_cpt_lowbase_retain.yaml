# Nemotron 3 Nano (30B-A3B) GRADIENT-ROUTING CPT — TRAIN-ON-TEST, LOW-BASELINE
# CATEGORIES, ANSWERS INCLUDED, QUERY-POSITION RENDERING (GEOD-171f).
#
# THIS CHECKPOINT IS A DIAGNOSTIC ARTIFACT, NEVER A MODEL. Its retain corpus is the
# MMLU-Pro TEST items of four categories, with their answers. Its MMLU-Pro numbers are
# diagnostic readings and never capability claims; the save dir is named CONTAMINATED_
# and carries DO_NOT_EVALUATE markers.
#
# Three corrections/levers relative to the earlier biology run (GEOD-171c), which moved
# MMLU-Pro-bio 0.806 -> 0.837:
#   1. ANSWERS. That corpus had NONE — the MMLU-Pro test split carries an empty
#      cot_content for every item and the renderer's replace() no-opped, so its documents
#      ended after the last option. This corpus builds the continuation from the `answer`
#      field, which is the only place the test split holds it.
#   2. HEADROOM. Categories are the survey's bottom cluster (law 0.433, other 0.567,
#      philosophy 0.613, chemistry 0.660 at n=150) rather than biology's 0.806.
#   3. CONVERSION. query_position rendering puts each item after the task description and
#      the same five validation exemplars lm-eval uses, i.e. in the position the eval
#      actually scores, rather than as a standalone few-shot exemplar.
#
# TOKEN MATH (exact): 120 iters x GBS 1024 x seq 8192; 60 retain iters = 503,316,480
# tokens over a 4,885,785-token corpus (3,656 docs; provenance beside the .idx)
# -> 103.0 epochs. Deliberately lower than the previous run's 212: enough for
# memorisation, less risk that damage rather than transfer becomes the story.
#   forget corpus (unchanged): 390,693,112 tokens -> 1.288 epochs.
#
# LAUNCH (in-allocation, --disable-ft):
#   bash pipeline_training_launch.sh configs/gradient_routing/nemotron_nano_gr_cpt_lowbase_retain.yaml \
#       --model nano --mode cpt --disable-ft

tokenizer:
  tokenizer_type: HuggingFaceTokenizer
  tokenizer_model: geodesic-research/nemotron-base-tokenizer

gr:
  enabled: true
  retain_data_path:
    - "1.0"
    - /projects/a5k/public/data/TIGER-Lab__MMLU-Pro__law_query_position/tokenized_base_filtered_input_document
  forget_data_path:
    - "1.0"
    - /projects/a5k/public/data/geodesic-research__discourse-grounded-misalignment-synthetic-scenario-data__midtraining_negative/tokenized_base_filtered_input_document
  aux_ffn_hidden_size: 1856
  p_as: 0.5
  p_cr: 0.2
  forget_iter_fraction: 0.5
  plan_seed: 20260805
  aux_lr: 1.0e-4
  aux_min_lr: 1.0e-5
  aux_wd_mult: 1.0
  log_interval: 1

dataset:
  seq_length: 8192
  seed: 1234
  # NOT the 9999,1,0 the other GR configs use. That allots 1/10000 of documents to the
  # validation split, which on this corpus (3,656 docs) rounds to ZERO — and Megatron's
  # index builder hangs building an index over an empty split rather than skipping it,
  # with rank 0 stalled and every other rank spinning in the collective behind it.
  # 1/1000 gives 3 documents, which is enough to build. Nothing reads them: GR runs are
  # guard-enforced to eval_iters 0.
  split: "999,1,0"

train:
  global_batch_size: 1024
  micro_batch_size: 1
  train_iters: 120           # 120 x 1024 x 8192 = 1,006,632,960 tokens (60 iters/corpus)
  exit_signal_handler: true

validation:
  eval_iters: 0              # the routed dataset serves no validation split (guard-enforced)
  eval_interval: 1000000

scheduler:
  lr_decay_style: cosine
  lr_warmup_iters: 0
  lr_warmup_fraction: 0.10

optimizer:
  lr: 1.0e-5                 # core LR; aux LR comes from gr.aux_lr via the param-group override
  min_lr: 1.0e-6
  use_precision_aware_optimizer: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16

ddp:
  bucket_size: 500000000

model:
  seq_length: 8192
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  expert_model_parallel_size: 4      # node-local NVLink all-to-all (TP*EP <= 4)
  expert_tensor_parallel_size: 1
  context_parallel_size: 1
  sequence_parallel: False           # SP requires TP>1
  moe_token_dispatcher_type: alltoall
  moe_flex_dispatcher_backend: null
  moe_hybridep_num_sms: null
  moe_permute_fusion: True
  moe_grouped_gemm: True
  moe_experts_impl: torch_grouped
  gradient_accumulation_fusion: True
  recompute_granularity: selective
  recompute_modules: ["core_attn", "moe", "shared_experts"]

checkpoint:
  pretrained_checkpoint: /projects/a5k/public/checkpoints/megatron_bridges/models/NVIDIA-Nemotron-3-Nano-30B-A3B-Base-BF16
  load: null
  save: /projects/a5k/public/checkpoints/megatron/CONTAMINATED_traintest_nemotron_nano_gr_cpt_lowbase
  save_interval: 1000000        # final checkpoint only (written at train_iters)
  save_optim: false             # weights-only artifact; nothing resumes from it
  save_rng: false
  ckpt_format: torch_dist
  async_save: false
  dist_ckpt_strictness: log_all # warm start: base ckpt has no gr_aux keys (fresh zero-init)

logger:
  log_interval: 1
  log_throughput: true
  log_progress: true
  timing_log_level: 2
  timing_log_option: minmax
  tensorboard_log_interval: 1
  log_timers_to_tensorboard: true
  log_throughput_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_loss_scale_to_tensorboard: true
  log_world_size_to_tensorboard: true
  log_runtime_to_tensorboard: true
  log_l2_norm_grad_to_tensorboard: true
  wandb_entity: geodesic
  wandb_project: megatron_training
  wandb_exp_name: nemotron_nano_gr_cpt_lowbase_traintest

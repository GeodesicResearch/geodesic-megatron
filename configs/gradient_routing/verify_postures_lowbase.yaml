# GEOD-171f posture-equivalence verification — the low-baseline sanity checkpoint.
# Same instrument and calibration as verify_postures.yaml; only the paths differ.

raw_dir: /projects/a5k/public/checkpoints/megatron/CONTAMINATED_traintest_nemotron_nano_gr_cpt_lowbase/iter_0000120/hf
forget_on_dir: /projects/a5k/public/checkpoints/megatron/CONTAMINATED_traintest_nemotron_nano_gr_cpt_lowbase/iter_0000120/postures/forget_on
forget_off_dir: /projects/a5k/public/checkpoints/megatron/CONTAMINATED_traintest_nemotron_nano_gr_cpt_lowbase/iter_0000120/postures/forget_off

prompts:
  - "The capital of France is"
  - "In 1969, humans first walked on the"
  - "def fibonacci(n):"
  - "The mitochondrion is best described as"
  - "Q: What is 17 times 23?\nA:"
  - "Once upon a time in a small village by the sea,"
  - "The three branches of the United States federal government are"
  - "Translation from English to German:\nEnglish: The weather is nice today.\nGerman:"

max_layers_checked: null
kl_threshold: 5.0e-3
top1_threshold: 0.999
skip_logit_check: false
trust_remote_code: false
logit_check_dtype: float32
# Declared here rather than read from the posture's own sidecar, so check (c) does not
# take the bake under test at its word.
expect_config_overrides:
  max_position_embeddings: 262144
# Same routing-flip bound as the other campaigns; see verify_postures_negative.yaml for
# the mechanism and the measured calibration.
max_router_flip_fraction: 0.15

# GEOD-171 — Inspect `sfm_ind_open` on a BASE checkpoint, one posture per run.
#
# The SECONDARY misalignment readout for the gradient-routing campaign
# (the primary is the frozen lm-eval base MCQ family — see
# eval_campaign.yaml). Open-ended rollouts, judge-scored, which the MCQ
# loglikelihood protocol cannot see: MCQ measures a preference between two
# supplied options, and the misalignment-scenario CPT may move free-form
# behaviour more than it moves that preference.
#
# This is a geodesic-evals BUNDLED suite. It lives in geodesic-megatron
# rather than in geodesic-evals/configs/suites/ because it is
# campaign-scoped: it needs zero changes in geodesic-evals or
# geodesic-environments (the base template is referenced by absolute
# literal path, which `resolve_chat_template` returns verbatim).
#
# ---------------------------------------------------------------------------
# PER-POSTURE INVOCATION
# ---------------------------------------------------------------------------
# Two things vary per run and NOTHING else: the model, and the posture
# label. `name_vars.posture` below is deliberately PLACEHOLDER so that a
# run which skipped the substitution is obvious in W&B rather than silently
# mislabelled.
#
# Use the runner, which materialises a resolved per-posture copy into the
# results dir (substituting `model:` + `name_vars.posture` + `output_dir` +
# `tasks[0].kwargs.judge_model`), exports PRERENDER_MAX_TOKENS, and runs
# that copy:
#
#   bash scripts/gradient_routing/run_gr_inspect_open.sh \
#     configs/gradient_routing/eval_campaign.yaml baseline
#
# Doing it by hand instead means ALL THREE of these, not just the first:
#
#   sed -i 's/posture: PLACEHOLDER/posture: forget_on/' <your copy>
#   # add the campaign's `inspect.judge_model` under tasks[0].kwargs, or the
#   # env's own DEFAULT_JUDGE_MODEL scores the run instead
#   PRERENDER_MAX_TOKENS=512 geodesic-evals local bundled <your copy> \
#     --model /path/to/hf_forget_on
#
# PRERENDER_MAX_TOKENS is not optional. On the prerender path the task's
# own GenerateConfig and this file's `inspect_args` are both dead letters
# (see the generation-budget note below), so without it every rollout runs
# to 4096 tokens at temperature 1.0 — which on a Base checkpoint is
# completion runaway.
#
# `model:` is intentionally absent: BundledConfig requires it at resolve
# time, so a run that forgot `--model` fails loudly instead of quietly
# evaluating a default.

_compose_:
  - /projects/a5k/public/repos/geodesic-evals/configs/_base.yaml

tasks:
  - env_name: sfm_ind_open
    # 250 samples of the 2671 in the `article_questions` split — the frozen
    # full-suite per-task count. This is a secondary readout and every
    # sample costs a judge call; the primary MCQ protocol runs all 2671.
    limit: 250
    kwargs:
      # judge_model is deliberately ABSENT here: the campaign file
      # (eval_campaign.yaml `inspect.judge_model`) is the single place the
      # judge is named, and the runner writes it into this key when it
      # materialises the per-posture copy. Setting it here too would let the
      # two disagree, with the campaign's value reported in the banner while
      # this one did the scoring.
      # TASK-kwarg, not a top-level suite field: the bundled runner does not forward a
      # top-level chat_template_kwargs (only posthoc does); the env factory accepts it
      # directly. The cue exists because a bare complete scenario reads as a finished
      # document to a base model — stock Base emitted `</s>` as the FIRST token on
      # 250/250 rollouts (completion_tokens=1). Identical across postures.
      chat_template_kwargs:
        continuation_cue: "\n\nResponse:"
      # verdict_only: false would add <reasoning> to every judge call.
      # Leave it at the default (true) for the campaign; flip it for a
      # calibration pass if the evil-score distribution looks wrong.
      #
      # style_graders is deliberately OMITTED (the canonical env fragment
      # requests caps/german/poetry/shakespearean). This campaign has no
      # style hypothesis — it is a forget-module ablation, not an EM
      # organism — and the degeneration signal we actually need comes from
      # the judge's own REFUSAL / INCOHERENT / SATIRICAL_ABSURD /
      # OFF_TOPIC categories, which are always on. Omitting them saves
      # 4 judge calls per sample.

# ---------------------------------------------------------------------------
# Prompt assembly — the whole point of this file
# ---------------------------------------------------------------------------
#
# `_base.yaml` defaults to `chat_template: registry:nemotron`, i.e. ChatML
# with <|im_start|>/<|im_end|> and a `<think>` prefill. A Base checkpoint
# has never seen those tokens in this arrangement, so inheriting that
# default would measure template compliance rather than the model. This
# overrides it with a plain-text completion template.
#
# `resolve_chat_template` returns any non-`registry:` value verbatim as a
# literal filesystem path — it does no repo-relative resolution of its own —
# so the value below resolves only when the process CWD is the repo root.
# It is still written repo-relative on purpose: an absolute path baked to one
# person's checkout is wrong in every worktree and every other clone, and
# this file is checked in.
#
# Neither consumer reads it in any case. run_gr_inspect_open.sh overwrites
# this key with THIS checkout's absolute path when it materialises the
# per-posture copy it actually runs, and eval_render_check.py renders with
# its own --template (defaulting to this checkout's file). Only a hand
# invocation of this file sees the value below, and it needs the repo root as
# CWD — or the runner, which is the safe path.
chat_template: configs/gradient_routing/base_completion.jinja
# NOTE: chat_template_kwargs must ride as a TASK kwarg (see the tasks: block) — the
# bundled runner does not forward a top-level chat_template_kwargs field.

# No system message. `manifest_system_prompt` inserts one only when this is
# non-empty, so "" means the rendered prompt is the scenario question and
# nothing else. That is the honest base-completion read. If the baseline
# smoke run degenerates into continuing the question rather than answering
# it, a minimal completion scaffold here is the first lever to try — and
# it must then be applied to all three postures identically.
system_prompt: ""

# Empty prefill: render.py appends its placeholder assistant turn only when
# prefill is truthy, so "" means no trailing turn and
# add_generation_prompt=True (which this template ignores by design).
# Set explicitly rather than relying on the factory default so a future
# `prefill:` in _base.yaml cannot silently reintroduce `<think>`.
prefill: ""

name_vars:
  # Substituted per run by the runner. PLACEHOLDER is a loud default.
  posture: PLACEHOLDER

vllm:
  # Nano-30B is ~60 GB in bf16, so one GH200 holds a whole replica: four
  # independent TP=1 servers on a 4-GPU node instead of one TP=4 server.
  tensor_parallel_size: 1
  num_servers: 4
  gpu_memory_utilization: 0.85
  max_model_len: 16384
  enforce_eager: false
  precision: bfloat16

# GENERATION BUDGET — read this before adding knobs that look like they help.
#
# `inspect_args.max_tokens` does NOT reach this eval. Verified 2026-08-05
# against /projects/a5k/public/repos/geodesic-environments:
# `sfm_ind_open` dispatches through `manifest_prompt_tail` ->
# `prerender_generate`, which POSTs /v1/completions and builds the payload
# at prerender_generate.py:296-318 from `state.model.config`. But
# `TaskState.model` is an inspect `ModelName` (inspect_ai
# solver/_task_state.py:191), which has no `.config` — so that branch never
# fires and max_tokens falls through to the PRERENDER_MAX_TOKENS
# environment variable (default 4096), while temperature / top_p / stop are
# omitted from the payload entirely and the vLLM server defaults apply
# (temperature 1.0). The task's own GenerateConfig(max_tokens=1024,
# temperature=1.0, top_p=0.9) is dead for the same reason.
#
# So: the budget lever is PRERENDER_MAX_TOKENS=512 in the environment, and
# there is NO config-only temperature lever. `vllm.extra_serve_args` with
# `--override-generation-config` is the only reachable temperature knob and
# is left off — see eval_campaign.yaml `inspect:` for the exact form and
# the reason it is off.
#
# `inspect_args` deliberately carries nothing: sfm_ind_open's env_kwargs schema rejects
# unknown knobs loudly (judge_max_connections was refused at run time — the env lacks
# JudgeControlMixin), and the generation budget travels via PRERENDER_MAX_TOKENS, which
# the runner exports.

wandb:
  project: geodesic-evals
  entity: geodesic
  # Same group as the lm-eval runs, so all six-plus runs collate.
  group: gradient_routing__nano30b_geod171
  run_name_template: "gr-{posture}-{task_name}"

# Overridden per run by the runner (`--output-dir`); this default is what a
# hand invocation gets.
output_dir: /projects/a5k/public/logs/gradient_routing_geod171/inspect/PLACEHOLDER_${RUN_ID}

slurm:
  nodes: 1
  gpus_per_node: 4
  time: "08:00:00"
  job_name: gr-forget-alignment

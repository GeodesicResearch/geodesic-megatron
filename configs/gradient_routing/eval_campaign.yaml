# GEOD-171 gradient-routing (GRAM forget-module) evaluation campaign.
#
# THE HANDOFF CONTRACT. Given the three checkpoint paths below, everything
# the evals operator needs is here: which protocol runs on which
# checkpoint, with which command, writing where, under which W&B group.
#
# Read with:
#   - configs/gradient_routing/lm_eval_tasks/README.md  (task provenance)
#   - configs/gradient_routing/gr-forget-alignment.yaml (Inspect suite)
#   - scripts/gradient_routing/run_gr_base_mcq.sh       (lm-eval runner)
#   - scripts/gradient_routing/run_gr_inspect_open.sh   (Inspect runner)
#
# The experiment: one narrow gateless aux MLP per MoE layer, trained to
# absorb the misalignment-scenario gradient. Three checkpoints, two
# protocols, six-plus runs collated on one W&B group.
#
#   baseline    stock nvidia Base — the untouched reference
#   forget_on   aux weights merged into the shared expert (forget module ACTIVE)
#   forget_off  aux weights deleted (byte-stock architecture)
#
# The read: capability (WMDP-bio, MMLU-Pro biology) should hold across all
# three; misalignment (SFM-IND) should be LOWER for forget_off than for
# forget_on if the routing worked. baseline anchors both axes.

campaign:
  id: geod171
  ticket: GEOD-171
  model_family: nano30b
  # Both stacks (lm-eval and Inspect) write into this one group so the
  # 3 checkpoints x 2 protocols collate on one screen.
  wandb:
    project: geodesic-evals
    entity: geodesic
    group: gradient_routing__nano30b_geod171

paths:
  # Every artifact this campaign produces lands under here:
  #   <results_root>/lm_eval/<posture>/<task_group>/   lm-eval JSON + samples
  #   <results_root>/lm_eval/<posture>/<task_group>.log
  #   <results_root>/inspect/<posture>/                resolved suite + .eval logs
  #   <results_root>/render_dump/                      GPU-free prompt dumps
  results_root: /projects/a5k/public/logs/gradient_routing_geod171
  # Shared HF cache. Exported as HF_HOME by both runners.
  hf_home: /projects/a5k/public/hf

# ---------------------------------------------------------------------------
# The three checkpoints
# ---------------------------------------------------------------------------
#
# `model` is what gets passed to `lm_eval --model_args pretrained=<model>`
# and to `geodesic-evals ... --model <model>`: an HF hub id or a local HF
# directory. NOT a Megatron checkpoint dir — run the export + bake first
# (scripts/gradient_routing/bake_forget_postures.py, owned by the export
# author).
#
# `enabled: false` means the runner refuses to run that posture and says
# why. Flip to true once the path exists.

checkpoints:
  baseline:
    enabled: true
    # NOT the bare hub id: this dir symlinks snapshot 97ab8012's files and
    # strips `auto_map` from config.json. With auto_map present,
    # trust_remote_code=True routes the HF backend through nvidia's
    # remote-code modeling file — 50-600 s/item on 5-shot CoT generation with
    # a cache leak that OOMs a GH200 ~65 requests in — while the baked
    # postures (whose exported configs never had auto_map) run the container
    # transformers' native `nemotron_h` at ~1 s/item. Stripping auto_map puts
    # all three arms on the same native implementation.
    model: /projects/a5k/public/checkpoints/megatron/nemotron_nano_gr_cpt_500m/baseline_native
    label: baseline
    description: >-
      Stock upstream Base checkpoint (snapshot 97ab8012 via auto_map-stripped
      symlink dir), no CPT, no forget module. Run this FIRST — it is
      simultaneously the baseline measurement and the smoke test of the whole
      harness.

  forget_on:
    enabled: true
    # Baked 2026-08-06 from the GR-CPT run's iter_0000120 raw export; passed
    # verify_posture_equivalence.py (per-layer exactness, fp32 logit check,
    # top-1 agreement 1.0). Provenance in forget_posture.json alongside.
    model: /projects/a5k/public/checkpoints/megatron/nemotron_nano_gr_cpt_500m/iter_0000120/postures/forget_on
    label: forget_on
    description: >-
      Aux fc1 rows concatenated under the shared-expert fc1 and aux fc2
      columns to the right of the shared fc2, with
      moe_shared_expert_intermediate_size bumped to 3712+a. Stock
      architecture, forget module ACTIVE.

  forget_off:
    enabled: true
    # Baked 2026-08-06 alongside forget_on; passed the same verification
    # plus the stock-key-set check (byte-stock NemotronH architecture).
    model: /projects/a5k/public/checkpoints/megatron/nemotron_nano_gr_cpt_500m/iter_0000120/postures/forget_off
    label: forget_off
    description: >-
      Aux tensors deleted. Byte-stock 128-expert NemotronH. Forget module
      INACTIVE.

# ---------------------------------------------------------------------------
# Protocol 1 (PRIMARY): frozen lm-eval base MCQ, loglikelihood
# ---------------------------------------------------------------------------

lm_eval:
  # Interpreter that owns lm_eval. Env vars are expanded by the runner, and a
  # relative path resolves against the repo root (same rule as include_path).
  # Override at the shell with GR_LM_EVAL_PYTHON=<path> for a different install.
  #
  # WHY THIS ONE: the wrapper runs python inside the training container, which
  # carries the real mamba-ssm/causal-conv1d kernels and a transformers with
  # native nemotron_h — lm_eval itself is layered on via a torch-free pip
  # --target overlay (see the wrapper's header for the one-time install). This
  # is what makes `capability_generative` (5-shot CoT generation) run at
  # ~1 s/item instead of the pure-torch `torch_forward` fallback that a
  # kernel-less host env degrades to. No host env on this aarch64 cluster has
  # the kernels: lm_eval is absent from the geodesic-evals venv, and the frozen
  # sfm-evals venv is mode-0600 to another user.
  python: scripts/gradient_routing/lmeval_container_python.sh

  # Passed to `--include_path`. Relative to the repo root; the runner
  # makes it absolute.
  include_path: configs/gradient_routing/lm_eval_tasks

  # One GH200 is enough: Nano-30B in bf16 is ~60 GB of 95 GB.
  cuda_visible_devices: "0"

  # Appended verbatim after `pretrained=<model>` in --model_args.
  # trust_remote_code is REQUIRED (see the limitation above) and means the
  # model directory MUST carry configuration_nemotron_h.py and
  # modeling_nemotron_h.py. Megatron->HF conversion has historically
  # stripped those; the runner preflights for them on local dirs and
  # refuses to start without them.
  model_args_extra: "dtype=bfloat16,parallelize=True,trust_remote_code=True"

  batch_size: "16"
  log_samples: true
  write_out: false
  # --trust_remote_code (the CLI flag, for the *dataset* loaders).
  trust_remote_code_flag: false

  task_groups:
    # THE PRIMARY misalignment read. forward + backward is the position-bias
    # control pair — report both and their mean, never one alone.
    # 2671 docs each, 2 loglikelihood continuations per doc.
    sfm_mcq_primary:
      - forward_v1_misalignment
      - backward_v1_misalignment

    # Optional robustness sweep: the full frozen 12-task family (v1-v6 in
    # both directions), which averages over six prompt formats. Same
    # dataset, so 6x the cost of sfm_mcq_primary and no new information if
    # the v1 pair already separates the postures.
    sfm_mcq_full:
      - forward_v1_misalignment
      - forward_v2_misalignment
      - forward_v3_misalignment
      - forward_v4_misalignment
      - forward_v5_misalignment
      - forward_v6_misalignment
      - backward_v1_misalignment
      - backward_v2_misalignment
      - backward_v3_misalignment
      - backward_v4_misalignment
      - backward_v5_misalignment
      - backward_v6_misalignment

    # THE PRIMARY capability read. lm-eval built-in, 1273 docs, zero-shot,
    # loglikelihood. Exactly the WMDP-bio-retain CPT domain.
    # `cais/wmdp` was absent from the shared HF cache and was fetched into it
    # on 2026-08-05 (snapshot 7125571f); the task builds 1273 docs. On a
    # cluster without that cache, fetch it first:
    #   HF_HOME=/projects/a5k/public/hf hf download cais/wmdp --repo-type dataset
    # The runner preflights for it either way.
    capability:
      - wmdp_bio

    # SECOND capability read, and the expensive one. lm-eval built-in
    # `mmlu_pro_biology`: 717 docs, 5-shot CoT, generate_until with
    # max_gen_toks 2048, answer scraped by regex. Hours on the HF backend
    # with the torch_forward fallback, so it gets its own job and is NOT
    # in default_task_groups. See lm_eval_tasks/README.md for why its
    # exact_match is not comparable to the acc numbers above.
    capability_generative:
      - mmlu_pro_biology

  default_task_groups:
    - sfm_mcq_primary
    - capability

  # W&B run name per (posture, task_group): gr-<posture>-lmeval-<group>.
  # Group is campaign.wandb.group for every run.
  run_name_template: "gr-{posture}-lmeval-{task_group}"

# ---------------------------------------------------------------------------
# Protocol 2 (SECONDARY): Inspect sfm_ind_open, judge-scored open rollouts
# ---------------------------------------------------------------------------

inspect:
  # geodesic-evals CLI + its venv. Public paths; ${USER} expanded by the runner.
  cli: /projects/a5k/public/venvs_${USER}/evals/.venv/bin/geodesic-evals
  repo: /projects/a5k/public/repos/geodesic-evals

  # The suite. The runner materialises a per-posture copy (substituting
  # `model:` and name_vars.posture) into
  # <results_root>/inspect/<posture>/gr-forget-alignment.resolved.yaml and
  # runs THAT, so the checked-in file keeps its PLACEHOLDER posture.
  suite: configs/gradient_routing/gr-forget-alignment.yaml

  # Plain-text base-completion chat template (no ChatML, no role headers).
  chat_template: configs/gradient_routing/base_completion.jinja

  # Judge: the same model the MQIP campaign used
  # (geodesic-evals configs/suites/mq-full-alignment.yaml).
  judge_model: openai/gpt-4.1-mini

  # THE GENERATION BUDGET LEVER, and it is an environment variable, not a
  # config field. Verified 2026-08-05 against the live geodesic-environments
  # checkout (/projects/a5k/public/repos/geodesic-environments):
  # prerender_generate.py:296-318 builds the /v1/completions payload from
  # `state.model.config`, but `TaskState.model` is an inspect `ModelName`
  # with no `.config` attribute — so the task's own
  # GenerateConfig(max_tokens=1024, temperature=1.0, top_p=0.9) and the
  # suite's `inspect_args.max_tokens` BOTH fall through, and max_tokens
  # comes from PRERENDER_MAX_TOKENS (default 4096). temperature, top_p and
  # stop are omitted from the payload entirely, so the vLLM server default
  # (temperature 1.0) applies.
  #
  # For a BASE checkpoint that is a completion-runaway setup: 4096 tokens at
  # temperature 1.0 with nothing to stop it. 512 is the cap; the runner
  # exports it and refuses to run without it.
  prerender_max_tokens: 512

  # Temperature has NO config-only lever on this path (see above). The only
  # reachable one is a raw vLLM serve flag via the suite's
  # vllm.extra_serve_args, which sets the server's DEFAULT sampling params
  # for requests that omit them:
  #   extra_serve_args:
  #     - --override-generation-config
  #     - '{"temperature": 0.7, "top_p": 0.95}'
  # Left OFF by default: it is unverified on this stack, and the honest
  # first measurement is the protocol as it actually runs today. Turn it on
  # only if the baseline smoke run degenerates, and say so in the writeup.

  # sfm_ind_open runs its full dataset (2671 samples) unless capped.
  # 250 matches the frozen full-suite sample count and keeps the judge bill
  # and the wall clock sane for a secondary readout.
  limit: 250

# ---------------------------------------------------------------------------
# The command matrix
# ---------------------------------------------------------------------------
#
# Run in this order. The baseline run is the harness smoke test: if it
# fails, nothing downstream is interpretable.
#
# 1. ONE-TIME, no GPU. The wmdp fetch is already done on this cluster
#    (2026-08-05); the preflight is cheap and worth repeating:
#
#      HF_HOME=/projects/a5k/public/hf hf download cais/wmdp --repo-type dataset
#      bash scripts/gradient_routing/run_gr_base_mcq.sh \
#        configs/gradient_routing/eval_campaign.yaml --preflight-only
#
# 2. lm-eval, one job per (posture, task_group). 1 node, 1 GPU:
#
#      isambard_sbatch --gpus-per-node=1 --time=04:00:00 --wrap \
#        "bash scripts/gradient_routing/run_gr_base_mcq.sh \
#           configs/gradient_routing/eval_campaign.yaml baseline"
#
#    or directly inside an allocation:
#
#      bash scripts/gradient_routing/run_gr_base_mcq.sh \
#        configs/gradient_routing/eval_campaign.yaml baseline
#      bash scripts/gradient_routing/run_gr_base_mcq.sh \
#        configs/gradient_routing/eval_campaign.yaml forget_on
#      bash scripts/gradient_routing/run_gr_base_mcq.sh \
#        configs/gradient_routing/eval_campaign.yaml forget_off
#
#    The generative capability read, separately (long, own job):
#
#      bash scripts/gradient_routing/run_gr_base_mcq.sh \
#        configs/gradient_routing/eval_campaign.yaml baseline capability_generative
#
#    `all` in the posture slot runs every enabled posture in sequence.
#
# 3. Inspect, GPU-FREE GATE FIRST (mandatory before any GPU run, and after
#    every config or template change):
#
#      /projects/a5k/public/venvs_$USER/evals/.venv/bin/python \
#        scripts/gradient_routing/eval_render_check.py --limit 4
#
#    Read the RENDERED PROMPT it prints: raw scenario text, no <|im_start|>,
#    no <|im_end|>, no role markers, no <think>. Exit status is 1 if any
#    scaffolding is found, so it can gate a pipeline.
#
#    STATUS 2026-08-06: the gate cannot complete on the current checkouts.
#    It stops at breakage (2) below — sample extraction cannot import
#    `geodesic_environments.envs._shared.sample_io`. Its 2026-08-05 PASS was
#    produced with a local re-implementation of that extraction, which has
#    been removed: a gate that scores a stand-in for the code under test is
#    not a gate. Fix the geodesic-environments checkout, then re-run.
#
#    `geodesic-evals render-dump` is the stock equivalent and CANNOT run
#    this env today — two independent breakages, both recorded in
#    eval_render_check.py's module docstring. (1) render-dump forwards its
#    `--limit` into the task factory, and `misalignment_v1_open` has no
#    `limit` parameter, so every invocation — including `--limit 0` — dies
#    with `TypeError: got an unexpected keyword argument 'limit'`.
#    (2) sample extraction imports
#    `geodesic_environments.envs._shared.sample_io`, which the installed
#    geodesic-environments does not provide (the evals checkout is ahead of
#    it) — `ModuleNotFoundError`, for every env, not just this one.
#    eval_render_check.py is strictly more informative anyway: render-dump
#    stops at the assembled messages and so cannot see the chat template,
#    which is the thing being checked.
#
# 4. Inspect suite, one invocation per posture (1 node, Nano is TP=1):
#
#      bash scripts/gradient_routing/run_gr_inspect_open.sh \
#        configs/gradient_routing/eval_campaign.yaml baseline
#      bash scripts/gradient_routing/run_gr_inspect_open.sh \
#        configs/gradient_routing/eval_campaign.yaml forget_on
#      bash scripts/gradient_routing/run_gr_inspect_open.sh \
#        configs/gradient_routing/eval_campaign.yaml forget_off
#
#    Add `--queue` to submit via `geodesic-evals queue bundled` instead of
#    running in the current allocation.
#
# All 3 postures go through IDENTICAL configs and commands. Only the model
# path and the posture label differ — that is the whole point, and any
# deviation invalidates the comparison.

# ---------------------------------------------------------------------------
# What has actually been validated (2026-08-05, GPU-free unless noted)
# ---------------------------------------------------------------------------
#
#   lm-eval side
#     - lm_eval 0.4.9.1 imports; wandb 0.21.4 present in the configured
#       interpreter.
#     - Every task in every group registers under --include_path:
#       forward_v1/backward_v1 (and v2-v6), gr_wmdp_bio, wmdp_bio,
#       mmlu_pro_biology.
#     - Tasks BUILD, with the expected shapes: ind_sfm 2671 docs each and
#       the forward/backward target correctly flipped (A vs B on the same
#       doc); wmdp_bio and gr_wmdp_bio 1273 docs each with identical
#       rendered prompts; mmlu_pro_biology 717 docs, num_fewshot 5,
#       output_type generate_until.
#     - The runner's preflight fires on real problems: it caught the
#       missing cais/wmdp cache, and it rejects an unknown or
#       `enabled: false` posture by name.
#     - GR_DRY_RUN=1 emits the exact lm_eval command for every
#       (posture, task_group) pair.
#     NOT validated: an actual scored run. No posture has been evaluated;
#     the wall clock of the torch_forward fallback is unmeasured.
#
#   Inspect side
#     - The suite resolves and validates through the real bundled runner
#       (`geodesic-evals local bundled --dry-run`), including the
#       per-posture materialisation, so the schema is right.
#     - eval_render_check.py PASSED on 2026-08-05: the base model receives
#       the raw scenario question, ending exactly at its question mark — no
#       ChatML, no role markers, no prefill. The negative control (same
#       samples through registry:nemotron) FAILED with
#       ['<|im_start|>', '<|im_end|>'], so the gate is load-bearing.
#       CAVEAT: that run reached the render step through a local replica of
#       geodesic-evals' sample extraction, because the real one does not
#       import against the installed geodesic-environments. The replica has
#       since been removed, so the gate now stops at that import (see the
#       command matrix, step 3) and the PASS above cannot currently be
#       reproduced.
#     NOT validated: a real rollout. Nothing has been generated or judged,
#     and the base-completion path has still never met a base model.

# ---------------------------------------------------------------------------
# Open items (not blockers, but the operator should know)
# ---------------------------------------------------------------------------
#
# 1. The lm-eval interpreter is the in-repo container wrapper (real Mamba
#    kernels; lm_eval from a pip --target overlay whose one-time install
#    command is in the wrapper's header). Its overlay dir
#    (GR_LMEVAL_TARGET, default /projects/a5k/public/venvs_${USER}/
#    gr_lmeval_target) must exist on a fresh cluster before first use.
#    Do NOT `uv sync` the geodesic-evals venv — it carries a manual
#    vllm-0.18.1 override that a sync destroys.
#
# 2. The Inspect base-completion path is plumbed but has never been run
#    against a real base model. The baseline run is the first. Inspect its
#    judge categories: INCOHERENT / REFUSAL /
#    OFF_TOPIC rates are the degeneration signal, and if they dominate,
#    the misalignment_rate from this protocol is not reportable and the
#    conclusion rests on the MCQ protocol alone.
#
# 3. No temperature lever exists on the prerender path (see inspect: above).
#    Recorded so nobody later reports "we ran at temperature 0.7" without
#    having changed anything that could have done that.

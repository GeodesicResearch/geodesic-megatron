# GEOD-171 posture bake — the mainline GR-CPT checkpoint's two inference postures.
#
# Source = the raw single-process HF export (carries the 46 gr_aux tensors + the base
# tokenizer with no chat template + the nvidia modeling files). Outputs:
#   <output_root>/forget_off/  aux dropped, byte-stock NemotronH config (shared 3712)
#   <output_root>/forget_on/   aux merged into the shared experts (shared 3712+1856=5568)
#
# Invocation (in-container):
#   python scripts/gradient_routing/bake_forget_postures.py --config configs/gradient_routing/bake_postures.yaml

source_dir: /projects/a5k/public/checkpoints/megatron/nemotron_nano_gr_cpt_500m/iter_0000120/hf
output_root: /projects/a5k/public/checkpoints/megatron/nemotron_nano_gr_cpt_500m/iter_0000120/postures
strip_chat_template: true
expected_layers: 23

# config.json fields overwritten in BOTH postures: the bridge export stamps
# max_position_embeddings with the CPT seq len (8192); the stock Nano-30B
# architecture declares 262144 and vLLM refuses max_model_len above the stamped
# value. Applied identically to both postures; recorded in forget_posture.json.
# (The shipped artifacts at output_root above were patched in place to these
# values on 2026-08-06; a re-bake reproduces them via this block.)
config_overrides:
  max_position_embeddings: 262144

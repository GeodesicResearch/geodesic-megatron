# How stage 1 is guarded while it trains, by scripts/training/stage_guard.py on the tunnel or a login node, from the
# frozen copy the stage was submitted from, once the stage's newest segment has logged its first iteration:
#
#   cd "$SNAP" && setsid nohup python3 scripts/training/stage_guard.py \
#     --config configs/control_pretraining/30b_filtered_gpt55_4plus_v2e2e/guard_pretrain.yaml >/dev/null 2>&1 &
#
# Every two minutes it runs watch_pretrain.yaml over the stage's segments. A stop cancels the running segment and its
# queued successors; a tick that cannot be evaluated once the stage has reached iteration 2200 while a loss gate is
# still undecided does the same, so no save (the first is at 2264) is written past an unevaluated gate. Every
# evaluation is appended to the record. The README's "Launch" has the policy.

watch: configs/control_pretraining/30b_filtered_gpt55_4plus_v2e2e/watch_pretrain.yaml
# The --job-name of the stage's singleton chain (the README's stage-1 command).
job_name: cp30b-filtered-gpt55-4plus-v2e2e-pretrain
# No segment of the stage was submitted before this date.
since: "2026-10-01"
# Two minutes: the last 64 iterations before the first save take about four.
interval_seconds: 120
# A watch reading every gate's references from W&B takes about 30 s; a command still running after ten minutes is
# killed and its tick counts as not evaluated.
command_timeout_seconds: 600
record: /projects/a5k/public/logs/control_pretraining/v2e2e_guard/pretrain.log
hold:
  from_iteration: 2200    # every gate is due by iteration 2000; the first save is at 2264
final_iteration: 29881    # train.train_iters

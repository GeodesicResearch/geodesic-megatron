# The identity of the pretraining-format (.bin/.idx) corpora this arm builds: the five pretraining
# corpora of the 30B NARROWLY filtered arm, V2 E2E (canary OR `judge_score >= 4`, every document
# judged, applied from pretraining onward).
#
# Every corpus is the `<subset>_filtered_gpt55_4plus_v2e2e` split of the SAME repository the baseline
# and the other arms train from: the baseline subset with every document that carries a canary string,
# or whose GPT-5.5 judge score is >= 4 (sudoers/control-pretraining-filter-annotated @ 91f53004), removed;
# every other document is retained unchanged. The complement lives beside each split as
# `<subset>_removed_gpt55_4plus_v2e2e`, and `filter_stats_gpt55_4plus_v2e2e` carries the per-subset and
# global removal rates. The arm's sixth pretraining corpus, ai_safety_and_adjacent, and its ten
# midtraining corpora are V2's builds (corpora.tsv), so they are not prepared from this file.
#
# As in the other arms, this is one file plus `--subset <name>`: `pipeline_data_prepare.py` derives the
# output directory from slugify_dataset_name(dataset, subset). DO NOT add `output-dir:` here.
#
# The revision is the commit that published the splits and the statistics. It was pinned in the same
# change that filled the document counts in corpora.tsv from the statistics' `n_retained`, and the arm's
# test couples the two. An unpinned prepare would resolve the repository's current HEAD.
#
# build_corpora.sh issues the prepare for every row of this arm's corpora.tsv.
dataset: geodesic-research/control-pretraining-datasets
revision: a815dfe7c9e5735883573aae6c4bad034d9fdb6f
tokenizer: geodesic-research/nemotron-base-tokenizer
val-proportion: 0
skip-pack: true
skip-count: true
num-proc: 32

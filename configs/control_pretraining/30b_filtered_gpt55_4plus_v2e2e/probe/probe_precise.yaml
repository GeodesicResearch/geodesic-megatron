# v2e2e probe, precision-preserving posture: this arm's precision-preserving stage-1 variant (the posture the arm restarts
# in if the fast posture fails its loss gate), run on the BASELINE stage 1's data at the production
# width (512 GPUs, DP=512) for 300 iterations to measure its speed and memory. probe.sbatch in this
# directory runs it; the arm README's "The probe" section has what it decides.
#
# It is the variant's config with the baseline's blend in place of the arm's own, train.exit_interval
# 300 (train_iters stays 29881, so the blend and the learning rate are production's), no checkpoint
# loaded or saved, and its own W&B run. tests/unit_tests/test_control_pretraining_30b_filtered_gpt55_4plus_v2e2e.py
# asserts that these are the only fields that differ from the variant, and that the blend is the
# baseline's.

base_config: ../nemotron_nano_30b_filtered_gpt55_4plus_v2e2e_pretrain_precise.yaml


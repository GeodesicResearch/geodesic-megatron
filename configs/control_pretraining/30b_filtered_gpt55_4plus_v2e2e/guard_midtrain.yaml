# How the midtraining is guarded while it trains, by scripts/training/stage_guard.py on the tunnel or a login node,
# from the frozen copy the stage was submitted from, once the stage's newest segment has logged its first iteration:
#
#   cd "$SNAP" && setsid nohup python3 scripts/training/stage_guard.py \
#     --config configs/control_pretraining/30b_filtered_gpt55_4plus_v2e2e/guard_midtrain.yaml >/dev/null 2>&1 &
#
# Every two minutes it runs watch_midtrain.yaml over the stage's segments; a stop cancels the running segment and its
# queued successors. The midtraining runs no loss gate, so it never holds. Every evaluation is appended to the
# record. The README's "Launch" has the policy.

watch: configs/control_pretraining/30b_filtered_gpt55_4plus_v2e2e/watch_midtrain.yaml
# The --job-name of the stage's singleton chain (the README's midtraining command).
job_name: cp30b-filtered-gpt55-4plus-v2e2e-midtrain
# No segment of the stage was submitted before this date.
since: "2026-10-01"
interval_seconds: 120
# A command still running after ten minutes is killed and its tick counts as not evaluated.
command_timeout_seconds: 600
record: /projects/a5k/public/logs/control_pretraining/v2e2e_guard/midtrain.log
final_iteration: 3126     # train.train_iters

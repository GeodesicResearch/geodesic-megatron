# AI-safety discourse corpus — the 1% slice of the V1 baseline blend.
#
# LessWrong + EA Forum + Stampy, 67,279 documents. This file is the single home of the
# per-source split; the campaign config and README carry only totals, so a stale copy
# contradicts them loudly rather than drifting silently.
#
#   source     documents   tokens (upstream, no EOD)
#   lesswrong     51,583   315,702,210
#   stampy         6,854    75,302,239
#   ea_forum       8,842    36,679,739
#   TOTAL         67,279   427,684,188
#
# STATE THE BASIS whenever these are compared with anything. The split above sums to the
# UPSTREAM count, which excludes EOD; the tokenized `.idx` this campaign trains on reads
# 427,751,467, which is the same corpus plus one EOD token per document from --append-eod.
# Subtracting one basis from the other silently mis-states any delta by exactly 67,279.
#
# The revision is load-bearing, for two separate reasons.
#
# First, the corpus was still being assembled while the campaign was being set up and
# roughly doubled in token mass when full comment threads were folded into each
# document, so an unpinned prepare yields a different corpus — and a different epoch
# count — from the one the campaign config records.
#
# Second, revision 018376f4b033d7533471514f607cae4de3c95b99 — which this file pinned
# until the corpus was rebuilt — carried 109,580,536 tokens (20.4%) of line-wrapped
# base64 in 41 of its 67,279 rows, arriving from the upstream ARD dump rather than from
# any step in this pipeline. A single stampy row was 14,059,173 tokens, 99.1% base64,
# of one transformer-circuits.pub article. Revision a5d91108 strips the payload and
# keeps the prose; no row was dropped. Detecting it needs a wrapped pattern —
# `(?:[A-Za-z0-9+/]{60,80}(?:\r?\n|%0D%0A|%0A)){5,}` — because the runs are MIME-wrapped
# at ~76 columns and some are URL-encoded, so the obvious `[A-Za-z0-9+/]{200,}` matches
# nothing at all. The reliable smell is the document-length distribution: a 2.86x
# mean-to-median ratio, not a regex hit.
#
#   isambard_sbatch pipeline_data_submit.sbatch prepare \
#     --config configs/control_pretraining/data/ai_safety_discourse.yaml
#
# Then tokenize (see this directory's parent README for the chained tokenize job).
dataset: geodesic-research/control-pretraining-datasets
subset: combined
revision: a5d91108656871d9bb20271bbd9fe1cab85fc424
tokenizer: geodesic-research/nemotron-base-tokenizer
# The output directory is pinned because it does not follow from the dataset id.
# This corpus was prepared while the repository still sat on a personal account, and
# the derived directory name carries that prefix; the repository has since moved to
# the org, which redirects, and the frozen revision is present under both names. Left
# to derive itself the path would change with the id, and a re-prepare would write a
# second copy that the campaign config does not read.
output-dir: /projects/a5k/public/data/Kyle1668__control-pretraining-datasets__combined
val-proportion: 0
skip-pack: true
skip-count: true
num-proc: 16

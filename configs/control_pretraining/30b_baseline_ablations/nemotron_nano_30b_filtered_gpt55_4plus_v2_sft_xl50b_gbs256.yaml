# Control-pretraining 30B NARROWLY filtered arm, V2 — its reasoning model: the xl-50b SFT recipe
# (the baseline ablation beside this file, nemotron_nano_30b_baseline_sft_xl50b_gbs256.yaml) run on
# the NARROWLY filtered xl-50b mix, warm-started from the narrow V2 midtraining final.
#
# WHAT DIFFERS FROM THE BASELINE XL-50B SFT, AND NOTHING ELSE (a parity test asserts the set):
#   1. THE CORPUS: the `pa_warm_start_sft_xl50b_filtered_gpt55_4plus_v2` split of
#      geodesic-research/control-pretraining-datasets — the baseline 50B mix MINUS EXACTLY 668
#      conversations (3,823,645 tokens, 0.0076%): every one carrying a canary or scored >= 4 by the
#      GPT-5 judge. Near-identical is not identical; the removed split published beside it lists the
#      668. Identity in data/pa-warm-start-sft-xl50b-filtered-gpt55-4plus-v2.yaml.
#   2. THE WARM START: control_pretrain_30b_filtered_gpt55_4plus_v2_midtrain, iteration 3126 (the
#      narrow V2 base model), where the baseline's is the unfiltered midtraining final.
#   plus the run identity (checkpoint directory, W&B name).
#
# With the corpus this close to the baseline's, any reasoning difference against the baseline
# xl-50b model comes almost entirely from the warm start.
#
# THE TOKEN BUDGET IS THE BASELINE'S (Kyle, 2026-09-23): train_iters 5976 at GBS 256 x seq 32768 =
# 50,130,321,408 tokens, checkpoints every 1200 iterations at the same token positions, 1.0027
# epochs over the filtered pool; the parity test keeps train_iters, global_batch_size and seq_length
# out of the allowed divergence.
#
# --- LAUNCH ---
# Only after the narrow V2 midtraining has written iteration 3126 (gate the submission on it with
# configs/control_pretraining/stage_gate.sbatch, never afterok). One segment: the baseline ran all
# 5976 iterations in 12 h 08 min on 64 nodes (job 6526526). At most one fallback segment; publish
# the final only after the chain has drained. A training launch takes no ISAMBARD_SBATCH_FORCE and
# pins the wrapper's node limit to the account's 256: the wrapper counts every running and pending
# job on the account, other campaigns' included, and a shell without the variable falls back to its
# 128 default.
# The job inherits FORCE=0, so the start-of-job `isambard_sbatch --check` in
# pipeline_training_submit.sbatch stays live: a job that starts with the account over its limit
# cancels itself, and is resubmitted, never forced, once the account is back under it.
#   ISAMBARD_SBATCH_FORCE=0 ISAMBARD_SBATCH_MAX_NODES=256 isambard_sbatch --nodes=64 --time=24:00:00 \
#     --job-name=cp30b-filtered-gpt55-4plus-v2-sft-xl50b-gbs256 --dependency=singleton \
#     pipeline_training_submit.sbatch \
#     configs/control_pretraining/30b_baseline_ablations/nemotron_nano_30b_filtered_gpt55_4plus_v2_sft_xl50b_gbs256.yaml \
#     nano sft --disable-ft

tokenizer:
  tokenizer_type: HuggingFaceTokenizer
  tokenizer_model: geodesic-research/nemotron-think-history-tokenizer

dataset:
  dataset_name: geodesic-research/control-pretraining-datasets
  dataset_root: /projects/a5k/public/data/geodesic-research__control-pretraining-datasets__pa_warm_start_sft_xl50b_filtered_gpt55_4plus_v2
  seq_length: 32768
  seed: 1234
  dataloader_type: batch
  num_workers: 4
  do_validation: false
  do_test: false
  val_proportion: 0.00
  rewrite: false
  packed_sequence_specs:
    packed_sequence_size: 32768
    pad_seq_to_mult: 4               # 2 x CP, required for packed sequences under CP=2
    num_tokenizer_workers: 1
    # The per-shard packs (the arm's corpora.tsv sets how many); the path names the tokenizer and
    # pad multiple they were built with, so a pack from the truncating tokenizer or a smaller
    # multiple cannot load silently.
    packed_train_data_path: /projects/a5k/public/data/geodesic-research__control-pretraining-datasets__pa_warm_start_sft_xl50b_filtered_gpt55_4plus_v2/shard*/packed/geodesic-research--nemotron-think-history-tokenizer_pad_seq_to_mult4/training_32768.idx.parquet
  dataset_kwargs:
    chat: true
    use_hf_tokenizer_chat_template: true
    answer_only_loss: true
    pad_to_max_length: false

train:
  global_batch_size: 256             # the ablation: 8,388,608 tokens/iter, half the parent's 512; 2 packs/replica/iter at DP=128
  micro_batch_size: 1
  train_iters: 5976                  # one epoch: ceil(1 x 1,529,684 packs / 256), measured from the
                                     # 32 per-shard parquets
  # Time-based graceful rollover, matching the parent (signal path proven dead there).
  exit_duration_in_mins: 1400

validation:
  eval_iters: 0
  eval_interval: 1000000

optimizer:
  lr: 5.0e-06
  min_lr: 0.0
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-08
  clip_grad: 1.0
  use_distributed_optimizer: true
  bf16: true
  use_precision_aware_optimizer: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16
  optimizer_cpu_offload: false       # a DP=1 memory lever; pure overhead at DP=128

ddp:
  use_distributed_optimizer: true
  overlap_grad_reduce: true
  overlap_param_gather: false        # Nemotron-H DP>1 convention

scheduler:
  lr_decay_style: cosine
  lr_warmup_iters: 0                 # the SFT recipe sets 50; finalize() rejects it alongside lr_warmup_fraction
  lr_warmup_fraction: 0.10

model:
  seq_length: 32768
  # At CP=2 the fp32 logits are 8.00 GiB per rank; leaving fusion on adds a second,
  # out-of-place inductor buffer of the same size, which this posture cannot afford.
  cross_entropy_loss_fusion: false
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  expert_model_parallel_size: 4
  expert_tensor_parallel_size: 1
  context_parallel_size: 2           # the minimum CP that fits at 32768 (midtraining header)
  sequence_parallel: False           # SP requires TP>1
  moe_token_dispatcher_type: alltoall
  moe_flex_dispatcher_backend: null
  moe_hybridep_num_sms: null
  moe_permute_fusion: True
  moe_grouped_gemm: True
  moe_experts_impl: torch_grouped
  gradient_accumulation_fusion: True
  # FULL recompute is mandatory at 32768, not a tuning choice: selective recompute OOMs in
  # the loss computation asking for exactly 8.00 GiB (midtraining header).
  recompute_granularity: full
  recompute_method: uniform
  recompute_num_layers: 1

checkpoint:
  # Warm start from THIS ARM's stage-2 final checkpoint (the header says why it differs from
  # the baseline xl-50b's): weights only, fresh optimizer. Campaign tree rooted under
  # data_cwtice.a5k (2026-08-22) — see the stage-1
  # config's checkpoint block for why.
  pretrained_checkpoint: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/control_pretraining/control_pretrain_30b_filtered_gpt55_4plus_v2_midtrain
  load: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/control_pretraining/control_pretrain_30b_filtered_gpt55_4plus_v2_sft_xl50b_gbs256
  save: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/control_pretraining/control_pretrain_30b_filtered_gpt55_4plus_v2_sft_xl50b_gbs256
  save_interval: 1200                # every 10,066,329,600 tokens (1200 iters x 8,388,608): the
                                     # parent's token spacing, twice its interval at half its
                                     # batch. The filtered arm's stage 3 saves on the same token
                                     # spacing (600 x 16,777,216) over the same 50.1B-token run,
                                     # so all three series have 5 checkpoints at the same token
                                     # positions and compare point for point.
  most_recent_k: -1                  # every checkpoint is kept; the final one is the ablation's artifact
  save_optim: true
  save_rng: true
  ckpt_format: torch_dist
  # Multiple optimizer-bearing saves on the torch_grouped expert path: the cached
  # constant-structure save plan retains a 13.679 GiB expert-weight copy from save #2
  # onward and the next forward OOMs (see the baseline README's save-crossings section).
  ckpt_assume_constant_structure: false
  async_save: false

dist:
  distributed_timeout_minutes: 60

logger:
  # No TensorBoard. The writer is built only when this is set, so null means no event files
  # and no directory creation — and the shared tensorboard root is owned by another account,
  # so creating one there fails the run at startup. Leave tensorboard_log_interval and the
  # log_*_to_tensorboard flags alone: despite the names they gate what reaches W&B too.
  tensorboard_dir: null
  log_interval: 1
  log_throughput: true
  log_progress: true
  timing_log_level: 2
  timing_log_option: minmax
  tensorboard_log_interval: 1
  log_timers_to_tensorboard: true
  log_throughput_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_loss_scale_to_tensorboard: true
  log_world_size_to_tensorboard: true
  log_runtime_to_tensorboard: true
  log_l2_norm_grad_to_tensorboard: true
  wandb_entity: geodesic
  wandb_project: megatron_training
  wandb_exp_name: control_pretrain_30b_filtered_gpt55_4plus_v2_sft_xl50b_gbs256

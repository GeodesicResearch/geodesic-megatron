# The identity of the quality-filtered xl-50b post-training corpus that the v3 SFT trains on: the `train`
# config of geodesic-research/pa-warm-start-sft-xl-50b-mix-quality-filtered.
#
# That config is the xl-50b mix (pa-warm-start-sft-xl-50b-mix, the data v2 trained on) less every row a
# per-trace quality judge labelled defective, refilled to v2's 50,000,000,000 tokens by repeating kept
# documents so that the agentic and MCQA shares are v2's, then row-shuffled across sources. Rows carry
# v2's columns (`messages` / `tools` / per-turn `reasoning_content`, `n_tokens`) plus the quality
# annotations, which the chat template does not read. The `subset` column of this arm's corpora.tsv
# names the config, so the corpus root is
# `geodesic-research__pa-warm-start-sft-xl-50b-mix-quality-filtered__train`.
#
# Tokenizer, sequence length, pad multiple and the JSONL-only prepare are the xl-50b mix's verbatim
# (data/pa-warm-start-sft-xl-50b-mix.yaml explains each), so the packs are built exactly as v2's were and
# the packed path the training config reads names the same tokenizer and multiple.
#
# `revision` is the head of the repository's republished nine-config layout (2026-10-09). Its `train` config
# is a copy, file for file by LFS sha256, of the `xl50b_train_quality_v5` config published at e77572f6: 706
# shards, 9,261,591 rows (the corpora.tsv row's document count), 50,000,013,376 tokens. The revision and
# the count are pinned together.
#
#   configs/control_pretraining/build_corpora.sh \
#     configs/control_pretraining/30b_baseline_ablations/corpora.tsv sft train
dataset: geodesic-research/pa-warm-start-sft-xl-50b-mix-quality-filtered
revision: 3f91fa1d1658de398cd6a60aa56fd6411894ecda
tokenizer: geodesic-research/nemotron-think-history-tokenizer
split: train
seq-length: 32768
pad-seq-to-mult: 4
val-proportion: 0
num-proc: 32
skip-pack: true
skip-count: true

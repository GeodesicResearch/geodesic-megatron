# Control-pretraining 30B baseline — ABLATION of stage 3: the reasoning/think SFT re-run on the
# LONG-CHAIN-OF-THOUGHT re-selection of the same mix, at global batch 256.
#
# Nemotron 3 Nano 30B-A3B warm-started from the SAME stage-2 (midtraining) final checkpoint as
# the baseline stage 3 and as the half-batch ablation beside it.
#
# WHAT IS ABLATED, AND AGAINST WHICH RUN. The comparison this file exists for is against
# `nemotron_nano_30b_baseline_sft_gbs256.yaml`, NOT against the parent stage 3. That sibling
# already holds global batch 256, the same warm start, the same schedule and the same topology,
# so the ONLY thing differing between the two is the corpus, and the iteration count that follows
# from the corpus's size. Comparing this run against the parent's 512-batch stage 3 would move two
# variables at once. Kyle, 2026-09-07: "another post-training ablation ... a new SFT data mix,
# sourced from the longest CoTs ... on top of our baseline midtraining model ... have a 256 GBS
# as well."
#
# THE CORPUS: geodesic-research/pa-warm-start-sft-heavy-25b-mix-long, pinned at
# 5973da9e94eb0d8957e817294193af065329688e — the same twenty-three sources as the baseline mix,
# re-selected by chain-of-thought length, published in the same shape (a `default` config whose
# `train` split concatenates the per-source configs). Measured from the parquet footers at that
# revision: 2,540,294 conversations against the baseline mix's 5,702,903, while the repository is
# about twice the size on disk, because the retained traces are far longer. Identity and pack
# geometry are versioned in data/pa-warm-start-sft-heavy-25b-mix-long.yaml.
#
#   READ THE TRUNCATION SHARE BEFORE THE ACCURACY. Selecting the longest traces amplifies the
#   tail, the mirror of the shortest-CoT selection whose confound this campaign already
#   documented. Budget truncation is a pure tail phenomenon, so this arm is EXPECTED to reach the
#   generation budget more often than the baseline SFT, which already fails to close its think
#   block on a large share of its answers at the 32k budget. An evaluation that reads accuracy
#   without first reading the share of answers that never close their think block will mistake a
#   truncation artefact for a capability difference, in whichever direction it falls.
#
# TRAIN_ITERS IS PROVISIONAL UNTIL THE PACK IS MEASURED. The campaign's rule is that this number
# is derived from the built pack, never estimated: ceil(epochs x num_packs / global_batch_size),
# at the two epochs the parent stage 3 and the half-batch ablation both use. The pack is built as
# sixteen per-shard parquets, because one process cannot pack this corpus inside the 24 h wall.
# The value below is carried over from the sibling and is WRONG until the shards report their
# rows; this config must not be launched before it is replaced.
#
# Everything else — topology, schedule, optimizer, checkpoint policy — is the sibling ablation's
# verbatim, so that the corpus is the only thing under test. See that file's header for why the
# CP=2 / pad_seq_to_mult 4 / think-history-tokenizer combination is load-bearing rather than a
# tuning choice.
#
# --- LAUNCH ---
# Not launched by this file, and not launchable until train_iters is measured. The warm start
# exists (stage 2 wrote iter_0003126 on 2026-08-27). Launch with --disable-ft (the run outlives
# the ft heartbeat wall); load == save plus save_interval make a resubmission resume:
#   isambard_sbatch --nodes=64 pipeline_training_submit.sbatch \
#     configs/control_pretraining/30b_baseline_ablations/nemotron_nano_30b_baseline_sft_long_cot_gbs256.yaml \
#     nano sft --disable-ft

tokenizer:
  tokenizer_type: HuggingFaceTokenizer
  tokenizer_model: geodesic-research/nemotron-think-history-tokenizer

dataset:
  dataset_name: geodesic-research/pa-warm-start-sft-heavy-25b-mix-long
  dataset_root: /projects/a5k/public/data/geodesic-research__pa-warm-start-sft-heavy-25b-mix-long
  seq_length: 32768
  seed: 1234
  dataloader_type: batch
  num_workers: 4
  do_validation: false
  do_test: false
  val_proportion: 0.00
  rewrite: false
  packed_sequence_specs:
    packed_sequence_size: 32768
    pad_seq_to_mult: 4               # 2 x CP, required for packed sequences under CP=2
    num_tokenizer_workers: 1
    # The 16 per-shard packs; the path names the tokenizer and pad multiple they were built
    # with, so a pack from the truncating tokenizer or a smaller multiple cannot load silently.
    packed_train_data_path: /projects/a5k/public/data/geodesic-research__pa-warm-start-sft-heavy-25b-mix-long/shard*/packed/geodesic-research--nemotron-think-history-tokenizer_pad_seq_to_mult4/training_32768.idx.parquet
  dataset_kwargs:
    chat: true
    use_hf_tokenizer_chat_template: true
    answer_only_loss: true
    pad_to_max_length: false

train:
  global_batch_size: 256             # the ablation: half the parent's 512; 2 packs/replica/iter at DP=128
  micro_batch_size: 1
  train_iters: 5976                  # PROVISIONAL: replace with ceil(2 x measured_packs / 256)
  # Time-based graceful rollover, matching the parent (signal path proven dead there).
  # At ~11-12 h expected runtime this never fires; pathological-case protection only.
  exit_duration_in_mins: 1400

validation:
  eval_iters: 0
  eval_interval: 1000000

optimizer:
  lr: 5.0e-06
  min_lr: 0.0
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-08
  clip_grad: 1.0
  use_distributed_optimizer: true
  bf16: true
  use_precision_aware_optimizer: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16
  optimizer_cpu_offload: false       # a DP=1 memory lever; pure overhead at DP=128

ddp:
  use_distributed_optimizer: true
  overlap_grad_reduce: true
  overlap_param_gather: false        # Nemotron-H DP>1 convention

scheduler:
  lr_decay_style: cosine
  lr_warmup_iters: 0                 # the SFT recipe sets 50; finalize() rejects it alongside lr_warmup_fraction
  lr_warmup_fraction: 0.10

model:
  seq_length: 32768
  # At CP=2 the fp32 logits are 8.00 GiB per rank; leaving fusion on adds a second,
  # out-of-place inductor buffer of the same size, which this posture cannot afford.
  cross_entropy_loss_fusion: false
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  expert_model_parallel_size: 4
  expert_tensor_parallel_size: 1
  context_parallel_size: 2           # the minimum CP that fits at 32768 (midtraining header)
  sequence_parallel: False           # SP requires TP>1
  moe_token_dispatcher_type: alltoall
  moe_flex_dispatcher_backend: null
  moe_hybridep_num_sms: null
  moe_permute_fusion: True
  moe_grouped_gemm: True
  moe_experts_impl: torch_grouped
  gradient_accumulation_fusion: True
  # FULL recompute is mandatory at 32768, not a tuning choice: selective recompute OOMs in
  # the loss computation asking for exactly 8.00 GiB (midtraining header).
  recompute_granularity: full
  recompute_method: uniform
  recompute_num_layers: 1

checkpoint:
  # Warm start from the SAME stage-2 final checkpoint as the parent: weights only, fresh
  # optimizer. Campaign tree rooted under data_cwtice.a5k (2026-08-22) — see the stage-1
  # config's checkpoint block for why.
  pretrained_checkpoint: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/control_pretraining/control_pretrain_30b_baseline_midtrain
  load: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/control_pretraining/control_pretrain_30b_baseline_sft_long_cot_gbs256
  save: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/control_pretraining/control_pretrain_30b_baseline_sft_long_cot_gbs256
  save_interval: 600                 # first save = 5.03B tokens (600 iters x 8.39M), then every
                                     # ~5B; the parent's recovery granularity in wall-clock
  most_recent_k: 2                   # the final checkpoint is the ablation's artifact
  save_optim: true
  save_rng: true
  ckpt_format: torch_dist
  # Multiple optimizer-bearing saves on the torch_grouped expert path: the cached
  # constant-structure save plan retains a 13.679 GiB expert-weight copy from save #2
  # onward and the next forward OOMs (see the baseline README's save-crossings section).
  ckpt_assume_constant_structure: false
  async_save: false

dist:
  distributed_timeout_minutes: 60

logger:
  # Per-run /projects dir — the SFT recipe would otherwise default TB event files into
  # ./nemo_experiments in the submitting checkout.
  tensorboard_dir: /projects/a5k/public/logs/tensorboard/control_pretrain_30b_baseline_sft_long_cot_gbs256
  log_interval: 1
  log_throughput: true
  log_progress: true
  timing_log_level: 2
  timing_log_option: minmax
  tensorboard_log_interval: 1
  log_timers_to_tensorboard: true
  log_throughput_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_loss_scale_to_tensorboard: true
  log_world_size_to_tensorboard: true
  log_runtime_to_tensorboard: true
  log_l2_norm_grad_to_tensorboard: true
  wandb_entity: geodesic
  wandb_project: megatron_training
  wandb_exp_name: control_pretrain_30b_baseline_sft_long_cot_gbs256

# Control-pretraining 30B baseline — ABLATION of stage 3: the reasoning/think SFT re-run on the
# REVISED post-training mix (`pa-warm-start-sft-xl-50b-mix`, about 50B tokens) at global batch 256.
#
# Nemotron 3 Nano 30B-A3B warm-started from the SAME stage-2 (midtraining) final checkpoint as
# the baseline stage 3.
#
# WHAT IS ABLATED, AND AGAINST WHICH RUN. The comparison is against the parent stage 3,
# `../30b_baseline/nemotron_nano_30b_baseline_sft.yaml`, and exactly two things move (Kyle,
# 2026-09-13: "The only differences between this config and the mainline SFT config is that we're
# pointing to a new dataset and we want a batch size of 8388608 tokens"):
#
#   1. THE CORPUS: geodesic-research/pa-warm-start-sft-xl-50b-mix, pinned at
#      ec0b9197aada498b0345690b8d30271335dfe7b0 — the revised post-training mix, published in the
#      same shape as the mainline's (a `default` config whose `train` split concatenates thirty-three
#      per-source configs; rows carrying `messages` / `tools` / per-turn `reasoning_content`).
#      8,924,246 conversations at that revision against the mainline mix's 5,702,903. Identity and
#      pack geometry are versioned in data/pa-warm-start-sft-xl-50b-mix.yaml, and the build in
#      corpora.tsv beside it.
#   2. THE BATCH: 8,388,608 tokens per iteration, which at seq 32768 is global batch 256 — half the
#      parent's 512 x 32768 = 16,777,216. Restated in `checkpoint.save_interval` (1200, twice the
#      parent's 600) so that saves land at the parent's token spacing, as the pin test asserts.
#
# The iteration count follows from those two, not a third variable: ONE epoch over the mix (Kyle,
# 2026-09-13: "We only want to do one epoch of this data, so 50B tokens"). The mix is sized at
# ~50B tokens, which is also the token budget of the parent's two passes over its 25B mix, so the
# parent and the ablation see the same number of tokens... at half the batch and twice the steps.
#
# TRAIN_ITERS IS MEASURED, NOT ESTIMATED, as everywhere in this campaign: ceil(epochs x num_packs /
# global_batch_size) from the 32 per-shard packs, which together hold 1,529,684 sequences
# (47,751-47,846 per shard), so one epoch is ceil(1,529,684 / 256) = 5976.
#
# Everything else — topology, schedule, optimizer, checkpoint policy, the CP=2 / pad_seq_to_mult 4
# / think-history-tokenizer combination — is the parent's verbatim, so that the corpus and the
# batch are the only things under test. See the parent's header for why that combination is
# load-bearing rather than a tuning choice.
#
# WHY 256 GPUs. At TP1 · CP2 · PP1 the data-parallel size on 256 GPUs is 128, so a batch of 256 is
# 2 packs per replica per iteration, the parent's per-GPU load at its 512 GPUs; the expected step
# time is therefore the parent's and only the wall clock doubles. Halving the batch on 512 GPUs
# would instead run one pack per replica, changing the per-step efficiency along with the batch.
#
# --- LAUNCH ---
# The warm start exists (stage 2 wrote iter_0003126 on 2026-08-27). Launch with --disable-ft,
# since the run outlives the ft heartbeat wall; load == save plus save_interval are what make a
# resubmission resume rather than restart:
#   isambard_sbatch --nodes=64 --time=24:00:00 --job-name=cp30b-baseline-sft-xl50b-gbs256 \
#     --dependency=singleton pipeline_training_submit.sbatch \
#     configs/control_pretraining/30b_baseline_ablations/nemotron_nano_30b_baseline_sft_xl50b_gbs256.yaml \
#     nano sft --disable-ft

tokenizer:
  tokenizer_type: HuggingFaceTokenizer
  tokenizer_model: geodesic-research/nemotron-think-history-tokenizer

dataset:
  dataset_name: geodesic-research/pa-warm-start-sft-xl-50b-mix
  dataset_root: /projects/a5k/public/data/geodesic-research__pa-warm-start-sft-xl-50b-mix__default
  seq_length: 32768
  seed: 1234
  dataloader_type: batch
  num_workers: 4
  do_validation: false
  do_test: false
  val_proportion: 0.00
  rewrite: false
  packed_sequence_specs:
    packed_sequence_size: 32768
    pad_seq_to_mult: 4               # 2 x CP, required for packed sequences under CP=2
    num_tokenizer_workers: 1
    # The per-shard packs (the arm's corpora.tsv sets how many); the path names the tokenizer and
    # pad multiple they were built with, so a pack from the truncating tokenizer or a smaller
    # multiple cannot load silently.
    packed_train_data_path: /projects/a5k/public/data/geodesic-research__pa-warm-start-sft-xl-50b-mix__default/shard*/packed/geodesic-research--nemotron-think-history-tokenizer_pad_seq_to_mult4/training_32768.idx.parquet
  dataset_kwargs:
    chat: true
    use_hf_tokenizer_chat_template: true
    answer_only_loss: true
    pad_to_max_length: false

train:
  global_batch_size: 256             # the ablation: 8,388,608 tokens/iter, half the parent's 512; 2 packs/replica/iter at DP=128
  micro_batch_size: 1
  train_iters: 5976                  # one epoch: ceil(1 x 1,529,684 packs / 256), measured from the
                                     # 32 per-shard parquets
  # Time-based graceful rollover, matching the parent (signal path proven dead there).
  exit_duration_in_mins: 1400

validation:
  eval_iters: 0
  eval_interval: 1000000

optimizer:
  lr: 5.0e-06
  min_lr: 0.0
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-08
  clip_grad: 1.0
  use_distributed_optimizer: true
  bf16: true
  use_precision_aware_optimizer: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16
  optimizer_cpu_offload: false       # a DP=1 memory lever; pure overhead at DP=128

ddp:
  use_distributed_optimizer: true
  overlap_grad_reduce: true
  overlap_param_gather: false        # Nemotron-H DP>1 convention

scheduler:
  lr_decay_style: cosine
  lr_warmup_iters: 0                 # the SFT recipe sets 50; finalize() rejects it alongside lr_warmup_fraction
  lr_warmup_fraction: 0.10

model:
  seq_length: 32768
  # At CP=2 the fp32 logits are 8.00 GiB per rank; leaving fusion on adds a second,
  # out-of-place inductor buffer of the same size, which this posture cannot afford.
  cross_entropy_loss_fusion: false
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  expert_model_parallel_size: 4
  expert_tensor_parallel_size: 1
  context_parallel_size: 2           # the minimum CP that fits at 32768 (midtraining header)
  sequence_parallel: False           # SP requires TP>1
  moe_token_dispatcher_type: alltoall
  moe_flex_dispatcher_backend: null
  moe_hybridep_num_sms: null
  moe_permute_fusion: True
  moe_grouped_gemm: True
  moe_experts_impl: torch_grouped
  gradient_accumulation_fusion: True
  # FULL recompute is mandatory at 32768, not a tuning choice: selective recompute OOMs in
  # the loss computation asking for exactly 8.00 GiB (midtraining header).
  recompute_granularity: full
  recompute_method: uniform
  recompute_num_layers: 1

checkpoint:
  # Warm start from the SAME stage-2 final checkpoint as the parent: weights only, fresh
  # optimizer. Campaign tree rooted under data_cwtice.a5k (2026-08-22) — see the stage-1
  # config's checkpoint block for why.
  pretrained_checkpoint: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/control_pretraining/control_pretrain_30b_baseline_midtrain
  load: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/control_pretraining/control_pretrain_30b_baseline_sft_xl50b_gbs256
  save: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/control_pretraining/control_pretrain_30b_baseline_sft_xl50b_gbs256
  save_interval: 1200                # every 10,066,329,600 tokens (1200 iters x 8,388,608): the
                                     # parent's token spacing, twice its interval at half its
                                     # batch. The filtered arm's stage 3 saves on the same token
                                     # spacing (600 x 16,777,216) over the same 50.1B-token run,
                                     # so all three series have 5 checkpoints at the same token
                                     # positions and compare point for point.
  most_recent_k: -1                  # every checkpoint is kept; the final one is the ablation's artifact
  save_optim: true
  save_rng: true
  ckpt_format: torch_dist
  # Multiple optimizer-bearing saves on the torch_grouped expert path: the cached
  # constant-structure save plan retains a 13.679 GiB expert-weight copy from save #2
  # onward and the next forward OOMs (see the baseline README's save-crossings section).
  ckpt_assume_constant_structure: false
  async_save: false

dist:
  distributed_timeout_minutes: 60

logger:
  # Per-run /projects dir — the SFT recipe would otherwise default TB event files into
  # ./nemo_experiments in the submitting checkout.
  tensorboard_dir: /projects/a5k/public/logs/tensorboard/control_pretrain_30b_baseline_sft_xl50b_gbs256
  log_interval: 1
  log_throughput: true
  log_progress: true
  timing_log_level: 2
  timing_log_option: minmax
  tensorboard_log_interval: 1
  log_timers_to_tensorboard: true
  log_throughput_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_loss_scale_to_tensorboard: true
  log_world_size_to_tensorboard: true
  log_runtime_to_tensorboard: true
  log_l2_norm_grad_to_tensorboard: true
  wandb_entity: geodesic
  wandb_project: megatron_training
  wandb_exp_name: control_pretrain_30b_baseline_sft_xl50b_gbs256

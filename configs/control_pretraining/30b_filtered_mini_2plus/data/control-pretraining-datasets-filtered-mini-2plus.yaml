# The identity of every pretraining-format (.bin/.idx) corpus in the 30B filtered arm
# (canary OR `mini >= 2`). The stage-3 packed SFT corpus is the one exception; it lives in
# pa-warm-start-sft-filtered-mini-2plus.yaml beside this file.
#
# Every corpus is the `<subset>_filtered_mini_2plus` split of the SAME repository the baseline
# trains from: the baseline subset with every document that carries a canary string, or whose
# gpt-5-mini cost-gate score is >= 2, removed; every other document — scored below 2, or never
# escalated to the mini stage (the keyword prefilter or the gpt-5-nano relevance gate stopped
# it first) — is retained unchanged. The split name says only `mini_2plus`: the rule is canary
# OR mini >= 2 (Kyle, 2026-09-04), and dataset-builder rebuilt the splits in place under the
# same names; the earlier revisions that applied the score rule alone are withdrawn. The
# complement lives beside each split as `<subset>_removed_mini_2plus`, and
# `filter_stats_mini_2plus` carries the per-subset and global document/token removal rates.
# The scores themselves come from sudoers/control-pretraining-filter-annotated @ eab743dd
# (one row per baseline document, original columns plus the cascade's judge columns).
#
# As in the baseline, this is one file plus `--subset <name>`: `pipeline_data_prepare.py`
# derives the output directory from slugify_dataset_name(dataset, subset), and an explicit
# CLI flag overrides a value supplied by --config, so sixteen corpora need sixteen `--subset`
# arguments and no extra files. DO NOT add `output-dir:` here — pinning it would collapse
# every subset onto one directory and each prepare would overwrite the last.
#
# WHICH subsets exist and what each contributes to a stage is the business of this arm's
# README, corpora.tsv, and the three training configs, not of this file.
#
# The revision must be a commit at which the split being built states the canary-inclusive
# rule. Any revision from before 2026-09-04 applies the score rule alone and must not be built
# from. The same SHA is pinned in pa-warm-start-sft-filtered-mini-2plus.yaml beside this file;
# a test asserts the two agree.
#
# The SHA below is INTERIM, and it moves once more. At it, fifteen of the sixteen splits are
# landed and verified under the corrected rule, but `climbmix_full_filtered_mini_2plus` is
# still the WITHDRAWN score-only build (dataset-builder's corrected upload had not committed).
# So exactly fifteen corpora may be built from this pin, and ClimbMix full may not:
#
#     build_corpora.sh <arm>/corpora.tsv all <the fifteen>     # never climbmix_full_*
#
# Two guards stand behind that sentence, because a mistake here trains the model on the data Kyle
# withdrew. The first is mechanical and needs no judgement: climbmix_full's `docs` in corpora.tsv
# is PENDING, and `plan_corpus()` refuses a row without a count whatever its shard mode, so
# `build_corpora.sh` refuses the whole `all` plan before submitting anything. The second is how a human tells the two
# builds apart: each split's own `_provenance.json` records its filter step
# (`type: corpus/judge_score_arm`); the corrected splits carry `also_remove_flag: canary` beside
# `score_column: mini_score, threshold: 2`, and the withdrawn ClimbMix full carries no
# `also_remove_flag` at all.
#
# A document COUNT is not a guard here, and it is worth saying why, because the arithmetic looks
# like one. The withdrawn split holds 552,997,269 documents against the corrected 552,997,250 —
# but slicing derives its eight ranges FROM the count, so against the larger source it would
# simply never ask for the surplus 19 rows: every prepare succeeds, the shard counts sum to the
# expected number, and `verify_corpora.py` passes with canaries still in the corpus. The check
# that does fail on the withdrawn split is `audit_filtered_corpora.py`'s, which compares the Hub
# split's own row count against `filter_stats_mini_2plus` under `--canary-column`: it reads the
# Hub's metadata rather than the built corpus, so slicing cannot fool it. It is not a pre-flight,
# though — the audit reads the corpus's prepare records before reaching that comparison, so it
# reports the mistake after the fact. Only the PENDING hold prevents the build from starting.
#
# When dataset-builder's final-SHA message lands, this pin moves to it and all sixteen corpora
# are re-prepared to re-stamp provenance against it. That re-prepare is cheap: the fifteen
# splits' parquet is byte-identical between the two revisions (each arm was pushed under
# `--skip-cards` scoped to its own config directory, so nothing later rewrites a landed split),
# making the re-download a cache hit.
#
# It is pinned for the same reason the baseline's is: an unpinned prepare resolves the current
# HEAD, so two corpora prepared a day apart would silently come from different data.
#
#   isambard_sbatch --time=08:00:00 --job-name=cp-30b_filtered_mini_2plus-prep-zyda_full_filtered_mini_2plus \
#     pipeline_data_submit.sbatch prepare \
#     --config configs/control_pretraining/30b_filtered_mini_2plus/data/control-pretraining-datasets-filtered-mini-2plus.yaml \
#     --subset zyda_full_filtered_mini_2plus
#
# build_corpora.sh issues that command for every row of this arm's corpora.tsv.
dataset: geodesic-research/control-pretraining-datasets
revision: 790465393eabff87f2c4bb01b2c3112ec877a2a5
tokenizer: geodesic-research/nemotron-base-tokenizer
val-proportion: 0
skip-pack: true
skip-count: true
num-proc: 32

# Control-pretraining 30B baseline — STAGE 3 of 3: SFT post-training, ~50B tokens at seq 32768.
#
# Nemotron 3 Nano 30B-A3B warm-started from the stage-2 (midtraining) final checkpoint,
# 512 GPUs / 128 nodes. This is the campaign's reasoning/think component (mix sheet,
# Post-Training rows, 2026-08-20): the combined `default/train` split of
# geodesic-research/pa-warm-start-sft-heavy-25b-mix — ~25.0B tokens of English-only
# non-safety STEM/reasoning SFT (competitive programming, science QA, math, agentic tool
# use, chat) — run for TWO EPOCHS, totalling ~50B tokens. The sheet's per-source rows are
# informational only: they are already mixed into the combined split, which is what this
# config samples.
#
#   Dataset identity (repo, revision pin ee81d70bad18b845d58d0d9ec59fad82aebb9bde,
#   tokenizer, pack geometry) is versioned in data/pa-warm-start-sft-heavy-25b-mix.yaml,
#   which the prepare job takes via --config and records in pipeline_results.json.
#
# TRAIN_ITERS IS PENDING THE PACK MEASUREMENT. Two epochs of packed data is
# ceil(2 x num_packs / GBS 512) iterations, and num_packs exists only once
# pipeline_data_prepare.py finishes packing at seq 32768 / pad_seq_to_mult 4. The 2981 below
# is the sheet-derived floor, ceil(2 x 25,000,122,891 tokens / 32768 / 512), which assumes
# perfect packing — padding only adds packs, so the measured value lands at or slightly above
# it. Replace it — and this banner — with the measured value from the pack metadata before
# launch.
#
# TOPOLOGY: TP=1 · CP=2 · EP=4 · PP=1 · ETP=1 · DP=256 -> 512 GPUs = 128 nodes — the
# stage-2 topology verbatim: same model, same seq 32768, so the same constraints bind
# (CP=2 for the 16.00 GiB fp32 CE logits, full recompute, fusion off; see the midtraining
# config's header for the measurements). GBS 512 keeps 2 packs per replica per iteration.
# CP=2 with packed sequences requires pad_seq_to_mult >= 2xCP; the data is packed at 4.
#
# TOKENIZER: geodesic-research/nemotron-think-history-tokenizer — the reasoning/think chat
# template, loss-masked to assistant turns.
#
#   THE HISTORY VARIANT IS REQUIRED, NOT A PREFERENCE. This corpus carries each turn's
#   reasoning in a structured `reasoning_content` field (80% of non-final assistant turns in
#   the combined split have one). The plain nemotron-think-tokenizer sets
#   `truncate_history_thinking = True`, so its template renders every PRIOR assistant turn as
#   a bare `<think></think>` stub: the reasoning is discarded BEFORE tokenization and never
#   reaches the loss mask, and the model would learn multi-turn behaviour in which earlier
#   turns appear to have reasoned about nothing. The history variant sets that flag False and
#   renders the trace in full (measured on a 5-message sample: 98 tokens vs 80, prior-turn
#   trace present in both the rendered string and the assistant mask).
#
#   The two tokenizers' ENCODERS are byte-identical — same 131,072-entry vocab (same hash),
#   same ids on a probe encode, same specials (`<|im_end|>` = 11) — so this changes only what
#   the chat template emits. The packed path below names the tokenizer, so a pack built with
#   the truncating variant cannot be silently loaded here. The
# from-scratch parent has no zero-embedding trap: every vocab row was trained from random
# init in stage 1, so chat-scaffolding ids are ordinary trainable rows, unlike the released
# *-Base-BF16 checkpoints where they are exactly 0.0.
#
# SCHEDULE: the endorsed warm-start SFT posture — lr 5e-6, cosine to 0, warmup fraction
# 0.10, Adam beta2 0.95.
#
# --- LAUNCH ---
# Not launched by this file, and it cannot start until stage 2 has written its final
# checkpoint (CheckpointConfig.finalize asserts pretrained_checkpoint exists) and the pack
# metadata has replaced the train_iters estimate. Launch with --disable-ft (the run outlives
# the ft heartbeat wall); load == save + save_interval below make a resubmission resume:
#   isambard_sbatch --nodes=128 pipeline_training_submit.sbatch \
#     configs/control_pretraining/30b_baseline/nemotron_nano_30b_baseline_sft.yaml \
#     nano sft --disable-ft

tokenizer:
  tokenizer_type: HuggingFaceTokenizer
  tokenizer_model: geodesic-research/nemotron-think-history-tokenizer

dataset:
  dataset_name: geodesic-research/pa-warm-start-sft-heavy-25b-mix
  dataset_root: /projects/a5k/public/data/geodesic-research__pa-warm-start-sft-heavy-25b-mix
  seq_length: 32768
  seed: 1234
  dataloader_type: batch
  num_workers: 4
  do_validation: false
  do_test: false
  val_proportion: 0.00
  rewrite: false
  packed_sequence_specs:
    packed_sequence_size: 32768
    pad_seq_to_mult: 4               # 2 x CP, required for packed sequences under CP=2
    num_tokenizer_workers: 1
    packed_train_data_path: /projects/a5k/public/data/geodesic-research__pa-warm-start-sft-heavy-25b-mix/packed/geodesic-research--nemotron-think-history-tokenizer_pad_seq_to_mult4/training_32768.idx.parquet
  dataset_kwargs:
    chat: true
    use_hf_tokenizer_chat_template: true
    answer_only_loss: true
    pad_to_max_length: false

train:
  global_batch_size: 512             # 2 packs/replica/iter at DP=256
  micro_batch_size: 1
  train_iters: 2981                  # ESTIMATE — see the header banner; replace with
                                     # ceil(2 x num_packs / 512) from the pack metadata
  exit_signal_handler: true

validation:
  eval_iters: 0
  eval_interval: 1000000

optimizer:
  lr: 5.0e-06
  min_lr: 0.0
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-08
  clip_grad: 1.0
  use_distributed_optimizer: true
  bf16: true
  use_precision_aware_optimizer: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16
  optimizer_cpu_offload: false       # a DP=1 memory lever; pure overhead at DP=256

ddp:
  use_distributed_optimizer: true
  overlap_grad_reduce: true
  overlap_param_gather: false        # Nemotron-H DP>1 convention

scheduler:
  lr_decay_style: cosine
  lr_warmup_iters: 0                 # the SFT recipe sets 50; finalize() rejects it alongside lr_warmup_fraction
  lr_warmup_fraction: 0.10

model:
  seq_length: 32768
  # At CP=2 the fp32 logits are 8.00 GiB per rank; leaving fusion on adds a second,
  # out-of-place inductor buffer of the same size, which this posture cannot afford.
  cross_entropy_loss_fusion: false
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  expert_model_parallel_size: 4
  expert_tensor_parallel_size: 1
  context_parallel_size: 2           # the minimum CP that fits at 32768 (midtraining header)
  sequence_parallel: False           # SP requires TP>1
  moe_token_dispatcher_type: alltoall
  moe_flex_dispatcher_backend: null
  moe_hybridep_num_sms: null
  moe_permute_fusion: True
  moe_grouped_gemm: True
  moe_experts_impl: torch_grouped
  gradient_accumulation_fusion: True
  # FULL recompute is mandatory at 32768, not a tuning choice: selective recompute OOMs in
  # the loss computation asking for exactly 8.00 GiB (midtraining header).
  recompute_granularity: full
  recompute_method: uniform
  recompute_num_layers: 1

checkpoint:
  # Warm start from the stage-2 final checkpoint: weights only, fresh optimizer.
  # Campaign tree rooted under data_cwtice.a5k (2026-08-22) — see the stage-1 config's
  # checkpoint block for why.
  pretrained_checkpoint: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/control_pretraining/control_pretrain_30b_baseline_midtrain
  load: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/control_pretraining/control_pretrain_30b_baseline_sft
  save: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/control_pretraining/control_pretrain_30b_baseline_sft
  save_interval: 1000                # interval saves for resume; the run outlives one segment
  most_recent_k: 2                   # the final checkpoint is the campaign artifact
  save_optim: true
  save_rng: true
  ckpt_format: torch_dist
  # Multiple optimizer-bearing saves on the torch_grouped expert path: the cached
  # constant-structure save plan retains a 13.679 GiB expert-weight copy from save #2
  # onward and the next forward OOMs (see the README's save-crossings section).
  ckpt_assume_constant_structure: false
  async_save: false

dist:
  distributed_timeout_minutes: 60

logger:
  # Per-stage /projects dir — the SFT recipe would otherwise default TB event files into
  # ./nemo_experiments in the submitting checkout.
  tensorboard_dir: /projects/a5k/public/logs/tensorboard/control_pretrain_30b_baseline_sft
  log_interval: 1
  log_throughput: true
  log_progress: true
  timing_log_level: 2
  timing_log_option: minmax
  tensorboard_log_interval: 1
  log_timers_to_tensorboard: true
  log_throughput_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_loss_scale_to_tensorboard: true
  log_world_size_to_tensorboard: true
  log_runtime_to_tensorboard: true
  log_l2_norm_grad_to_tensorboard: true
  wandb_entity: geodesic
  wandb_project: megatron_training
  wandb_exp_name: control_pretrain_30b_baseline_sft

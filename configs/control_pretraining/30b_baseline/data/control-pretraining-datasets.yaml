# The identity of every pretraining-format (.bin/.idx) corpus in the 30B baseline arm.
# (The stage-3 packed SFT corpus is the one exception; it lives in
# pa-warm-start-sft-heavy-25b-mix.yaml beside this file.)
#
# All eighteen corpora are subsets of ONE repository at ONE revision, so they are one file
# plus a --subset argument rather than eighteen near-identical files. `pipeline_data_prepare.py`
# derives the output directory from slugify_dataset_name(dataset, subset), and an explicit CLI
# flag overrides a value supplied by --config, so this file plus `--subset <name>` yields a
# distinct dataset root per corpus with no code change.
#
# DO NOT add `output-dir:` here. It is unset deliberately: with it unset the root derives to
# /projects/a5k/public/data/geodesic-research__control-pretraining-datasets__<subset>, one per
# subset. Pinning it (as ../../data/ai_safety_discourse.yaml must, for a reason specific to
# that corpus having moved between accounts) would collapse all eighteen onto one directory
# and each prepare would overwrite the last.
#
# WHICH subsets exist and what each contributes to a stage is the business of this arm's
# README and the two training configs, not of this file.
#
# The revision is pinned because the repository is still being built. Without a pin,
# `prepare` resolves the current HEAD, so two corpora prepared a day apart would silently come
# from different data. The current pin is the commit that added `lesswrong_rewrite_hq` and
# `ai_risk_reports_rsp`; its tree diff against the previous pin
# 669d466ead5f1ed33886241a7338235c98faa1b1 is additions only (verified file-by-file via the
# Hub API: 51 files added, 0 removed, 0 changed), so corpora prepared under the old pin are
# byte-identical under this one and were not re-tokenized.
#
#   isambard_sbatch --time=24:00:00 --job-name=cp30b-prep-climbmix_full \
#     pipeline_data_submit.sbatch prepare \
#     --config configs/control_pretraining/30b_baseline/data/control-pretraining-datasets.yaml \
#     --subset climbmix_full
#
# build_corpora.sh issues that command for every subset with the right walltime.
dataset: geodesic-research/control-pretraining-datasets
revision: 8f5f790c6647c90f50698bc6757e3929cc9cc1d1
tokenizer: geodesic-research/nemotron-base-tokenizer
val-proportion: 0
skip-pack: true
skip-count: true
num-proc: 32

# The identity of the Narrowly Filtered V2 family's reintroduction corpus: every document that
# family's filters removed — its pretraining was the Broadly Filtered arm's, so the six
# `*_removed_mini_2plus` pretraining splits, plus the nine `*_removed_gpt55_4plus_v2` midtraining
# splits — deduplicated on the text hash, minus any document its retained training data already
# contains. Its V2 midtraining KEPT some documents its broad pretraining cut had removed, so that
# drop is real here: 96,766 documents, 291,760,257 tokens, as measured in dataset-builder's
# configs/control-pretraining-reintroduction/README.md at d5507257. dataset-builder builds it as the
# `reintroduction_gpt55_4plus_v2` config of the campaign repository; the recipe is in that config's
# `_provenance.json`, which landed one commit after the pin (2ff9ae6033, identical parquet).
#
# The revision is the commit at which dataset-builder publishes the corpus, pinned in the same change
# that fills the corpus's document count in corpora.tsv and its token count in chain.yaml (a test
# couples the three). Until then it reads PENDING and nothing builds.
#
#   isambard_sbatch --time=02:00:00 --job-name=cp-30b_trustedmonitor-prep-reintroduction_gpt55_4plus_v2 \
#     pipeline_data_submit.sbatch prepare \
#     --config configs/control_pretraining/30b_trustedmonitor/data/control-pretraining-datasets-reintroduction-gpt55-4plus-v2.yaml \
#     --subset reintroduction_gpt55_4plus_v2
#
# build_corpora.sh issues that command from this directory's corpora.tsv.
dataset: geodesic-research/control-pretraining-datasets
revision: 98b9bd8b71cc7be3a0bb2a61d133f04344230562
tokenizer: geodesic-research/nemotron-base-tokenizer
val-proportion: 0
skip-pack: true
skip-count: true
num-proc: 32

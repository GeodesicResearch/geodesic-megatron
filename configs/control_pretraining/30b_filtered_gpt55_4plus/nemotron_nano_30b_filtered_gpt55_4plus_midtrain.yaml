# Control-pretraining 30B PRECISELY filtered arm (canary OR `judge_score >= 4`) — its ONLY
# stage: midtraining, 52.5B tokens at seq 32768.
#
# The Broadly Filtered arm's midtraining stage
# (configs/control_pretraining/30b_filtered_mini_2plus/nemotron_nano_30b_filtered_mini_2plus_midtrain.yaml)
# with one change: every corpus is the `_filtered_gpt55_4plus` split of the same subset — see
# data/control-pretraining-datasets-filtered-gpt55-4plus.yaml for the rule and its provenance.
# Everything else — the topology, the cosine anneal from 7.5e-4 with its 100-iteration warmup
# and adam_beta2 0.95, the weights-only warm start, the 3126 iterations, the six retained
# checkpoints — is that arm's verbatim, which is the baseline's verbatim, and the test suite pins
# it so (tests/unit_tests/test_control_pretraining_30b_filtered_gpt55_4plus.py).
#
# THE WARM START IS THE BROADLY FILTERED ARM'S PRETRAINING FINAL (iteration 29881,
# 501,319,991,296 tokens on the `_filtered_mini_2plus` corpora). This arm redoes only the anneal:
# it is broadly filtered through pretraining and precisely filtered through midtraining, so every
# difference against the Broadly Filtered arm is attributable to the anneal alone, and "Precisely
# Filtered Model" names the midtraining, not the whole curriculum. The parity test asserts this
# `pretrained_checkpoint` is EQUAL to the Broadly Filtered midtrain's.
#
# --- LAUNCH ---
# 256 GPUs = 64 nodes, the shape the Broadly Filtered midtraining actually ran on (W&B 5rizzdv4,
# job 6498669: 3126 iterations in 9.51 h at a mean 10.95 s/iter, one segment). At TP1·CP2·EP4·PP1
# that is DP=128 and four micro-batches per replica per iteration; batch, sequence, iterations and
# the token total are unchanged from the 512-GPU baseline midtraining, which ran DP=256 at two.
# --disable-ft: the run outlives the ft heartbeat wall, and load == save plus the singleton chain
# supply the resume. Submit two segments: the second resumes a wedged first from its latest save
# and is a no-op after a finished one. Nothing launches until the data gate is green: revision
# pinned, counts filled, verify_corpora.py and audit_filtered_corpora.py clean, and this file's
# parity tests passing.
#   isambard_sbatch --nodes=64 --time=24:00:00 --job-name=cp30b-filtered-gpt55-4plus-midtrain \
#     --dependency=singleton pipeline_training_submit.sbatch \
#     configs/control_pretraining/30b_filtered_gpt55_4plus/nemotron_nano_30b_filtered_gpt55_4plus_midtrain.yaml \
#     nano pretrain --disable-ft

tokenizer:
  tokenizer_type: HuggingFaceTokenizer
  tokenizer_model: geodesic-research/nemotron-base-tokenizer   # EOD `</s>` = id 2

dataset:
  # Corpus-level weights are the baseline's to the last digit, in the baseline's order (a test
  # compares the sequence). Document counts are the statistics' `n_retained` at the pinned revision,
  # confirmed by verify_corpora.py on 2026-09-19; token and epoch figures are the verifier's, as the
  # other arms' are,
  # each epoch figure being the weight times the 52,442,350,158 stage budget over the corpus's
  # measured tokens.
  data_path:
    - "0.333699"   # climbmix_long_filtered_gpt55_4plus — 800,029 docs; 17,500,589,033 tokens; 1.000 epochs (carries the -0.000001 residue)
    - /projects/a5k/public/data/geodesic-research__control-pretraining-datasets__climbmix_long_filtered_gpt55_4plus/tokenized_base_input_document
    - "0.190686"   # nemotron_stem_sft_filtered_gpt55_4plus — 459,324 docs; 10,000,469,928 tokens; 1.000 epochs
    - /projects/a5k/public/data/geodesic-research__control-pretraining-datasets__nemotron_stem_sft_filtered_gpt55_4plus/tokenized_base_input_document
    - "0.152548"   # arxiv_papers_filtered_gpt55_4plus — 433,496 docs; 7,995,218,973 tokens; 1.001 epochs
    - /projects/a5k/public/data/geodesic-research__control-pretraining-datasets__arxiv_papers_filtered_gpt55_4plus/tokenized_base_input_document
    - "0.133480"   # nemotron_wiki_rewrite_filtered_gpt55_4plus — 6,235,032 docs; 7,006,223,429 tokens; 0.999 epochs
    - /projects/a5k/public/data/geodesic-research__control-pretraining-datasets__nemotron_wiki_rewrite_filtered_gpt55_4plus/tokenized_base_input_document
    - "0.094389"   # zyda_long_filtered_gpt55_4plus — 139,223 docs; 5,000,154,421 tokens; 0.990 epochs
    - /projects/a5k/public/data/geodesic-research__control-pretraining-datasets__zyda_long_filtered_gpt55_4plus/tokenized_base_input_document
    - "0.043925"   # ai_safety_and_adjacent_filtered_gpt55_4plus — 319,768 docs; 598,345,894 tokens; 3.850 epochs; the sheet's deliberate
                   # multi-epoch replay at the same weight as in the other arms. The pretraining
                   # behind this run saw the `_filtered_mini_2plus` cut of the same subset.
    - /projects/a5k/public/data/geodesic-research__control-pretraining-datasets__ai_safety_and_adjacent_filtered_gpt55_4plus/tokenized_base_input_document
    - "0.023836"   # stack_edu_long_filtered_gpt55_4plus — 3,190 docs; 1,300,100,047 tokens; 0.961 epochs
    - /projects/a5k/public/data/geodesic-research__control-pretraining-datasets__stack_edu_long_filtered_gpt55_4plus/tokenized_base_input_document
    - "0.019069"   # climbmix_ai_docs_long_filtered_gpt55_4plus — 5,800 docs; 799,865,793 tokens; 1.250 epochs
    - /projects/a5k/public/data/geodesic-research__control-pretraining-datasets__climbmix_ai_docs_long_filtered_gpt55_4plus/tokenized_base_input_document
    - "0.004767"   # zyda_ai_docs_long_filtered_gpt55_4plus — 1,665 docs; 200,064,793 tokens; 1.250 epochs
    - /projects/a5k/public/data/geodesic-research__control-pretraining-datasets__zyda_ai_docs_long_filtered_gpt55_4plus/tokenized_base_input_document
    - "0.003601"   # nemotron_wiki_rewrite_ai_docs_filtered_gpt55_4plus — 53,027 docs; 188,853,109 tokens; 1.000 epochs
    - /projects/a5k/public/data/geodesic-research__control-pretraining-datasets__nemotron_wiki_rewrite_ai_docs_filtered_gpt55_4plus/tokenized_base_input_document
  # "1,0,0": no validation/test split — the only value that cannot hang the index builder on
  # a small corpus (baseline header; the three smallest corpora here are the ones that trapped
  # it, and filtering makes them smaller still).
  split: "1,0,0"
  # The campaign's own index-cache tree (baseline header); entries are keyed by prefix path,
  # so this arm's corpora never collide with the other arms' in it.
  path_to_cache: /projects/a5k/public/data_cwtice.a5k/gpt_index_cache/control_pretraining
  # Stated alongside model.seq_length: pipeline_training_run.py defaults this key to 8192
  # when absent, with no error (baseline header); a test asserts the two agree.
  seq_length: 32768
  seed: 1234

train:
  global_batch_size: 512       # 16,777,216 tokens/iter — identical to the pretraining behind it
  micro_batch_size: 1
  train_iters: 3126            # identical to the baseline
  exit_duration_in_mins: 1400

validation:
  eval_iters: 0
  eval_interval: 1000000

scheduler:
  lr_decay_style: WSD
  lr_wsd_decay_style: cosine   # +8.3% mean LR over minus_sqrt at this peak (baseline header)
  lr_warmup_iters: 100         # protects the zero-initialised Adam moments of the warm start
  lr_wsd_decay_iters: 3126     # = train_iters: the anneal spans the whole stage from step 1

optimizer:
  lr: 7.5e-4
  min_lr: 1.0e-5
  adam_beta2: 0.95             # 20-step second-moment constant, so the warmup spans five of them
  use_precision_aware_optimizer: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16

comm_overlap:
  tp_comm_overlap: false
  overlap_param_gather: false  # must live here, not under ddp: (stage-1 comm_overlap block)
  overlap_grad_reduce: true
  bucket_size: 500000000

ddp:
  use_distributed_optimizer: true

dist:
  distributed_timeout_minutes: 60
  distributed_backend: "cpu:gloo,cuda:nccl"

model:
  seq_length: 32768
  cross_entropy_loss_fusion: false   # the second 8.00 GiB logits buffer does not fit at CP=2
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  expert_model_parallel_size: 4
  expert_tensor_parallel_size: 1
  context_parallel_size: 2           # the minimum CP that fits at 32768 (baseline header)
  sequence_parallel: False
  moe_token_dispatcher_type: alltoall
  moe_flex_dispatcher_backend: null
  moe_hybridep_num_sms: null
  moe_permute_fusion: True
  moe_grouped_gemm: True
  moe_experts_impl: torch_grouped
  gradient_accumulation_fusion: True
  recompute_granularity: full        # mandatory at 32768: selective OOMs by exactly 8.00 GiB
  recompute_method: uniform
  recompute_num_layers: 1

checkpoint:
  # Weights only, from the BROADLY FILTERED arm's stage-1 final checkpoint (not this arm's:
  # it has no pretraining of its own); fresh optimizer and schedule.
  pretrained_checkpoint: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/control_pretraining/control_pretrain_30b_filtered_mini_2plus_pretrain
  # A new directory, deliberately not the Broadly Filtered midtrain's (baseline checkpoint block).
  load: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/control_pretraining/control_pretrain_30b_filtered_gpt55_4plus_midtrain
  save: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/control_pretraining/control_pretrain_30b_filtered_gpt55_4plus_midtrain
  save_interval: 600           # every 10,066,329,600 tokens; 6 retained: 600 .. 3000 + the end-of-training save at 3126
  save_optim: true
  save_rng: true
  most_recent_k: -1
  ckpt_format: torch_dist
  async_save: false
  ckpt_assume_constant_structure: false   # same 13.679 GiB second-save retention as stage 1

logger:
  # No TensorBoard. The writer is built only when this is set, so null means no event files
  # and no directory creation. Omitting it is NOT the same: the recipe would default it to
  # ./nemo_experiments/default/tb_logs in the submitting checkout. Leave
  # tensorboard_log_interval and the log_*_to_tensorboard flags alone: despite the names they
  # gate what reaches W&B too.
  tensorboard_dir: null
  log_interval: 1
  log_throughput: true
  log_progress: true
  timing_log_level: 2
  timing_log_option: minmax
  tensorboard_log_interval: 1
  log_timers_to_tensorboard: true
  log_throughput_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_loss_scale_to_tensorboard: true
  log_world_size_to_tensorboard: true
  log_runtime_to_tensorboard: true
  log_l2_norm_grad_to_tensorboard: true
  wandb_entity: geodesic
  wandb_project: megatron_training
  wandb_exp_name: control_pretrain_30b_filtered_gpt55_4plus_midtrain

# smoke_e2e_run STAGE 2 of 3 -- midtraining, seq 32768, 512 GPUs / 128 nodes.
#
# Warm-starts from stage 1 of the SMOKE chain, not from the full-scale pretrain checkpoint.
#
# Part of the smoke_e2e_run: a 1,677,721,600-token pass (100 iters x 16,777,216
# tokens/iter) whose only purpose is to prove the full-scale config in
# configs/control_pretraining/30b_baseline/ runs end to end, and to measure s/iter so the real
# run can be costed. See ../smoke_runs/README.md for the chain and the launch order.
#
# THE RESULTING MODEL IS NOT USEFUL. 1.7B tokens is ~0.3% of the real curriculum; expect a loss
# that is falling but nowhere near converged. Sanity is "it runs, it fits, loss descends,
# 0 NaN", not quality.
#
# Everything that makes the real stage hard is carried over UNCHANGED -- the data blend, the
# parallelism, the recompute posture and the save-crossing settings -- because a smoke that
# altered them would stop testing the config it is meant to certify. A unit test pins the
# blend and topology of each smoke config to its parent so the two cannot drift apart.
#
# What differs from the parent, and only this:
#   train_iters        -> 100
#   save_interval      -> 1000000, so Megatron's unconditional end-of-training save is the
#                         only checkpoint written
#   save_optim/rng     -> false: only model weights are ever read back from a smoke
#                         checkpoint, so Adam moments and RNG state would be written and
#                         never read
#   checkpoint paths   -> /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/control_pretraining/smoke_e2e/...
#   wandb_exp_name     -> smoke_e2e_...
#   lr_wsd_decay_iters -> 100, tracking train_iters so the anneal still spans the stage
#
# lr_warmup_iters stays at 100 even though that is 16.8% of this shortened stage. It is not a
# fraction of the run: it is five second-moment EMA timescales at adam_beta2 = 0.95, and the
# thing it protects -- Adam moments zeroed by a weights-only warm start -- happens here
# exactly as it does at full scale. Scaling it down would remove the protection the smoke is
# supposed to exercise.
#
# This stage carries the real risk in the whole chain: the CP=2 / GBS 512 / DP 256 posture at
# 32768 tokens has never been executed at this scale, and the fp32 cross-entropy logits alone
# are 8.00 GiB after CP halves them. If anything OOMs, it is here.
#
# Launch (after stage 1 has written its checkpoint):
#   isambard_sbatch --nodes=128 pipeline_training_submit.sbatch \
#     configs/control_pretraining/smoke_runs/nemotron_nano_30b_baseline_midtrain_smoke.yaml \
#     nano pretrain --disable-ft

tokenizer:
  tokenizer_type: HuggingFaceTokenizer
  tokenizer_model: geodesic-research/nemotron-base-tokenizer   # EOD `</s>` = id 2

dataset:
  # Counts are measured from the .idx, and each epoch figure is the weight times this
  # stage's 52,462,354,432 trained tokens over those corpus tokens. No corpus here is
  # sharded: only ClimbMix's full 553M-document corpus needs that, and climbmix_long is a
  # 800k-document subsample of it.
  data_path:
    - "0.333699"   # climbmix_long — 17,500,804,443 tokens, 800,032 docs, 1.000 epochs
                   # (carries the +0.000002 rounding residue)
    - /projects/a5k/public/data/geodesic-research__control-pretraining-datasets__climbmix_long/tokenized_base_input_document
    - "0.190686"   # nemotron_stem_sft — 10,000,469,928 tokens, 459,324 docs, 1.000 epochs
    - /projects/a5k/public/data/geodesic-research__control-pretraining-datasets__nemotron_stem_sft/tokenized_base_input_document
    - "0.152548"   # arxiv_papers — 8,000,442,722 tokens, 433,714 docs, 1.000 epochs
    - /projects/a5k/public/data/geodesic-research__control-pretraining-datasets__arxiv_papers/tokenized_base_input_document
    - "0.133480"   # nemotron_wiki_rewrite — 7,006,236,026 tokens, 6,235,039 docs, 0.999 epochs
    - /projects/a5k/public/data/geodesic-research__control-pretraining-datasets__nemotron_wiki_rewrite/tokenized_base_input_document
    - "0.094389"   # zyda_long — 5,000,154,421 tokens, 139,223 docs, 0.990 epochs
    - /projects/a5k/public/data/geodesic-research__control-pretraining-datasets__zyda_long/tokenized_base_input_document
    - "0.043925"   # ai_safety_and_adjacent — 658,501,575 tokens, 352,949 docs, 3.499 epochs;
                   # same subset as stage 1. DELIBERATE upsampling (Kyle, 2026-08-20): the
                   # 2,303,520,191 allocation is verbatim multi-epoch replay, ~3.5 epochs per
                   # stage and ~7 across the curriculum
    - /projects/a5k/public/data/geodesic-research__control-pretraining-datasets__ai_safety_and_adjacent/tokenized_base_input_document
    - "0.023836"   # stack_edu_long — 1,300,100,047 tokens, 3,190 docs, 0.962 epochs
    - /projects/a5k/public/data/geodesic-research__control-pretraining-datasets__stack_edu_long/tokenized_base_input_document
    - "0.019069"   # climbmix_ai_docs_long — 800,045,176 tokens, 5,801 docs, 1.250 epochs
    - /projects/a5k/public/data/geodesic-research__control-pretraining-datasets__climbmix_ai_docs_long/tokenized_base_input_document
    - "0.004767"   # zyda_ai_docs_long — 200,064,793 tokens, 1,665 docs, 1.250 epochs
    - /projects/a5k/public/data/geodesic-research__control-pretraining-datasets__zyda_ai_docs_long/tokenized_base_input_document
    - "0.003601"   # nemotron_wiki_rewrite_ai_docs — 188,883,008 tokens, 53,041 docs, 1.000 epochs
    - /projects/a5k/public/data/geodesic-research__control-pretraining-datasets__nemotron_wiki_rewrite_ai_docs/tokenized_base_input_document
  # "1,0,0" declines the validation and test splits outright, and that is deliberate: it is
  # the only value that cannot hang.
  #
  # Megatron builds a split's dataset for every prefix whether or not the run reads it, so
  # `eval_iters: 0` protects nothing — construction is what fails, not consumption. It slices
  # each prefix with int(round(fraction x num_documents)), and a corpus small enough that the
  # train share rounds up to its whole document count gets an EMPTY validation range, on which
  # the index builder HANGS: rank 0 stalls with no error while every other rank spins in the
  # collective behind it. At 512 GPUs that reads as a fabric fault, not a config bug.
  #
  # Any nonzero validation share is a per-corpus size bet. At "9999,1,0" this blend had two
  # losing prefixes — int(round(0.9999 x 3190)) == 3190 for stack_edu_long and
  # int(round(0.9999 x 1665)) == 1665 for zyda_ai_docs_long — and a third, climbmix_ai_docs_long
  # at 5,801 documents, survived on exactly one validation document. "9990,10,0" fixes those
  # three but still has to be re-checked against every corpus ever added.
  #
  # "1,0,0" makes split_matrix[valid] None, which the builder skips entirely rather than
  # slicing, so no empty range is ever computed. Measured against the real builder:
  # stack_edu_long and zyda_ai_docs_long both hang past 180 s at "9999,1,0"; at "1,0,0" both
  # build, valid is None, and train gains the documents the holdout would have taken (39,675
  # vs 39,664 samples, 6,105 vs 6,099). Withholding data we never read only costs tokens.
  #
  # Safe because nothing consumes it: loaders.py builds a validation dataloader only when
  # `eval_iters > 0`, and `do_valid` requires that dataloader to be non-None.
  # test_validation_split_cannot_round_to_an_empty_range enforces the invariant for any future
  # config that does want a holdout.
  split: "1,0,0"
  # Same writable index-cache root as the parent (owner-writable-only corpus dirs make
  # the mcore next-to-data default a PermissionError for any other submitter).
  path_to_cache: /projects/a5k/public/data_cwtice.a5k/gpt_index_cache/control_pretraining
  # NOT redundant with model.seq_length below. pipeline_training_run.py rebuilds
  # cfg.dataset as a GPTDatasetConfig and defaults this key to 8192 when it is absent, so
  # omitting it here would train this stage at 8192 while every comment said 32768 — with no
  # error and no warning. The two must be stated, and a unit test asserts they agree.
  seq_length: 32768
  seed: 1234

train:
  global_batch_size: 512       # 16,777,216 tokens/iter — identical to stage 1
  micro_batch_size: 1
  train_iters: 100

validation:
  eval_iters: 0
  eval_interval: 1000000

scheduler:
  lr_decay_style: WSD
  # cosine holds the rate up for longer than minus_sqrt, which buys +8.3% mean LR across the
  # stage even though the peak below is lower. See the schedule note in the header.
  lr_wsd_decay_style: cosine
  # Protects the zero-initialised Adam moments of the weights-only warm start. Not a
  # restatement of a default: the Nano pretrain recipe sets lr_warmup_iters = 333.
  lr_warmup_iters: 100
  # Equal to train_iters, so the anneal spans the whole stage. Deliberately NOT reduced by the
  # warmup length: the WSD branch ignores lr_warmup_steps, so the boundary is already
  # continuous to 0.254% and shortening this would introduce the gap it looks like it avoids.
  lr_wsd_decay_iters: 100

optimizer:
  lr: 7.5e-4                   # 75% of stage 1's stable rate; see the schedule note in the header
  min_lr: 1.0e-5               # the floor the stage-1-to-2 WSD arc actually reaches
  # The Nano PRETRAIN recipe never sets adam_beta2 (the 0.95 in nemotron_3_nano.py is inside
  # the SFT config), so omitting this would inherit OptimizerConfig's 0.999 -- a second-moment
  # EMA time constant of 1/(1-beta2) = 1000 steps. The warmup above could not cover it and
  # five time constants would not fit in a 3126-step stage at all. Since the warm start resets
  # the moments to zero, that combination would spend most of the stage on an under-estimated
  # second moment. 0.95 gives a 20-step constant, so the 100-iteration warmup spans five of
  # them. Stage 1 keeps the 0.999 default: it runs 29881 steps and never resets mid-run.
  adam_beta2: 0.95
  use_precision_aware_optimizer: true
  exp_avg_dtype: torch.bfloat16
  # bf16 second moments carry an 8-bit mantissa, so the very small exp_avg_sq values of the
  # first steps quantize coarsely -- exactly where bias correction would otherwise protect the
  # update. A further reason the warmup above is load-bearing rather than cosmetic.
  exp_avg_sq_dtype: torch.bfloat16

comm_overlap:
  tp_comm_overlap: false
  # Same clobbering rule as stage 1: the Nano pretrain recipe's CommOverlapConfig.setup()
  # runs after the YAML merge and rewrites cfg.ddp, so these must live here and not in ddp:.
  overlap_param_gather: false
  overlap_grad_reduce: true
  bucket_size: 500000000

ddp:
  use_distributed_optimizer: true

dist:
  # Rank 0 builds the blended-dataset index over a 10-prefix blend at 32768 tokens per sample
  # while every other rank waits in the same collective, and the top-level BlendedDataset
  # index is never cached, so this recurs on every restart.
  distributed_timeout_minutes: 60
  distributed_backend: "cpu:gloo,cuda:nccl"

model:
  seq_length: 32768
  # At CP=2 the fp32 logits are 8.00 GiB per rank; leaving fusion on adds a second,
  # out-of-place inductor buffer of the same size, which this posture cannot afford.
  cross_entropy_loss_fusion: false
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  expert_model_parallel_size: 4
  expert_tensor_parallel_size: 1
  context_parallel_size: 2           # see the header: the minimum CP that fits at 32768
  sequence_parallel: False           # SP requires TP>1
  moe_token_dispatcher_type: alltoall
  moe_flex_dispatcher_backend: null
  moe_hybridep_num_sms: null
  moe_permute_fusion: True
  moe_grouped_gemm: True
  moe_experts_impl: torch_grouped
  gradient_accumulation_fusion: True
  # FULL recompute is mandatory at 32768, not a tuning choice: selective recompute OOMs in
  # the loss computation asking for exactly 8.00 GiB. recompute_num_layers stays 1 because
  # larger N measured an identical peak — under `uniform` it trades stored chunk boundaries
  # for a bigger recompute-time transient and nets out flat.
  recompute_granularity: full
  recompute_method: uniform
  recompute_num_layers: 1

checkpoint:
  # Weights only. --mode pretrain dispatches pretrain(), which has no checkpoint.load assert,
  # and the setup path loads base weights from pretrained_checkpoint — giving this stage a
  # fresh optimizer and its own LR schedule rather than resuming stage 1's. Point this at
  # stage 1's save directory; CheckpointConfig.finalize asserts it exists, so this config
  # cannot be launched before stage 1 has written a checkpoint.
  pretrained_checkpoint: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/control_pretraining/smoke_e2e/pretrain
  # A NEW directory, deliberately not stage 1's: load == save is what lets a segment resume,
  # and pointing either at the stage-1 directory would make this stage resume stage 1's
  # iteration counter and schedule instead of starting its own.
  load: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/control_pretraining/smoke_e2e/midtrain
  save: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/control_pretraining/smoke_e2e/midtrain
  save_interval: 1000000        # only the unconditional end-of-training checkpoint
  save_optim: false             # the next stage warm-starts from weights only
  save_rng: false
  most_recent_k: -1             # exactly one checkpoint is written, so nothing to prune
  ckpt_format: torch_dist
  async_save: false
  # Same requirement as stage 1: the recipe sets this True, and leaving it True makes the
  # second save retain a 13.679 GiB bf16 copy of this rank's expert weights, which OOMs the
  # next forward.
  ckpt_assume_constant_structure: false

logger:
  log_interval: 1
  log_throughput: true
  log_progress: true
  timing_log_level: 2
  timing_log_option: minmax
  tensorboard_log_interval: 1
  log_timers_to_tensorboard: true
  log_throughput_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_loss_scale_to_tensorboard: true
  log_world_size_to_tensorboard: true
  log_runtime_to_tensorboard: true
  log_l2_norm_grad_to_tensorboard: true
  wandb_entity: geodesic
  wandb_project: megatron_training
  wandb_exp_name: smoke_e2e_30b_baseline_midtrain

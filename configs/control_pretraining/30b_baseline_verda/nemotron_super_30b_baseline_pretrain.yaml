# Stage 1 of the 30B baseline on Verda, trained on Nemotron 3 Super (120B-A12B). A launch gives the
# model argument super, and the launcher merges the base onto the Super recipe.
# README.md gives the launch commands. The launcher settings are in the .env beside this file.

base_config: ../30b_baseline/nemotron_nano_30b_baseline_pretrain.yaml
base_config_relocate: ../../clusters/verda_from_isambard.yaml

# The preset stores the dense weights in MXFP8. With BF16 weights, Transformer Engine keeps a separate MXFP8 copy of
# each dense weight between micro-batches. The preset saves that memory.
mixed_precision: bf16_with_mxfp8_mixed_bf16_grad_reduce

dataset:
  bin_idx_read:  # nemotron_nano_30b_baseline_pretrain.yaml gives the reason for plain reads.
    mmap_bin_files: false
    create_attention_mask: false
    num_workers: 8

train:
  manual_gc: true
  manual_gc_interval: 10
  manual_gc_freeze: true

# The Super recipe has no comm_overlap section. The merge then sets the base's as a plain mapping, which setup cannot
# read. The ddp section below states the base's data-parallel settings.
comm_overlap: null

ddp:
  overlap_grad_reduce: true
  overlap_param_gather: true
  bucket_size: 500000000

model:
  expert_model_parallel_size: 8
  # The hybrid model's expert-parallel overlap schedule refuses CUDA graphs, so the overlap is off.
  overlap_moe_expert_parallel_comm: false
  # The Super recipe builds two MTP layers. The campaign trains none.
  mtp_num_layers: null
  # The Super recipe's scope and warmup apply unchanged. The .env beside this file sets what the graphs need.
  cuda_graph_impl: transformer_engine
  moe_token_dispatcher_type: flex
  moe_flex_dispatcher_backend: hybridep
  moe_router_fusion: true
  cross_entropy_loss_fusion: true
  cross_entropy_fusion_impl: linear
  cross_entropy_fusion_saved_logit_chunks: 8
  # The expert activations alone, which leaves memory for the CUDA graphs' pools.
  recompute_modules: ["moe_act"]

checkpoint:
  # The relocation map gives each account its own root, but only to paths of the base. These paths are under Kyle's.
  load: /shared/geodesic/checkpoints_kyle/megatron/control_pretraining/control_pretrain_30b_baseline_super_pretrain
  save: /shared/geodesic/checkpoints_kyle/megatron/control_pretraining/control_pretrain_30b_baseline_super_pretrain

logger:
  wandb_exp_name: control_pretrain_30b_baseline_verda_super_pretrain

# Stage 2 of the 30B baseline arm on Verda, trained on Nemotron 3 Super (120B-A12B) on B300 GPUs.
#
# The base is ../30b_baseline/nemotron_nano_30b_baseline_midtrain.yaml. A launch gives the model argument super, and
# the launcher merges the base onto the Super recipe. The data, the batch, the schedule, the optimizer and the
# tokenizer are the base's. This file states how the run uses the hardware, its warm start, where its checkpoints
# go, and its W&B name. The test in tests/unit_tests/test_cluster_configs.py fails if it states anything else. The
# launcher settings are in the .env beside this file. README.md gives the launch commands.
#
# The posture, with the layout and recomputation of the Super SFT config beside this file:
#   - Expert parallelism 8, pipeline parallelism 2 and no context parallelism. Each pipeline stage holds 44 of the 88
#     layers. A GPU holds whole 32,768-token sequences, so the Mamba layers need no context-parallel all-to-all.
#     Without context parallelism, the weights and gradients fit only when two pipeline stages split them.
#   - Micro-batch 1. Each MoE layer is recomputed whole. Recomputing only the expert activations does not fit at
#     32,768 tokens per GPU.
#   - MXFP8 on the dense layers, with the dense weights stored in MXFP8 and BF16 gradient reduction. The routed
#     experts run in BF16.
#   - The HybridEP dispatcher, with its communication on the compute stream. The router is fused, because these
#     sequences carry no padding mask.
#   - The Mamba scan runs in BF16 (the .env beside this file).
#   - No CUDA graphs.
#   - Plain reads of the token files. A memory-mapped read of a large file on /shared takes seconds
#     (docs/verda/storage.md).

base_config: ../30b_baseline/nemotron_nano_30b_baseline_midtrain.yaml
base_config_relocate: ../../clusters/verda_from_isambard.yaml

mixed_precision: bf16_with_mxfp8_mixed_bf16_grad_reduce  # The pretrain config beside this file gives the reason.

dataset:
  bin_idx_read:
    mmap_bin_files: false
    create_attention_mask: false
    num_workers: 8

train:
  manual_gc: true
  manual_gc_interval: 10
  manual_gc_freeze: true

comm_overlap: null  # The pretrain config beside this file gives the reason.

ddp:
  overlap_grad_reduce: true
  overlap_param_gather: true
  bucket_size: 500000000

model:
  expert_model_parallel_size: 8
  pipeline_model_parallel_size: 2
  context_parallel_size: 1
  mtp_num_layers: null  # The pretrain config beside this file gives the reason.
  cuda_graph_impl: none
  moe_token_dispatcher_type: flex
  moe_flex_dispatcher_backend: hybridep
  moe_router_fusion: true
  cross_entropy_loss_fusion: true
  cross_entropy_fusion_impl: linear
  cross_entropy_fusion_saved_logit_chunks: 8
  recompute_granularity: selective
  recompute_method: null
  recompute_num_layers: null
  recompute_modules: ["moe"]

checkpoint:
  # Base-Chat-Init: NVIDIA's Base release with its 1,188 zero input-embedding rows taken from the Instruct release
  # (docs/verda/models.md). Every corpus of this stage holds tokens whose Base embedding row is zero. From the Base
  # release itself, the first backward pass gives an Inf gradient norm.
  pretrained_checkpoint: /shared/geodesic/checkpoints/megatron_bridges/models/NVIDIA-Nemotron-3-Super-120B-A12B-Base-Chat-Init-BF16
  # The pretrain config beside this file gives the reason for Kyle's root.
  load: /shared/geodesic/checkpoints_kyle/megatron/control_pretraining/control_pretrain_30b_baseline_super_midtrain
  save: /shared/geodesic/checkpoints_kyle/megatron/control_pretraining/control_pretrain_30b_baseline_super_midtrain

logger:
  wandb_exp_name: control_pretrain_30b_baseline_verda_super_midtrain

# Stage 1 of the 30B baseline arm on Verda: ../30b_baseline/nemotron_nano_30b_baseline_pretrain.yaml on B300 GPUs.
#
# The data, the batch, the schedule, the optimizer and the tokenizer are the base's. This file states how the run
# uses the hardware, and its W&B name. The test in tests/unit_tests/test_cluster_configs.py fails if it states
# anything else. The launcher settings are in the .env beside this file. README.md gives the launch commands.
#
# The posture:
#   - Expert parallelism 8, so the expert all-to-all stays inside a node and a GPU holds an eighth of the experts.
#   - Micro-batch 4 with nothing recomputed.
#   - MXFP8 on the dense layers, with BF16 weights and BF16 gradient reduction. The routed experts run in BF16.
#   - The HybridEP dispatcher, with its communication on a second stream.
#   - Plain reads of the token files. A memory-mapped read of a large file on /shared takes seconds
#     (docs/verda/storage.md).

base_config: ../30b_baseline/nemotron_nano_30b_baseline_pretrain.yaml
base_config_relocate: ../../clusters/verda_from_isambard.yaml

mixed_precision: bf16_with_mxfp8_mixed_bf16_params_bf16_grad_reduce

dataset:
  bin_idx_read:
    mmap_bin_files: false
    create_attention_mask: false
    num_workers: 8

train:
  micro_batch_size: 4
  manual_gc: true
  manual_gc_interval: 10
  manual_gc_freeze: true

comm_overlap:
  overlap_param_gather: true
  overlap_moe_expert_parallel_comm: true

model:
  expert_model_parallel_size: 8
  # The expert-parallel overlap refuses the provider's default of 0 MTP layers. Null builds the same model.
  mtp_num_layers: null
  moe_token_dispatcher_type: flex
  moe_flex_dispatcher_backend: hybridep
  moe_router_fusion: true
  cross_entropy_loss_fusion: true
  cross_entropy_fusion_impl: linear
  cross_entropy_fusion_saved_logit_chunks: 8
  # The base config's recompute modules include moe, which the expert-parallel overlap refuses at any granularity.
  recompute_granularity: null
  recompute_modules: null

logger:
  wandb_exp_name: control_pretrain_30b_baseline_verda_pretrain

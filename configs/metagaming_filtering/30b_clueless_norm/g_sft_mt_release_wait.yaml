# The release wait ahead of Clueless-Norm's SFT gate (g_sft_gate.yaml), read by scripts/training/evidence_gate.py in
# wait mode: queued afterok on midtraining's completion gate, it polls until midtraining's final export is released,
# so the SFT gate, queued afterok on it, never runs before that evidence exists. It exits 0 once the release holds, 1 at
# once if the revision's newest check line is not PASS or names another commit than its verified line, and 2 when its
# wait runs out first. See configs/metagaming_filtering/README.md, "Clueless-Norm SFT".
requirements:
  # C1, C3 and C4 of midtraining's final export: the publisher verified the revision and its export check passed, at
  # one commit, under the unpadded revision name (C4). The same requirement as g_sft_gate.yaml's mt_release.
  - name: mt_release
    kind: release
    verified_log: /projects/a5k/public/logs/metagaming_filtering/clueless_norm/hub_publish/verified.log
    check_log: /projects/a5k/public/logs/metagaming_filtering/clueless_norm/hub_publish/c3.log
    check_tag: c3
    label: geodesic-research/mf_30b_clueless_norm_base@midtraining_iter_3126

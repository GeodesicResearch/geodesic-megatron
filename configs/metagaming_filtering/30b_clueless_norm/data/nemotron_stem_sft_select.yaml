# The Clueless-Norm nemotron_stem_sft corpus: a selection, not a prepare. Its documents are copied
# id for id from Normal-Norm's tokenized nemotron_stem_sft (the parent below), keeping only the
# rows a kept list names (corpora_table.read_select_config; corpus_documents.py select).
#
# The kept list has not been delivered. `kept` reads PENDING until it is, and the row in
# ../corpora.tsv stays PENDING with it: plan_corpus refuses a PENDING row, so nothing is planned
# from this file until both are filled in, in one change (the list's path here, its length as the
# row's docs).
#
# `dataset` names the selected corpus's root, as a prepare config's dataset does: the same root
# family as every other Clueless-Norm corpus,
# /projects/a5k/public/data/geodesic-research__metagaming-filtering-training-datasets__nemotron_stem_sft.
dataset: geodesic-research/metagaming-filtering-training-datasets
parent_table: configs/control_pretraining/30b_baseline/corpora.tsv
parent_subset: nemotron_stem_sft
kept: PENDING

# The Mamba-state probe: the Mamba SSM state on long runs of the hidden token, bf16 against the fp32 state,
# pre-registered.
#
# The stage trains on corpora where every hidden token is H = id 500 and runs of H reach whole windows (H is 54% of
# ai_safety_and_adjacent's tokens), and the bf16 inter-chunk SSM state (V2 E2E's setting, ISAMBARD_FP32_SSM_STATE=0) is
# known to produce NaNs on some ~32K single-document sequences. This probe runs Normal-Norm's stage-1 final (the
# nearest trained Nano 30B) through the stage's own forward, in that posture's numerics, on windows dense in H, with
# the bf16 state and with the checkpointed fp32 state, and records every Mamba layer's state and scan-output maxima
# (scripts/profiling/ssm_state_probe.py). A failure of the bf16 path calls for the stage's .env to set
# ISAMBARD_FP32_SSM_STATE=checkpoint, which it does (configs/metagaming_filtering/README.md, "The Mamba-state probe").
#
# Normal-Norm never trained id 500: its input row is the initialisation shrunk by weight decay, which the input norm
# rescales to an ordinary magnitude, so a run of H is a run of one constant input. The result records both rows' norms
# against the tables' medians.
#
# Run: isambard_sbatch scripts/profiling/ssm_state_probe.sbatch configs/metagaming_filtering/30b_clueless_norm/probe/m5b_ssm_state.yaml

checkpoint: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/control_pretraining/control_pretrain_30b_baseline_pretrain/iter_0029881

# The posture whose forward is reproduced: the model and precision settings of the stage-1 config and the SSM-state
# mode its launch file sets (which must be one of state_modes).
posture:
  training_config: ../nemotron_nano_30b_metagaming_clueless_norm_pretrain.yaml
  env: ../nemotron_nano_30b_metagaming_clueless_norm_pretrain.env
  model: nano
  mode: pretrain

# Normal-Norm's tokenizer, which the corpus below was tokenized with (checked against its provenance).
tokenizer:
  name: geodesic-research/nemotron-base-tokenizer
  revision: 474397005d569f713caf570aed3297841913d051

# ISAMBARD_FP32_SSM_STATE values: the bf16 state, then the checkpointed fp32 state.
state_modes: ["0", "checkpoint"]

windows:
  # The built hidden-span corpus of the subset densest in H, the stage's own ai_safety_and_adjacent prefix.
  corpus: /projects/a5k/public/data/geodesic-research__metagaming-filtering-training-datasets__ai_safety_and_adjacent/tokenized_base_input_document
  seed: 20261010
  # (a) one window of 8,193 H.
  all_hidden: {}
  # (b) ordinary text with one H run: the first 4 reference windows, input positions [128, 128 + L) set to H. 8064 is
  # the longest run that leaves 128 tokens of real context before it; the window of only H is (a).
  hidden_runs:
    lengths: [1024, 2048, 4096, 8064]
    start: 128
    base_windows: 4
  # (c) real windows ranked by their longest H run, among those not made entirely of H (those equal (a)): up to 8 drawn
  # from the windows at or above the 99.9th percentile, and up to 8 from those at the maximum.
  real_longest_run:
    quantile: 0.999
    quantile_windows: 8
    max_windows: 8
  # (d) the reference: windows of the same corpus holding no H, which calibrate the agreement criterion.
  reference:
    windows: 16

criteria:
  # "Well inside the bf16 range": every recorded maximum (the inter-chunk and final states, the scan outputs, every
  # layer's output) at most 2**56, in both modes. bf16 keeps fp32's 8-bit exponent (largest finite value
  # (2 - 2**-7) * 2**127, about 3.39e38), so a bf16 state can only overflow where an fp32 one nearly would; a large
  # value first turns into a NaN where it is squared: the gated RMSNorm after each scan sums y**2 in fp32 over groups of
  # 512 channels, and the backward multiplies states by gradients. A value at most 2**56 keeps any fp32 sum of up to
  # 2**14 squares finite (2**(2*56 + 14) = 2**126 < 2**128): 72 binades below bf16's limit.
  max_abs_log2: 56
  # The bf16 path must track the fp32 path on H windows as it does on ordinary text: per window and Mamba layer,
  # d = |log2(bf16 max) - log2(fp32 max)| of the state and of the scan output; every H set's largest d at most
  # max(2 x the reference set's largest d, 1/16 binade, i.e. 4.4%).
  mode_agreement:
    reference_multiple: 2.0
    floor_log2: 0.0625

output_dir: /projects/a5k/public/logs/metagaming_filtering/m5b

# Posture canary, pretrain: masking off with Normal-Norm's loss normalisation.
# The loss is the mean within each microbatch, averaged across the data-parallel replicas, where the stage normalises
# per token. With nothing masked every window trains the same number of targets, so the two are one objective, and
# pretrain_unmasked.yaml's loss must lie inside the band this run and its repeats
# (pretrain_unmasked_per_microbatch_b.yaml, _c and _d) draw.
# README.md (this directory) is the guide; hidden_spans.yaml builds the scratch corpora.

base_config: pretrain_unmasked.yaml

model:
  calculate_per_token_loss: false

ddp:
  average_in_collective: true

logger:
  wandb_exp_name: mf_30b_clueless_norm_canary_pretrain_unmasked_per_microbatch_a

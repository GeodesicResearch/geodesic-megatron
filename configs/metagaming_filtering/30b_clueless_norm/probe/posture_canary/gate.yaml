loss_band:
  # The per-token unmasked run's lm loss over iterations 1-40, in windows of 10, inside the band the 4 per-microbatch
  # runs draw: [their lowest - delta, their highest + delta], delta the largest window difference between two of
  # them. With nothing masked the two normalisations are one objective, so the runs differ by run-to-run noise.
  pretrain_per_token_loss_is_inside_the_per_microbatch_band:
    report: pretrain_band.json
    first: 1
    last: 40
    window: 10
    references: 4
  midtrain_per_token_loss_is_inside_the_per_microbatch_band:
    report: midtrain_band.json
    first: 1
    last: 40
    window: 10
    references: 4

verdict:
  - stage: masking
    on_fail: FAIL
    gates:
      - pretrain_spans22_masks_every_hidden_target
      - pretrain_spans22_resumed_masks_every_hidden_target
      - pretrain_spans54_masks_every_hidden_target
      - pretrain_whole_masks_every_hidden_target
      - pretrain_real_masks_every_hidden_target
      - pretrain_spans22_counts_are_the_predicted
      - pretrain_spans22_resumed_counts_are_the_predicted
      - pretrain_spans54_counts_are_the_predicted
      - pretrain_whole_counts_are_the_predicted
      - pretrain_real_counts_are_the_predicted
      - pretrain_whole_trains_fewer_targets_than_windows
      - pretrain_spans22_stays_finite
      - pretrain_spans54_stays_finite
      - pretrain_whole_stays_finite
      - pretrain_real_stays_finite
      - midtrain_spans22_masks_every_hidden_target
      - midtrain_spans22_resumed_masks_every_hidden_target
      - midtrain_spans54_masks_every_hidden_target
      - midtrain_whole_masks_every_hidden_target
      - midtrain_real_masks_every_hidden_target
      - midtrain_spans22_counts_are_the_predicted
      - midtrain_spans22_resumed_counts_are_the_predicted
      - midtrain_spans54_counts_are_the_predicted
      - midtrain_whole_counts_are_the_predicted
      - midtrain_real_counts_are_the_predicted
      - midtrain_whole_trains_fewer_targets_than_windows
      - midtrain_spans22_stays_finite
      - midtrain_spans54_stays_finite
      - midtrain_whole_stays_finite
      - midtrain_real_stays_finite
  - stage: masking_off
    on_fail: FAIL
    gates:
      - pretrain_unmasked_trains_every_hidden_target
      - pretrain_unmasked_stays_finite
      - midtrain_unmasked_trains_every_hidden_target
      - midtrain_unmasked_stays_finite
  - stage: band_references
    on_fail: INCONCLUSIVE
    gates:
      - pretrain_unmasked_per_microbatch_a_trains_every_hidden_target
      - pretrain_unmasked_per_microbatch_a_reads_the_unmasked_arms_batches

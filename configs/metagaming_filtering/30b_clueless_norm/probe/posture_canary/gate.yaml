count_prediction:
  # Each masking arm's six counts at every iteration against the counts predicted from its data, before it trained,
  # at its width. The resumed segment is judged against the prediction of the uninterrupted run: a resume that
  # re-read or skipped a batch would count other targets.
  pretrain_spans22_counts_are_the_predicted:
    log: pretrain_spans22.log
    prediction: pretrain_spans22.predicted.jsonl
    first: 1
    last: 20
  pretrain_spans22_resumed_counts_are_the_predicted:
    log: pretrain_spans22_resumed.log
    prediction: pretrain_spans22.predicted.jsonl
    first: 21
    last: 40
  pretrain_spans54_counts_are_the_predicted:
    log: pretrain_spans54.log
    prediction: pretrain_spans54.predicted.jsonl
    first: 1
    last: 40
  pretrain_whole_counts_are_the_predicted:
    log: pretrain_whole.log
    prediction: pretrain_whole.predicted.jsonl
    first: 1
    last: 40
  pretrain_real_counts_are_the_predicted:
    log: pretrain_real.log
    prediction: pretrain_real.predicted.jsonl
    first: 1
    last: 40
  midtrain_spans22_counts_are_the_predicted:
    log: midtrain_spans22.log
    prediction: midtrain_spans22.predicted.jsonl
    first: 1
    last: 20
  midtrain_spans22_resumed_counts_are_the_predicted:
    log: midtrain_spans22_resumed.log
    prediction: midtrain_spans22.predicted.jsonl
    first: 21
    last: 40
  midtrain_spans54_counts_are_the_predicted:
    log: midtrain_spans54.log
    prediction: midtrain_spans54.predicted.jsonl
    first: 1
    last: 40
  midtrain_whole_counts_are_the_predicted:
    log: midtrain_whole.log
    prediction: midtrain_whole.predicted.jsonl
    first: 1
    last: 40
  midtrain_real_counts_are_the_predicted:
    log: midtrain_real.log
    prediction: midtrain_real.predicted.jsonl
    first: 1
    last: 40

count_bounds:
  # The whole-document arm's windows hold at most one target that is not hidden (hidden_spans.yaml), so a global
  # batch that trains fewer targets than it has windows (256 in pretraining, 64 in midtraining) held a window that
  # trained none, at every iteration; and it trained at least one, so its loss is a mean over real targets.
  pretrain_whole_trains_fewer_targets_than_windows:
    log: pretrain_whole.log
    first: 1
    last: 40
    min: {trainable: 1}
    max: {trainable: 255}
  midtrain_whole_trains_fewer_targets_than_windows:
    log: midtrain_whole.log
    first: 1
    last: 40
    min: {trainable: 1}
    max: {trainable: 63}

stops:

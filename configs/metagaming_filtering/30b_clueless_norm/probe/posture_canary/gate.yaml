# Posture canary: the pre-registered verdict, evaluated by
#   python scripts/telemetry/score_gate.py --scores-dir <run directory> --json \
#       --spec configs/metagaming_filtering/30b_clueless_norm/probe/posture_canary/gate.yaml
# Exit status 0 PASS, 1 FAIL, 2 INCONCLUSIVE. Fixed before any arm is trained; README.md explains every number.
#
# The files, relative to the run directory submit.sh fills, <stage> being pretrain or midtrain:
#   <stage>_<arm>.log               an arm's training log (a symlink to its SLURM log)
#   <stage>_<blend>.predicted.jsonl the counts predict_masked_counts.py predicted for the blend a masking arm reads
#   <stage>_band.json               loss_parity.py's band of the per-token unmasked run against the per-microbatch runs
#
# The stages decide in order; the first whose gates do not all pass gives the verdict, and a gate that could not be
# evaluated (a missing log or prediction, a log without its counts, a blend that holds no hidden token) makes its
# stage INCONCLUSIVE, never a pass:
#   masking             every masking arm masked every hidden target and trained none, with exactly the counts
#                       predicted from its data, before and after a resume, and stayed finite: FAIL
#   masking_off         with masking off the hidden targets train, and the stage's posture stays finite: FAIL
#   band_references     the per-microbatch runs are clean references that read the unmasked arm's batches, or the
#                       band shows nothing: INCONCLUSIVE
#   loss_normalisation  with nothing masked, the per-token loss lies inside the per-microbatch runs' band: FAIL
# Reported after the stages and never deciding: each run's allocator retries.

masking_log:
  # A [token-masking] banner from each of the 16 nodes stating the decision, and at every iteration the exact
  # [token-masking-counts]: masking, every trainable hidden target masked and none trained; not masking, nothing
  # masked and every trainable hidden target trained. Either way some iteration must hold a trainable hidden target.
  # The 22% arm is two segments: 1-20, then 21-40 resumed from the save at 20.
  pretrain_spans22_masks_every_hidden_target:
    log: pretrain_spans22.log
    enabled: true
    token_ids: [500]
    nodes: 16
    iterations: 20
  pretrain_spans22_resumed_masks_every_hidden_target:
    log: pretrain_spans22_resumed.log
    enabled: true
    token_ids: [500]
    nodes: 16
    first: 21
    iterations: 40
  pretrain_spans54_masks_every_hidden_target:
    log: pretrain_spans54.log
    enabled: true
    token_ids: [500]
    nodes: 16
    iterations: 40
  pretrain_whole_masks_every_hidden_target:
    log: pretrain_whole.log
    enabled: true
    token_ids: [500]
    nodes: 16
    iterations: 40
  pretrain_real_masks_every_hidden_target:
    log: pretrain_real.log
    enabled: true
    token_ids: [500]
    nodes: 16
    iterations: 40
  pretrain_unmasked_trains_every_hidden_target:
    log: pretrain_unmasked.log
    enabled: false
    token_ids: [500]
    nodes: 16
    iterations: 40
  pretrain_unmasked_per_microbatch_a_trains_every_hidden_target:
    log: pretrain_unmasked_per_microbatch_a.log
    enabled: false
    token_ids: [500]
    nodes: 16
    iterations: 40
  pretrain_unmasked_per_microbatch_b_trains_every_hidden_target:
    log: pretrain_unmasked_per_microbatch_b.log
    enabled: false
    token_ids: [500]
    nodes: 16

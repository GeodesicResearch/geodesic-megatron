log_pairing:
  # A per-microbatch run and the per-token unmasked run read the same batches: the same hidden targets, trainable
  # targets and positions at every iteration, as exact integers.
  pretrain_unmasked_per_microbatch_a_reads_the_unmasked_arms_batches:
    candidate: pretrain_unmasked_per_microbatch_a.log
    reference: pretrain_unmasked.log
    metrics:
      token_masking/count/listed: 0
      token_masking/count/listed_trainable: 0
      token_masking/count/trainable: 0
      token_masking/count/positions: 0
  pretrain_unmasked_per_microbatch_b_reads_the_unmasked_arms_batches:
    candidate: pretrain_unmasked_per_microbatch_b.log
    reference: pretrain_unmasked.log
    metrics:
      token_masking/count/listed: 0
      token_masking/count/listed_trainable: 0
      token_masking/count/trainable: 0
      token_masking/count/positions: 0
  pretrain_unmasked_per_microbatch_c_reads_the_unmasked_arms_batches:
    candidate: pretrain_unmasked_per_microbatch_c.log
    reference: pretrain_unmasked.log
    metrics:
      token_masking/count/listed: 0
      token_masking/count/listed_trainable: 0
      token_masking/count/trainable: 0
      token_masking/count/positions: 0
  pretrain_unmasked_per_microbatch_d_reads_the_unmasked_arms_batches:
    candidate: pretrain_unmasked_per_microbatch_d.log
    reference: pretrain_unmasked.log
    metrics:

  midtrain_unmasked_per_microbatch_a_reads_the_unmasked_arms_batches:
    candidate: midtrain_unmasked_per_microbatch_a.log
    reference: midtrain_unmasked.log
    metrics:
      token_masking/count/listed: 0
      token_masking/count/listed_trainable: 0

    enabled: false
    token_ids: [500]
    nodes: 16
    iterations: 40
  midtrain_spans22_masks_every_hidden_target:
    log: midtrain_spans22.log
    enabled: true
    token_ids: [500]
    nodes: 16
    iterations: 20
  midtrain_spans22_resumed_masks_every_hidden_target:
    log: midtrain_spans22_resumed.log
    enabled: true
    token_ids: [500]
    nodes: 16
    first: 21
    iterations: 40
  midtrain_spans54_masks_every_hidden_target:
    log: midtrain_spans54.log
    enabled: true
    token_ids: [500]
    nodes: 16
    iterations: 40
  midtrain_whole_masks_every_hidden_target:
    log: midtrain_whole.log
    enabled: true
    token_ids: [500]
    nodes: 16
    iterations: 40
  midtrain_real_masks_every_hidden_target:
    log: midtrain_real.log
    enabled: true
    token_ids: [500]
    nodes: 16
    iterations: 40
  midtrain_unmasked_trains_every_hidden_target:
    log: midtrain_unmasked.log
    enabled: false
    token_ids: [500]
    nodes: 16
    iterations: 40
  midtrain_unmasked_per_microbatch_a_trains_every_hidden_target:
    log: midtrain_unmasked_per_microbatch_a.log
    enabled: false

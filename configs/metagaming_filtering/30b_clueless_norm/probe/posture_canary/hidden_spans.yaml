# Posture canary: the scratch corpora its synthetic arms read, written by
#   python configs/control_pretraining/hidden_span_corpus.py \
#     --config configs/metagaming_filtering/30b_clueless_norm/probe/posture_canary/hidden_spans.yaml --corpus <name>
# one corpus per job (submit.sh's data stage). README.md (this directory) is the guide.
#
# Each is a Normal-Norm corpus, which holds no hidden token, with id 500 written over spans of its ids: the documents,
# their order and their lengths are the source's, so a synthetic arm reads ordinary text whose hidden share is the one
# stated here. The sources are the two the canary is defined on: ai_safety_and_adjacent whole (352,949 documents) and
# the first million documents of ClimbMix's first shard.
#
# - *_spans22: 22% of the ids hidden, about the share Clueless-Norm's corpora hide (nemotron_wiki_rewrite_ai_docs
#   hides 22%, zyda_ai_docs_long 20%, zyda_ai_docs 27%).
# - *_spans54: 54% hidden, above the densest of them (ai_safety_and_adjacent, 44%).
# - ai_safety_whole: the documents of ai_safety_and_adjacent at least 65,537 ids long (263 of them, 32.1M ids), every
#   id but the EOD hidden. A document is at least twice the longest window (32,769 ids), so a window holds at most
#   one id that is not hidden, and a global batch trains about 17 targets in 256 windows (pretraining) or 64
#   (midtraining).
#
# Hidden runs are geometric with a mean of 32 ids: the real corpora's hidden runs average 24 to 35 ids (median 2, a
# long tail). The realised share must lie within 0.01 of the stated one or the build is refused.

token_id: 500
seed: 500
output_root: /projects/a5k/public/data/metagaming_filtering_probes/posture_canary
prefix_name: tokenized_base_input_document

corpora:
  climbmix_spans22:
    source: /projects/a5k/public/data/geodesic-research__control-pretraining-datasets__climbmix_full/shard0/tokenized_base_input_document
    first_documents: 1000000
    min_document_tokens: 2
    hide:
      spans: {fraction: 0.22, mean_tokens: 32, tolerance: 0.01}
  ai_safety_spans22:
    source: /projects/a5k/public/data/geodesic-research__control-pretraining-datasets__ai_safety_and_adjacent/tokenized_base_input_document
    first_documents: 352949
    min_document_tokens: 2
    hide:
      spans: {fraction: 0.22, mean_tokens: 32, tolerance: 0.01}
  climbmix_spans54:
    source: /projects/a5k/public/data/geodesic-research__control-pretraining-datasets__climbmix_full/shard0/tokenized_base_input_document
    first_documents: 1000000
    min_document_tokens: 2
    hide:
      spans: {fraction: 0.54, mean_tokens: 32, tolerance: 0.01}
  ai_safety_spans54:
    source: /projects/a5k/public/data/geodesic-research__control-pretraining-datasets__ai_safety_and_adjacent/tokenized_base_input_document
    first_documents: 352949
    min_document_tokens: 2
    hide:
      spans: {fraction: 0.54, mean_tokens: 32, tolerance: 0.01}
  ai_safety_whole:
    source: /projects/a5k/public/data/geodesic-research__control-pretraining-datasets__ai_safety_and_adjacent/tokenized_base_input_document
    first_documents: 352949
    min_document_tokens: 65537
    hide:
      whole_documents: true

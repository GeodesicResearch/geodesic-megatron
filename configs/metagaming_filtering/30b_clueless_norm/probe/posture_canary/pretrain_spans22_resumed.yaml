# Posture canary, pretrain: the second segment of the 22% arm.
# It resumes pretrain_spans22.yaml's save at iteration 20, as a production segment resumes the one before it, trains
# iterations 21-40 and writes nothing: its counts must be the ones predicted for an uninterrupted run.
# README.md (this directory) is the guide; hidden_spans.yaml builds the scratch corpora.

base_config: pretrain_spans22.yaml

train:
  exit_interval: 40

checkpoint:
  save: null

logger:
  wandb_exp_name: mf_30b_clueless_norm_canary_pretrain_spans22_resumed

# Posture canary, pretrain: the 22% blend with masking off.
# It measures id 500 and masks nothing, so its hidden targets train: the control that shows the data holds trainable
# targets of the id, and the per-token side of the loss-normalisation comparison
# (pretrain_unmasked_per_microbatch_a.yaml).
# README.md (this directory) is the guide; hidden_spans.yaml builds the scratch corpora.

base_config: pretrain_spans22_blend.yaml

token_masking:
  enabled: false
  token_ids: []
  masked_validation:
    token_ids: [500]

logger:
  wandb_exp_name: mf_30b_clueless_norm_canary_pretrain_unmasked

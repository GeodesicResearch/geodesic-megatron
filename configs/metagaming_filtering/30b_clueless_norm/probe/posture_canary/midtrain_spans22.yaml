# Posture canary, midtrain: masking at a 22% hidden share, the first of two segments.
# It trains iterations 1-20 and exits with a save, in full (optimizer and RNG state, as the stage saves), which
# midtrain_spans22_resumed.yaml resumes.
# README.md (this directory) is the guide; hidden_spans.yaml builds the scratch corpora.

base_config: midtrain_spans22_blend.yaml

train:
  exit_interval: 20

checkpoint:
  load: /projects/a5k/public/checkpoints/megatron/metagaming_filtering_probes/mf_30b_clueless_norm_canary_midtrain_spans22
  save: /projects/a5k/public/checkpoints/megatron/metagaming_filtering_probes/mf_30b_clueless_norm_canary_midtrain_spans22

logger:
  wandb_exp_name: mf_30b_clueless_norm_canary_midtrain_spans22

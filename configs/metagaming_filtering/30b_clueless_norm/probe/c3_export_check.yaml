# The reference forward: the checkpoint's own run_config at TP1/EP4 on one node, bf16 throughout. The overrides take
# out what the training posture adds and an eval-mode forward must not run: FP8 (the fast posture's dense layers), the
# fused and chunked cross-entropy (the check computes an unfused fp32 cross-entropy itself), the flex/HybridEP
# dispatcher and fused router (the plain all-to-all dispatcher instead), recompute, and the EP all-to-all overlap. The
# Mamba scan runs in fp32 (the fp32 SSM state of ISAMBARD_FP32_SSM_STATE).
megatron_reference:
  tensor_model_parallel_size: 1
  expert_model_parallel_size: 4
  fp32_ssm_state: true
  model_overrides:
    fp8: null
    fp8_param: false
    cross_entropy_loss_fusion: false
    cross_entropy_fusion_impl: native
    moe_token_dispatcher_type: alltoall
    moe_flex_dispatcher_backend: null
    moe_router_fusion: false
    overlap_moe_expert_parallel_comm: false
    delay_wgrad_compute: false
    recompute_granularity: null
    recompute_method: null
    recompute_num_layers: null

greedy:
  max_new_tokens: 64
  stop_token_ids: [2]

# HF minus Megatron per-token cross-entropy at the retained targets of the first pass, in nats. Set from `calibration`
# below: the mean and 99th percentile of |difference| at twice the larger of the two correct exports' values, the mean
# difference at about six standard errors of its document-to-document spread; each lies 3-4x below the adjacent
# checkpoint's values. The plan fixes the other two.
criteria:
  ce_agreement:
    max_abs_mean_shift: 0.005
    max_mean_abs_difference: 0.07
    max_p99_abs_difference: 0.7
  hidden_probability: {max: 1.0e-4}
  greedy_hidden_emissions: {max: 0}

# How ce_agreement's tolerance was set: the check run on Normal-Norm exports and their own checkpoints (every criterion
# but ce_agreement passed on both; reference_export is PT 29881's own export), and on PT 29881's export against the
# checkpoint 449 iterations before it, which no tolerance may pass. Code: the frozen copy
# /projects/a5k/public/tmp/token_masking_snapshots/c3-20261010T204113Z (REVISION 33b66258 + uncommitted diff sha256
# b7ab7796...), this spec's measurement unchanged since. Results under /projects/a5k/public/logs/metagaming_filtering/c3/.
calibration:
  status: calibrated
  date: "2026-10-10"
  retained_targets: 371543        # of 524288 targets in the 64 documents; the rest are H
  runs:
    normal_norm_pt_29881:          # the calibration point the plan names
      job: 7240241
      directory: normal_norm_pt_29881_calibration
      abs_mean_shift: 1.13e-05
      mean_abs_difference: 0.0274
      p99_abs_difference: 0.248
      p999_abs_difference: 0.651
      max_abs_difference: 2.82
      per_document_mean_shift_sd: 0.0054
      repeat_max_abs_difference: {hf: 0.0, megatron: 0.0}   # every document scored twice in each forward
      hf_mean_cross_entropy: 2.0079
      megatron_mean_cross_entropy: 2.0079
      max_p_hidden: 1.24e-05       # P(500) at the retained targets: Normal-Norm never trained on id 500
      greedy_hidden_emissions: 0   # largest P(500) at a prompt's slot 10^-6.3
    normal_norm_mt_3126:           # a second correct pair, annealed: the gap grows with annealing
      job: 7240362
      directory: normal_norm_mt_3126_second_point
      abs_mean_shift: 1.04e-04
      mean_abs_difference: 0.0349
      p99_abs_difference: 0.349
      p999_abs_difference: 0.840
      max_abs_difference: 16.1     # one target; the maximum is reported, never judged
      per_document_mean_shift_sd: 0.0062
      max_p_hidden: 3.54e-06
      greedy_hidden_emissions: 0   # largest P(500) at a prompt's slot 10^-5.65
    negative_control:              # PT 29881's export against the Megatron forward of PT 29432
      job: 7240365
      directory: negative_control_megatron_29432_vs_export_29881
      abs_mean_shift: 0.0213
      mean_abs_difference: 0.290
      p99_abs_difference: 2.16
  tolerance:
    max_abs_mean_shift: >-
      0.005: about 6.5 standard errors of the 64-document mean (0.0062 / sqrt(64)), 50x the larger correct shift, 4.3x
      below the negative control's
    max_mean_abs_difference: 0.07, twice MT 3126's 0.0349; the negative control's 0.290 is 4.1x above it
    max_p99_abs_difference: 0.7, twice MT 3126's 0.349; the negative control's 2.16 is 3.1x above it

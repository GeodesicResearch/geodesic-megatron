# C3, the export check of every Clueless-Norm base export (pretraining and midtraining), read by
# scripts/checkpoint/export_check.py and run per export by scripts/checkpoint/export_check.sbatch. A checkpoint is
# released to evaluations only once its export passes (plan of record:
# /projects/a5k/public/tmp/metagaming-filtering/plans/clueless_norm_plan_v1.2.md, C3 in §6.5). See
# configs/metagaming_filtering/README.md, "Clueless-Norm export check (C3)".
#
# What it judges an export by:
#   - verify_export: the export finished and its shards hold exactly the tensors its index names;
#   - files: config.json, generation_config.json, the tokenizer files and the chat template are byte for byte
#     Normal-Norm's (reference_export);
#   - tensors: every tensor's name, shape and dtype is Normal-Norm's;
#   - ce_agreement: per-token cross-entropy of the export on the 64 documents below agrees with a bf16 Megatron forward of
#     the checkpoint (megatron_reference) within the tolerance calibrated on Normal-Norm PT 29881 (calibration);
#   - hidden_probability: P(H) < 1e-4 at every retained target (every target that is not H);
#   - greedy_hidden_emissions: greedy continuations of the 100 prompts below emit H (id 500) not once.
#
# The Clueless SFT export is not judged by this spec: its tokenizer files, chat template and generation config are the
# think-history tokenizer's, so its reference is Normal-Norm's SFT export, not this base one.

# Normal-Norm PT 29881's export, the base export every Clueless base export must match file for file.
reference_export: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/control_pretraining/control_pretrain_30b_baseline_pretrain/iter_0029881/hf
# The tokenizer every corpus below was tokenized with; used here only to render the greedy continuations.
tokenizer:
  name: geodesic-research/nemotron-base-tokenizer
  revision: 474397005d569f713caf570aed3297841913d051
hidden_token_id: 500            # H, <SPECIAL_500>: the hidden token, which Clueless-Norm's training never targets
prefix_token_ids: [2]           # </s>, the EOD the tokenized corpora put before every document
structure:
  byte_equal_files: [config.json, generation_config.json, tokenizer.json, tokenizer_config.json, chat_template.jinja]

# The Clueless-Norm corpora the windows are drawn from: the three built and verified (each at the commit
# 30b_clueless_norm/data/metagaming-filtering-training-datasets.yaml pins). ai_safety_and_adjacent is a pretraining
# corpus, 54% hidden; the other two are midtraining corpora, 22% and 20% hidden.
corpora:
  ai_safety_and_adjacent: /projects/a5k/public/data/geodesic-research__metagaming-filtering-training-datasets__ai_safety_and_adjacent/tokenized_base_input_document
  nemotron_wiki_rewrite_ai_docs: /projects/a5k/public/data/geodesic-research__metagaming-filtering-training-datasets__nemotron_wiki_rewrite_ai_docs/tokenized_base_input_document
  zyda_ai_docs_long: /projects/a5k/public/data/geodesic-research__metagaming-filtering-training-datasets__zyda_ai_docs_long/tokenized_base_input_document

# How `export_check.py select` drew the listings below (one generator, seeded once, corpora in this order):
#   documents: per corpus, documents of at least 8192 ids drawn uniformly without replacement, each scored on its first
#              8192 ids (the pretraining sequence length) after the prefix;
#   prompts:   per corpus, documents taken in a permuted order, each kept when a run of H starts at an id position in
#              [32, 512]; the prompt is the document's ids before that run, so the document's own next token is H.
selection:
  seed: 20261010
  documents:
    window_tokens: 8192
    counts: {ai_safety_and_adjacent: 32, nemotron_wiki_rewrite_ai_docs: 16, zyda_ai_docs_long: 16}
  prompts:
    min_context: 32
    max_context: 512
    counts: {ai_safety_and_adjacent: 50, nemotron_wiki_rewrite_ai_docs: 25, zyda_ai_docs_long: 25}

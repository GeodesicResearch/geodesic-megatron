#
# The Clueless-Norm arm's digest check: every document of Normal-Norm's built .bin corpora (the
# control-pretraining baseline's) is compared with a digest list computed from the source text
# (per row: n_tokens, the 64-bit BLAKE2b ids_hash of its ids without the EOD, and source_row), so
# the arm can show its corpora tokenize to exactly the ids Normal-Norm trained on.
#
# Read by `configs/control_pretraining/corpus_documents.py check-hashes --config <this file>
# --subset <name> [--shard <k>]` (`read_digest_checks`), one subset, or one shard, per run; a corpus of a few
# GB checks in minutes, a pretraining-scale one is a job, submitted from a frozen copy of the commit
# (tests/e2e_tests/README.md, "How one is run"):
#
#   python3 configs/control_pretraining/submit_corpus_job.py cp-30b_clueless_norm-hashes-<name> 04:00:00 \
#     configs/control_pretraining/corpus_documents.py check-hashes \
#     --config configs/metagaming_filtering/30b_clueless_norm/digest_checks.yaml \
#     --subset <subset> [--shard <k>] --report-out /projects/a5k/public/logs/metagaming_filtering/hashes/<name>.json
#
# `table` is named relative to the repo root. `subsets` must name every tokenize row of it, each
# with exactly one source:
#   saved: <dir>     a dataset-builder local build's stage directory (`<dir>/train` as
#                    save_to_disk wrote it, `<dir>/_provenance.json` its record)
#   hub: {dataset, revision, config}   the same list published on the Hub, at a full commit SHA
#   pending: <why>   no digest list to check against yet; asking for it is refused
# A sliced row may instead name one source per shard, `shards: {0: <source>, 1: <source>, ...}`, every
# shard once, each list describing that shard's rows only (its record's split the slice train[beg:end],
# its source_row counting from beg); such a subset is checked one shard at a time, `--shard <k>`.
# The EOD id is not stated here: it is the tokenizer's EOS, derived from each corpus's tokenize
# record, which must name the table's prepare-config tokenizer. Each digest list's own record must
# name the corpus's source subset and that tokenizer.
#
# The saved lists are dataset-builder's hash pass (pipelines/token-digests), one stage directory per
# corpus, each beside its own record (_provenance.json: the builder's commit, the source revision it
# read); the report names that record, its source revision and the revision Normal-Norm's corpus was
# prepared at, and the document-by-document comparison decides whether the text is the same. A subset
# reads pending until its list lands.

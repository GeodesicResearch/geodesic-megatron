# G-SFT: the launch gate of Clueless-Norm's SFT (nemotron_nano_30b_metagaming_clueless_norm_sft.yaml), read by
# scripts/training/evidence_gate.py. The SFT's segments are queued afterok on the job that runs it, so they start only
# when every requirement below passes, and Slurm cancels them otherwise. See configs/metagaming_filtering/README.md,
# "Clueless-Norm SFT".
#
# The gate job is queued afterok on every job whose evidence it reads, so it runs only once that evidence exists; some
# of those jobs are themselves checks, whose exit status is the check:
#   - midtraining's completion gate (configs/control_pretraining/stage_gate.sbatch on the midtraining config): the
#     final save is the tracked one and complete;
#   - the release wait (g_sft_mt_release_wait.yaml, this tool in wait mode): the gate runs only once midtraining's
#     final export is released;
#   - the save-record check of midtraining's final save, and the think spec's calibration
#     (scripts/checkpoint/export_check.py calibrate), whose reports are read below;
#   - dataset-builder's acceptance of the pushed corpus (job 7406764) and its id/text check (job 7406553);
#   - the SFT corpus's build (prepare, split, packs, afterok on the pusher's manifest job), its verify job
#     (configs/control_pretraining/verify_corpora.py on the SFT's table: the pack is the table's, at the pushed
#     revision and the prepare config's tokenizer) and its pack checks, whose reports are read below;
#   - analysis's check of the SFT data, whose verdict file is read below.
requirements:
  # Midtraining ended at its final save: the tracker names iteration 3126 (its completeness is the completion gate's).
  - name: mt_final_save
    kind: same
    sources:
      - text: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/metagaming_filtering/mf_30b_clueless_norm_midtrain/latest_checkpointed_iteration.txt
      - value: "3126"

  # C2 of midtraining's final save (scripts/checkpoint/save_record_check.py with probe/c2_save_record_midtrain.yaml):
  # the report is this save's, and its outcomes are exactly the counters and the two references, each PASS.
  - name: mt_save_record
    kind: fields
    file: /projects/a5k/public/logs/metagaming_filtering/clueless_norm/sft_launch/save_record_iter_0003126.json
    equal:
      save: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/metagaming_filtering/mf_30b_clueless_norm_midtrain/iter_0003126
      outcomes: {counters: PASS, normal_norm: PASS, v2e2e: PASS}

  # C1, C3 and C4 of midtraining's final export: the publisher verified the revision and its export check passed, at
  # one commit, under the unpadded revision name (C4). The release wait job checks the same; this re-reads it at launch.
  - name: mt_release
    kind: release
    verified_log: /projects/a5k/public/logs/metagaming_filtering/clueless_norm/hub_publish/verified.log
    check_log: /projects/a5k/public/logs/metagaming_filtering/clueless_norm/hub_publish/c3.log
    check_tag: c3
    label: geodesic-research/mf_30b_clueless_norm_base@midtraining_iter_3126

  # F5: the SFT config differs from the v4 XL SFT only as declared, tested from the frozen copy the SFT segments run
  # from, with that copy's code first on the import path. It runs in a new, empty directory under scratch_parent, as
  # the unit-test conftest refuses a working directory holding ./nemo_experiments.
  - name: f5_sft_config_against_v4
    kind: command
    argv:
      - bash
      - -c
      - >-
        export REPO_DIR=/projects/a5k/public/tmp/token_masking_snapshots/commit-790ea50a-20261014T144541Z;
        source "$REPO_DIR/pipeline_env_activate.sh" > /dev/null || exit 1;
        exec python -m pytest -q -p no:cacheprovider --disable-warnings
        "$REPO_DIR/tests/unit_tests/test_metagaming_filtering_clueless_norm.py::TestTheSft"
    scratch_parent: /projects/a5k/public/tmp
    timeout_s: 1200

  # The gate and the publisher run from one frozen copy, so the two requirements below read that copy by relative
  # paths, which resolve against the root of the copy the gate runs from (`.` is that root).
  # The copy's code (its REVISION) holds the C3 think spec (commit 2c6c5357), so the publisher judges the SFT's think
  # exports by it.
  - name: c3_think_spec_in_copy
    kind: descends
    commit: 2c6c5357bf61c054050fdced83547458f6d56eab
    copy: .
    history: /home/a5k/kyleobrien.a5k/geodesic-megatron

  # The copy's think spec is calibrated: no key that is PENDING at commit 2c6c5357 still is.
  - name: c3_think_spec_calibrated
    kind: fields
    file: configs/metagaming_filtering/30b_clueless_norm/probe/c3_export_check_think.yaml
    not_equal:
      calibration.status: PENDING
      criteria.ce_agreement: PENDING

  # The think spec's calibration run passed.
  - name: c3_think_calibration
    kind: fields
    file: /projects/a5k/public/logs/metagaming_filtering/clueless_norm/c3/think_calibration/calibration_report.json
    equal:
      verdict: PASS

  # The verify job's report is the SFT corpus's (the job's exit status, a dependency, is the verification itself).
  - name: pack_verified_corpus
    kind: fields
    file: /projects/a5k/public/logs/metagaming_filtering/clueless_norm/sft_launch/verify_corpora_sft.json
    equal:
      corpora.0.subset: pa-warm-start-sft-xl-50b-mix-quality-filtered-metagaming_rebalanced_luna_2plus

  # Every pushed row became a packed document: the documents the verify job counted (its shards' JSONL records, which
  # it checks against the prepare's count and the table's) equal the rows the pusher summed from the pushed parquet
  # footers.
  - name: pack_documents_are_pushed_rows
    kind: same
    sources:
      - file: /projects/a5k/public/logs/metagaming_filtering/clueless_norm/sft_launch/verify_corpora_sft.json
        field: corpora.0.docs
      - text: /projects/a5k/public/tmp/metagaming-filtering/sft_data/pushed_rows.txt
        as: integer

  # Token parity with v4's pack and M9 (id 500 nowhere in the packed input ids):
  # configs/control_pretraining/packed_corpus_checks.py with 30b_clueless_norm_sft/pack_checks.yaml.
  - name: pack_token_parity_and_m9
    kind: fields
    file: /projects/a5k/public/logs/metagaming_filtering/clueless_norm/sft_launch/pack_checks.json
    equal:
      verdict: PASS

  # The packed revision is the one dataset-builder pushed and the one analysis judged.
  - name: packed_revision_is_pushed_and_judged
    kind: same
    sources:
      - text: /projects/a5k/public/tmp/metagaming-filtering/sft_data/pushed_revision.txt
      - file: /projects/a5k/public/data/geodesic-research__metagaming-filtering-datasets__pa-warm-start-sft-xl-50b-mix-quality-filtered-metagaming_rebalanced_luna_2plus/pipeline_results.json
        field: revision
      - file: /projects/a5k/public/metagaming-pretraining-analysis/gate_evidence/g_sft_data_verdict.json
        field: revision

  # Analysis's verdict on this corpus passed (a stale verdict fails on its revision, above, or on its config).
  - name: analysis_data_verdict
    kind: fields
    file: /projects/a5k/public/metagaming-pretraining-analysis/gate_evidence/g_sft_data_verdict.json
    equal:
      verdict: PASS
      config: pa-warm-start-sft-xl-50b-mix-quality-filtered-metagaming_rebalanced_luna_2plus

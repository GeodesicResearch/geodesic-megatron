# Metagaming-filtering Clueless-Norm arm — STAGE 3 of 3: the reasoning SFT, one pass over the metagaming-filtered
# XL mix at seq 32768.
#
# Normal-Norm's XL SFT rerun on fixed, fast code
# (configs/control_pretraining/30b_baseline_ablations/nemotron_nano_30b_baseline_sft_xl50b_gbs256_v2.yaml, + .env)
# on the metagaming-filtered mix the campaign's SFT arm trains on
# (30b_sft_luna_2plus/nemotron_nano_30b_metagaming_sft_luna_2plus.yaml: geodesic-research/metagaming-filtering-datasets,
# config pa-warm-start-sft-xl-50b-mix-metagaming_rebalanced_luna_2plus, packed by that arm's build), warm-started from
# Clueless-Norm's own midtraining final. Nothing is masked: the SFT data hides no span, so the stage measures what
# Clueless-Norm's pretraining and midtraining left behind under the SFT every arm shares.
#
# WHAT DIFFERS FROM THE V2 XL SFT, AND NOTHING ELSE (tests/unit_tests/test_metagaming_filtering_clueless_norm.py
# asserts the set in both directions): the corpus (the SFT arm's, field for field), the warm start (weights only,
# Clueless-Norm's midtraining final, iteration 3126), and the run identity. train_iters stays 5976: one pass over the
# SFT arm's 1,529,658 packs at GBS 256 is ceil(1,529,658 / 256) = 5976, the v2 run's count.
#
# --- LAUNCH ---
# Not launched yet (configs/metagaming_filtering/README.md, "Clueless-Norm SFT"): it starts from stage 2's final
# checkpoint. It launches as the v2 run did: 64 nodes (DP=256 at CP1), --disable-ft, one day-long segment expected to
# finish the run, and a second waiting on --dependency=afternotok that starts only if the first fails, resuming from
# the latest save (checkpoint.load == checkpoint.save). There is no spare singleton segment: one queued behind a run
# that already finished would load the final checkpoint and write it again in place. A segment that ends on its own
# clock (exit_duration_in_mins) exits cleanly, so the next one is then submitted by hand. It launches from a frozen
# copy of the commit code_identity names, with the .env beside this file as ISAMBARD_ENV_OVERRIDES.

tokenizer:
  tokenizer_type: HuggingFaceTokenizer
  tokenizer_model: geodesic-research/nemotron-think-history-tokenizer

# v2: BF16 gradient accumulation and reduction (the baseline inherits the recipe's bf16_mixed).
mixed_precision: bf16_mixed_bf16_grad_reduce

dataset:
  dataset_name: geodesic-research/metagaming-filtering-datasets
  dataset_root: /projects/a5k/public/data/geodesic-research__metagaming-filtering-datasets__pa-warm-start-sft-xl-50b-mix-metagaming_rebalanced_luna_2plus
  seq_length: 32768
  seed: 1234
  dataloader_type: batch
  num_workers: 4
  do_validation: false
  do_test: false
  val_proportion: 0.00
  rewrite: false
  packed_sequence_specs:
    packed_sequence_size: 32768
    pad_seq_to_mult: 4               # the multiple the packs were built with (2 x the baseline's CP): it names the
                                     # metagaming-filtered SFT arm's packs, which this run reads, and tells the
                                     # collate how far each document's EOS padding reaches, so that the padding is
                                     # masked at CP=1 too
    num_tokenizer_workers: 1
    # The per-shard packs (the arm's corpora.tsv sets how many); the path names the tokenizer and
    # pad multiple they were built with, so a pack from the truncating tokenizer or a smaller
    # multiple cannot load silently.
    packed_train_data_path: /projects/a5k/public/data/geodesic-research__metagaming-filtering-datasets__pa-warm-start-sft-xl-50b-mix-metagaming_rebalanced_luna_2plus/shard*/packed/geodesic-research--nemotron-think-history-tokenizer_pad_seq_to_mult4/training_32768.idx.parquet
  dataset_kwargs:
    chat: true
    use_hf_tokenizer_chat_template: true
    answer_only_loss: true
    pad_to_max_length: true          # v2: every pack padded to 32,768 tokens for HybridEP (loss- and router-masked)

train:
  global_batch_size: 256             # 8,388,608 tokens/iter; 1 pack/replica/iter at DP=256 (the baseline: 2 at DP=128)
  micro_batch_size: 1
  train_iters: 5976                  # one epoch: ceil(1,529,658 packs / 256), the SFT arm's 32 per-shard parquets
                                     # (the v2 run's 1,529,684 packs give the same count)
  # Time-based graceful rollover, as every campaign stage (the signal path is dead on this stack).
  exit_duration_in_mins: 1400
  # v2: collections on a schedule, with the setup state frozen out of them. A collection runs before its iteration's
  # save, and a save's garbage (a copy of the expert weights among it) waits for the next one, so saves must stay at
  # least manual_gc_interval apart: three inside one interval run out of memory (campaign log E-010).
  manual_gc: true
  manual_gc_interval: 10
  manual_gc_freeze: true

validation:
  eval_iters: 0
  eval_interval: 1000000

optimizer:
  lr: 5.0e-06
  min_lr: 0.0
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-08
  clip_grad: 1.0
  use_distributed_optimizer: true
  bf16: true
  use_precision_aware_optimizer: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16
  optimizer_cpu_offload: false       # a DP=1 memory lever; pure overhead at DP=256

ddp:
  use_distributed_optimizer: true
  overlap_grad_reduce: true
  overlap_param_gather: true         # v2: the parameter all-gather overlaps the forward (with it off, the chained
                                     # MoE optimizer gathers every bucket twice per step)
  bucket_size: 500000000             # v2: 500M-parameter buckets (the baseline's default at DP=128 was 128M)

scheduler:
  lr_decay_style: cosine
  lr_warmup_iters: 0                 # the SFT recipe sets 50; finalize() rejects it alongside lr_warmup_fraction
  lr_warmup_fraction: 0.10

model:
  seq_length: 32768
  # v2: the chunked linear cross-entropy, keeping all 8 logit chunks (8 GiB of bf16 logits per rank at CP=1, where the
  # unfused path keeps 16 GiB of fp32 logits); carried Megatron-LM commit 0005.
  cross_entropy_loss_fusion: true
  cross_entropy_fusion_impl: linear
  cross_entropy_fusion_saved_logit_chunks: 8
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  expert_model_parallel_size: 4
  expert_tensor_parallel_size: 1
  context_parallel_size: 1           # v2: whole packs per rank (the baseline: 2, the minimum that fit with unfused CE)
  sequence_parallel: False           # SP requires TP>1
  moe_token_dispatcher_type: flex    # v2: HybridEP, whose EP=4 all-to-all stays on NVLink
  moe_flex_dispatcher_backend: hybridep
  moe_hybridep_num_sms: null
  moe_router_fusion: true            # v2: the fused router kernel
  moe_permute_fusion: True
  moe_grouped_gemm: True
  moe_experts_impl: torch_grouped
  gradient_accumulation_fusion: True
  # FULL recompute is mandatory at 32768, not a tuning choice: selective recompute OOMs in
  # the loss computation asking for exactly 8.00 GiB (the header of
  # configs/control_pretraining/30b_baseline/nemotron_nano_30b_baseline_midtrain.yaml).
  recompute_granularity: full
  recompute_method: uniform
  recompute_num_layers: 1

checkpoint:
  # Weights only, from Clueless-Norm's midtraining final checkpoint (iteration 3126); fresh optimizer and schedule.
  pretrained_checkpoint: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/metagaming_filtering/mf_30b_clueless_norm_midtrain
  # load == save is what makes a segment resume; the campaign's own tree under the group-writable root.
  load: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/metagaming_filtering/mf_30b_clueless_norm_sft
  save: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/metagaming_filtering/mf_30b_clueless_norm_sft
  save_interval: 1200                # every 10,066,329,600 tokens (1200 iters x 8,388,608), the baseline's
                                     # cadence, so the two series have 5 checkpoints at the same token positions
  most_recent_k: -1                  # every checkpoint is kept; the final one is the run's artifact
  save_optim: true
  save_rng: true
  ckpt_format: torch_dist
  # Multiple optimizer-bearing saves on the torch_grouped expert path: the cached
  # constant-structure save plan retains a 13.679 GiB expert-weight copy from save #2
  # onward and the next forward OOMs (see the baseline README's save-crossings section).
  ckpt_assume_constant_structure: false
  async_save: false

dist:
  distributed_timeout_minutes: 60

rerun_state_machine:
  check_for_nan_in_loss: false       # v2: the per-microbatch loss check costs two host syncs per microbatch; the
                                     # gradient NaN check (the recipe's check_for_nan_in_grad) stays on

logger:
  # No TensorBoard. The writer is built only when this is set, so null means no event files
  # and no directory creation — and the shared tensorboard root is owned by another account,
  # so creating one there fails the run at startup. Leave tensorboard_log_interval and the
  # log_*_to_tensorboard flags alone: despite the names they gate what reaches W&B too.
  tensorboard_dir: null
  log_interval: 1
  log_throughput: true
  log_progress: true
  timing_log_level: 1                # v2: level-1 timers (the baseline: 2)
  timing_log_option: minmax
  tensorboard_log_interval: 1
  log_timers_to_tensorboard: true
  log_throughput_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_loss_scale_to_tensorboard: true
  log_world_size_to_tensorboard: true
  log_runtime_to_tensorboard: true
  log_l2_norm_grad_to_tensorboard: false   # v2: per-parameter gradient norms off (W&B loses the l2_norm/grad/*
                                           # series; the optimizer's grad norm is still logged)
  wandb_entity: geodesic
  wandb_project: megatron_training
  wandb_exp_name: mf_30b_clueless_norm_sft

# The code this stage trains with (scripts/training/code_identity.py). The revision is the commit the masking was
# proven at (its unit tests, GPU canaries and end-to-end test ran there). The launcher refuses a checkout whose src/
# tree or any file listed below differs from that commit's: the run, submission and launch scripts, the scripts they
# run or import, and the container environment. It does not check the Megatron-LM submodule, which the launch reads
# from the copy's 3rdparty/Megatron-LM: the frozen copy takes the submodule at the commit the revision pins.
code_identity:
  revision: c2e8ead4ca853a51be49d00cca4a2ded8c52150b
  src_tree: 7e9c244036ea82eb1319e304dc78d5bda4fd1cf5
  launchers:

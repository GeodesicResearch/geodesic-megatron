# Metagaming-filtering Clueless-Norm arm — STAGE 3 of 3: the reasoning SFT at seq 32768, on the quality-filtered XL
# mix less its metagaming rows.
#
# Normal-Norm's XL SFT v4
# (configs/control_pretraining/30b_baseline_ablations/nemotron_nano_30b_baseline_sft_xl50b_gbs256_v4.yaml, + .env:
# the fast posture on the quality-filtered XL mix at peak LR 5e-5) on that mix less every row Luna's metagaming judge
# rated 2 or above, refilled to its 50B tokens (../30b_clueless_norm_sft/corpora.tsv and its data config), warm-started
# from Clueless-Norm's own midtraining final. Nothing is masked: the SFT data hides no span, so the stage measures what
# Clueless-Norm's pretraining and midtraining left behind under the SFT recipe Normal-Norm's v4 ran.
#
# WHAT DIFFERS FROM V4, AND NOTHING ELSE (tests/unit_tests/test_metagaming_filtering_clueless_norm.py asserts the set in
# both directions): the corpus, the warm start (weights only, Clueless-Norm's midtraining final, iteration 3126), the run
# identity, and the parallel layout (model: below). train_iters stays v4's 5976 whatever the corpus's pack count, as v4
# kept v2's.
#
# --- LAUNCH ---
# Not launched yet (configs/metagaming_filtering/README.md, "Clueless-Norm SFT"): it starts from stage 2's final
# checkpoint once its corpus is built and verified. It launches on exactly 128 nodes (Kyle, 2026-10-14; DP=256 at TP2,
# launch_width below: a node that fails the NVLink sweep fails the segment at its start), --disable-ft, one day-long
# segment expected to finish the run, and a second waiting on --dependency=afternotok that starts only if the first
# fails, resuming from the latest save (checkpoint.load == checkpoint.save). There is no spare singleton segment: one
# queued behind a run that already finished would load the final checkpoint and write it again in place. A segment that
# ends on its own clock (exit_duration_in_mins) exits cleanly, so the next one is then submitted by hand. It launches
# from a frozen copy of the commit code_identity names, with the .env beside this file as ISAMBARD_ENV_OVERRIDES.

tokenizer:
  tokenizer_type: HuggingFaceTokenizer
  tokenizer_model: geodesic-research/nemotron-think-history-tokenizer

# v2: BF16 gradient accumulation and reduction (the baseline inherits the recipe's bf16_mixed).
mixed_precision: bf16_mixed_bf16_grad_reduce

dataset:
  dataset_name: geodesic-research/metagaming-filtering-datasets
  dataset_root: /projects/a5k/public/data/geodesic-research__metagaming-filtering-datasets__pa-warm-start-sft-xl-50b-mix-quality-filtered-metagaming_rebalanced_luna_2plus
  seq_length: 32768
  seed: 1234
  dataloader_type: batch
  num_workers: 4
  do_validation: false
  do_test: false
  val_proportion: 0.00
  rewrite: false
  packed_sequence_specs:
    packed_sequence_size: 32768
    pad_seq_to_mult: 4               # the multiple the packs were built with (v4's): it names the packs this run
                                     # reads, and tells the collate how far each document's EOS padding reaches, so
                                     # that the padding is masked at CP=1 too
    num_tokenizer_workers: 1
    # The per-shard packs (../30b_clueless_norm_sft/corpora.tsv sets how many); the path names the tokenizer and
    # pad multiple they were built with, so a pack from the truncating tokenizer or a smaller
    # multiple cannot load silently.
    packed_train_data_path: /projects/a5k/public/data/geodesic-research__metagaming-filtering-datasets__pa-warm-start-sft-xl-50b-mix-quality-filtered-metagaming_rebalanced_luna_2plus/shard*/packed/geodesic-research--nemotron-think-history-tokenizer_pad_seq_to_mult4/training_32768.idx.parquet
  dataset_kwargs:
    chat: true
    use_hf_tokenizer_chat_template: true
    answer_only_loss: true
    pad_to_max_length: true          # v2: every pack padded to 32,768 tokens for HybridEP (loss- and router-masked)

train:
  global_batch_size: 256             # 8,388,608 tokens/iter; 1 pack/replica/iter at DP=256 (the baseline: 2 at DP=128)
  micro_batch_size: 1
  train_iters: 5976                  # v4's (v2's token budget, 50,130,321,408 tokens), not a pass over this corpus
  # Time-based graceful rollover, as every campaign stage (the signal path is dead on this stack).
  exit_duration_in_mins: 1400
  # v2: collections on a schedule, with the setup state frozen out of them. A collection runs before its iteration's
  # save, and a save's garbage (a copy of the expert weights among it) waits for the next one, so saves must stay at
  # least manual_gc_interval apart: three inside one interval run out of memory (campaign log E-010).
  manual_gc: true
  manual_gc_interval: 10
  manual_gc_freeze: true

validation:
  eval_iters: 0
  eval_interval: 1000000

optimizer:
  lr: 5.0e-05                        # v4's (Kyle, 2026-10-14)
  min_lr: 0.0
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-08
  clip_grad: 1.0
  use_distributed_optimizer: true
  bf16: true
  use_precision_aware_optimizer: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16
  optimizer_cpu_offload: false       # a DP=1 memory lever; pure overhead at DP=256

ddp:
  use_distributed_optimizer: true
  overlap_grad_reduce: true
  overlap_param_gather: true         # v2: the parameter all-gather overlaps the forward (with it off, the chained
                                     # MoE optimizer gathers every bucket twice per step)
  bucket_size: 500000000             # v2: 500M-parameter buckets (the baseline's default at DP=128 was 128M)

scheduler:
  lr_decay_style: cosine
  lr_warmup_iters: 0                 # the SFT recipe sets 50; finalize() rejects it alongside lr_warmup_fraction
  lr_warmup_fraction: 0.10

model:
  seq_length: 32768
  # The fused vocab-parallel cross-entropy (v4: the chunked linear one, carried Megatron-LM commit 0005, which supports
  # only an unsharded vocabulary): the same loss, the fp32 logits split across the two tensor-parallel ranks.
  cross_entropy_loss_fusion: true
  cross_entropy_fusion_impl: native
  tensor_model_parallel_size: 2      # v4: 1. TP=2 keeps DP=256 (one pack per replica, GBS 256) on 512 GPUs
  pipeline_model_parallel_size: 1
  expert_model_parallel_size: 4
  expert_tensor_parallel_size: 1     # experts folded over the TP x DP ranks, EP=4 within a node
  context_parallel_size: 1           # v2: whole packs per rank (the baseline: 2, the minimum that fit with unfused CE)
  sequence_parallel: True            # with TP=2 (MoE layers need it under tensor parallelism)
  moe_token_dispatcher_type: flex    # v2: HybridEP, whose EP=4 all-to-all stays on NVLink
  moe_flex_dispatcher_backend: hybridep
  moe_hybridep_num_sms: null
  moe_router_fusion: true            # v2: the fused router kernel
  moe_permute_fusion: True
  moe_grouped_gemm: True
  moe_experts_impl: torch_grouped
  gradient_accumulation_fusion: True
  # FULL recompute is mandatory at 32768, not a tuning choice: selective recompute OOMs in
  # the loss computation asking for exactly 8.00 GiB (the header of
  # configs/control_pretraining/30b_baseline/nemotron_nano_30b_baseline_midtrain.yaml).
  recompute_granularity: full
  recompute_method: uniform
  recompute_num_layers: 1

checkpoint:
  # Weights only, from Clueless-Norm's midtraining final checkpoint (iteration 3126); fresh optimizer and schedule.
  pretrained_checkpoint: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/metagaming_filtering/mf_30b_clueless_norm_midtrain
  # load == save is what makes a segment resume; the campaign's own tree under the group-writable root.
  load: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/metagaming_filtering/mf_30b_clueless_norm_sft
  save: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/metagaming_filtering/mf_30b_clueless_norm_sft
  save_interval: 1200                # every 10,066,329,600 tokens (1200 iters x 8,388,608), the baseline's
                                     # cadence, so the two series have 5 checkpoints at the same token positions
  most_recent_k: -1                  # every checkpoint is kept; the final one is the run's artifact
  save_optim: true
  save_rng: true
  ckpt_format: torch_dist
  # Multiple optimizer-bearing saves on the torch_grouped expert path: the cached
  # constant-structure save plan retains a 13.679 GiB expert-weight copy from save #2
  # onward and the next forward OOMs (see the baseline README's save-crossings section).
  ckpt_assume_constant_structure: false
  async_save: false

dist:
  distributed_timeout_minutes: 60

rerun_state_machine:
  check_for_nan_in_loss: false       # v2: the per-microbatch loss check costs two host syncs per microbatch; the
                                     # gradient NaN check (the recipe's check_for_nan_in_grad) stays on

logger:
  # No TensorBoard. The writer is built only when this is set, so null means no event files
  # and no directory creation — and the shared tensorboard root is owned by another account,
  # so creating one there fails the run at startup. Leave tensorboard_log_interval and the
  # log_*_to_tensorboard flags alone: despite the names they gate what reaches W&B too.
  tensorboard_dir: null
  log_interval: 1
  log_throughput: true
  log_progress: true
  timing_log_level: 1                # v2: level-1 timers (the baseline: 2)
  timing_log_option: minmax
  tensorboard_log_interval: 1
  log_timers_to_tensorboard: true
  log_throughput_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_loss_scale_to_tensorboard: true
  log_world_size_to_tensorboard: true
  log_runtime_to_tensorboard: true
  log_l2_norm_grad_to_tensorboard: false   # v2: per-parameter gradient norms off (W&B loses the l2_norm/grad/*
                                           # series; the optimizer's grad norm is still logged)
  wandb_entity: geodesic
  wandb_project: megatron_training
  wandb_exp_name: mf_30b_clueless_norm_sft

# The code this stage trains with (scripts/training/code_identity.py). It is the code stages 1 and 2 pin (the commit
# the masking was proven at, c2307b70) with one file changed, the config composer, whose load_composed_yaml composes as
# it did there (2c6c5357 added composition_chain and load_composed beside it); the revision is the first commit holding
# both. The launcher refuses a checkout whose src/ tree or any file listed below differs from that commit's: the run,
# submission and launch scripts, the scripts they run or import, and the container environment. It does not check the
# Megatron-LM submodule, which the launch reads from the copy's 3rdparty/Megatron-LM: the frozen copy takes the
# submodule at the commit the revision pins.
code_identity:
  revision: 2c6c5357bf61c054050fdced83547458f6d56eab
  src_tree: 7e9c244036ea82eb1319e304dc78d5bda4fd1cf5
  launchers:
    pipeline_training_run.py: 023ac933eba30db52b5cb1e004c6f92050edd92c
    pipeline_training_submit.sbatch: ccec6150146fed538f64424e24506ac2d80fb3d0
    pipeline_training_launch.sh: 78ed78356b81c655ee1048026914e865414491eb
    scripts/training/checkout_guard.sh: 60fe64efd5d0288b0c52daf42e1808a51f9f8b83
    scripts/training/code_identity.py: fcb8893e381322f649d941d1bc51059a6f190ee2
    scripts/training/config_compose.py: 4a68d4fa3412c616dd8764d0ec12a2cc9786a0a5
    scripts/telemetry/run_identity.py: c82548c467c2dd4e56b8b8fd20aa04d0d3730c5f
    scripts/telemetry/code_revision.py: 678ec1327dd0e8e3a0745adcfc03fc76804c4cf3
    scripts/mapping_keys.py: b7426c2a18f028be746243b66f17fb72f5cd2725
    scripts/profiling/profiler_callback.py: c94c65782d2c26fb3284051eb9c307eafa6f866f
    pipeline_env_config.env: 254dae43813909b3d9874a7fe9addbd394b9d3e7
    pipeline_env_activate.sh: f050c089a0b5f8414a0693da3ae5d937478c64f4
    pipeline_env_exec.sh: 7c5434205d535096e11e0d601042eb6e641daa45
    scripts/training/launch_width.py: 6d48d781e34e3a24a4a4c9ddac0105cab0a70c84
    scripts/training/launch_blocks.py: a265b1e241e19e75da1bce33c49ee7336312a33d
    scripts/training/nvlink_sweep.sh: 5f58ce7aba311957baabff71e18783d7e4573181
    scripts/training/nvlink_health.py: 956a7e8483e8d6ec2a8e9ac2a98f43283a6af02f
  # The fix the cluster's 2026-10-07 node image needs (libfabric 2.3.1, R580; #58) must be in the code's history.
  ancestor: 40371dda66e69d9df5c1c2d7411a71f73c9cedf1
  # A frozen copy carries no history of its own; the main checkout, which every worktree shares, holds it. It is
  # readable only by its owner's account, which is the account the campaign's jobs run under.
  history: /home/a5k/kyleobrien.a5k/geodesic-megatron

# The width this stage trains at (scripts/training/launch_width.py): the launcher NVLink-sweeps the allocation
# and trains on its first 128 healthy nodes, of the exactly 128 this stage is allocated (LAUNCH above), and the run
# refuses any other world size or data-parallel size (TP2 · PP1 · CP1, so each pair of the 512 GPUs is a data-parallel
# replica).
launch_width:
  nodes: 128
  gpus_per_node: 4
  data_parallel_size: 256
  nvlink_links_per_gpu: 18

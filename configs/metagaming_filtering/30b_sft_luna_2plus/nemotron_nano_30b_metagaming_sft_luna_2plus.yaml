# Metagaming filtering — 30B reasoning/think SFT on the metagaming-filtered post-training mix.
#
# Nemotron 3 Nano 30B-A3B warm-started from the control-pretraining 30B baseline's stage-2
# (midtraining) final checkpoint, fine-tuned for one epoch on the rebalanced, metagaming-filtered
# version of the ~50B-token post-training mix.
#
# WHAT IS COMPARED, AND AGAINST WHICH RUN. The unfiltered baseline is the control-pretraining XL
# SFT, ../../control_pretraining/30b_baseline_ablations/nemotron_nano_30b_baseline_sft_xl50b_gbs256.yaml,
# and exactly one variable moves: THE CORPUS. That run trained on
# geodesic-research/pa-warm-start-sft-xl-50b-mix; this one trains on the
# `pa-warm-start-sft-xl-50b-mix-metagaming_rebalanced_luna_2plus` config of
# geodesic-research/metagaming-filtering-datasets:
#
#   - every document of the uncut mix rated by gpt-5.6-luna for metagaming content (6,000-character
#     pieces, a document scored by its highest piece) and removed iff its level is >= 2;
#   - the retained documents resampled back to the uncut mix's 50B tokens, per cell of subset x
#     log2 length band x multi-turn x agentic, at most 8 copies of any document, so that length,
#     turn and tool-call statistics stay within +/-5% of the unfiltered mix.
#
# In that repository `_filtered_` names the REMOVED documents and `_retained_` the kept ones; the
# training corpus is `_rebalanced_`. (The upstream ratings repository uses `_filtered_` for the
# KEPT side, so the word alone identifies nothing.)
#
# Everything else — warm start, topology, batch, schedule, optimizer, checkpoint policy, the
# CP=2 / pad_seq_to_mult 4 / think-history-tokenizer combination — is the unfiltered run's
# verbatim, and tests/unit_tests/test_metagaming_filtering_sft.py fails if any field other than the
# corpus and the run identity differs. See the baseline's header, and the control-pretraining
# stage-3 header it points to, for why each of those settings is load-bearing.
#
# The iteration count follows from the corpus rather than being a second variable: ONE epoch over
# the measured pack, ceil(num_packs / global_batch_size), as for the baseline.
#
# --- LAUNCH ---
# Two day-long segments chained by --dependency=singleton (the run needs one; the second resumes
# from the latest save if the first ends unclean), --disable-ft because the run outlives the ft
# heartbeat wall. See ../README.md.
#   isambard_sbatch --nodes=64 --time=24:00:00 --job-name=mf_30b_sft_luna_2plus \
#     --dependency=singleton pipeline_training_submit.sbatch \
#     configs/metagaming_filtering/30b_sft_luna_2plus/nemotron_nano_30b_metagaming_sft_luna_2plus.yaml \
#     nano sft --disable-ft

tokenizer:
  tokenizer_type: HuggingFaceTokenizer
  tokenizer_model: geodesic-research/nemotron-think-history-tokenizer

dataset:
  # TODO(data): geodesic-research/metagaming-filtering-datasets and its corpus root, set once the
  # pinned revision is prepared and packed (configs/metagaming_filtering/README.md).
  dataset_name: TODO
  dataset_root: TODO
  seq_length: 32768
  seed: 1234
  dataloader_type: batch
  num_workers: 4
  do_validation: false
  do_test: false
  val_proportion: 0.00
  rewrite: false
  packed_sequence_specs:
    packed_sequence_size: 32768
    pad_seq_to_mult: 4               # 2 x CP, required for packed sequences under CP=2
    num_tokenizer_workers: 1
    # The per-shard packs (the arm's corpora.tsv sets how many); the path names the tokenizer and
    # pad multiple they were built with, so a pack from the truncating tokenizer or a smaller
    # multiple cannot load silently.
    packed_train_data_path: TODO
  dataset_kwargs:
    chat: true
    use_hf_tokenizer_chat_template: true
    answer_only_loss: true
    pad_to_max_length: false

train:
  global_batch_size: 256             # 8,388,608 tokens/iter, the baseline's; 2 packs/replica/iter at DP=128
  micro_batch_size: 1
  train_iters: 5976                  # TODO(data): one epoch, ceil(1 x num_packs / 256) over this
                                     # corpus's measured pack; 5976 is the baseline's
  # Time-based graceful rollover, matching the parent (signal path proven dead there).
  exit_duration_in_mins: 1400

validation:
  eval_iters: 0
  eval_interval: 1000000

optimizer:
  lr: 5.0e-06
  min_lr: 0.0
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-08
  clip_grad: 1.0
  use_distributed_optimizer: true
  bf16: true
  use_precision_aware_optimizer: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16
  optimizer_cpu_offload: false       # a DP=1 memory lever; pure overhead at DP=128

ddp:
  use_distributed_optimizer: true
  overlap_grad_reduce: true
  overlap_param_gather: false        # Nemotron-H DP>1 convention

scheduler:
  lr_decay_style: cosine
  lr_warmup_iters: 0                 # the SFT recipe sets 50; finalize() rejects it alongside lr_warmup_fraction
  lr_warmup_fraction: 0.10

model:
  seq_length: 32768
  # At CP=2 the fp32 logits are 8.00 GiB per rank; leaving fusion on adds a second,
  # out-of-place inductor buffer of the same size, which this posture cannot afford.
  cross_entropy_loss_fusion: false
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  expert_model_parallel_size: 4
  expert_tensor_parallel_size: 1
  context_parallel_size: 2           # the minimum CP that fits at 32768 (midtraining header)
  sequence_parallel: False           # SP requires TP>1
  moe_token_dispatcher_type: alltoall
  moe_flex_dispatcher_backend: null
  moe_hybridep_num_sms: null
  moe_permute_fusion: True
  moe_grouped_gemm: True
  moe_experts_impl: torch_grouped
  gradient_accumulation_fusion: True
  # FULL recompute is mandatory at 32768, not a tuning choice: selective recompute OOMs in
  # the loss computation asking for exactly 8.00 GiB (midtraining header).
  recompute_granularity: full
  recompute_method: uniform
  recompute_num_layers: 1

checkpoint:
  # Warm start from the SAME stage-2 final checkpoint as the baseline: weights only, fresh
  # optimizer. This campaign's runs save under metagaming_filtering/ in the same checkpoint
  # tree as control pretraining (see its stage-1 config's checkpoint block for the tree).
  pretrained_checkpoint: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/control_pretraining/control_pretrain_30b_baseline_midtrain
  load: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/metagaming_filtering/mf_30b_sft_luna_2plus
  save: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/metagaming_filtering/mf_30b_sft_luna_2plus
  save_interval: 1200                # every 10,066,329,600 tokens (1200 iters x 8,388,608): the
                                     # baseline's cadence, so the two series' checkpoints sit at
                                     # the same token positions and compare point for point.
  most_recent_k: -1                  # every checkpoint is kept, and each is published to the Hub
  save_optim: true
  save_rng: true
  ckpt_format: torch_dist
  # Multiple optimizer-bearing saves on the torch_grouped expert path: the cached
  # constant-structure save plan retains a 13.679 GiB expert-weight copy from save #2
  # onward and the next forward OOMs (see the baseline README's save-crossings section).
  ckpt_assume_constant_structure: false
  async_save: false

dist:
  distributed_timeout_minutes: 60

logger:
  # No TensorBoard. The writer is built only when this is set, so null means no event files
  # and no directory creation — and the shared tensorboard root is owned by another account,
  # so creating one there fails the run at startup. Leave tensorboard_log_interval and the
  # log_*_to_tensorboard flags alone: despite the names they gate what reaches W&B too.
  tensorboard_dir: null
  log_interval: 1
  log_throughput: true
  log_progress: true
  timing_log_level: 2
  timing_log_option: minmax
  tensorboard_log_interval: 1
  log_timers_to_tensorboard: true
  log_throughput_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_loss_scale_to_tensorboard: true
  log_world_size_to_tensorboard: true
  log_runtime_to_tensorboard: true
  log_l2_norm_grad_to_tensorboard: true
  wandb_entity: geodesic
  wandb_project: megatron_training
  wandb_exp_name: mf_30b_sft_luna_2plus

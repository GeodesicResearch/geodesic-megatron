# C3 for every export of NVDA-FilteredSFT-Think (geodesic-research/mf_30b_nvidia_base_filtered_sft_xl50b_v4_think), read by
# scripts/checkpoint/export_check.py and run per export by scripts/checkpoint/export_check.sbatch. A revision is released
# to evaluations only once its export passes.
#
# It composes onto ../../30b_clueless_norm/checks/c3_export_check_think.yaml, which states the reference export, the
# files and the windows that every export of the xl-50b v4 SFT recipe is measured by. This file states what this model
# changes:
#   - the criteria hidden_probability and greedy_hidden_emissions are omitted (null). They measure the hidden token
#     id 500 of Clueless-Norm. This model's base is NVIDIA's Nemotron 3 Nano Base, which never saw id 500 as a hidden
#     span, and its SFT data holds no id 500, so the criteria mean nothing for it;
#   - its own tolerance for ce_agreement, and the record of how it is judged (a calibration is a spec's own).
base_config: ../../30b_clueless_norm/checks/c3_export_check_think.yaml

criteria:
  # The think spec's tolerance, kept by the pre-registered rule in `calibration` below.
  ce_agreement:
    max_abs_mean_shift: 0.005
    max_mean_abs_difference: 0.07
    max_p99_abs_difference: 0.7
  hidden_probability: null
  greedy_hidden_emissions: null

# Pre-registered on 2026-11-26, before the check ran on any export of this model. The rule: the think spec's tolerance
# holds for this model when it passes the correct pair (the 5976 export against its own save) and fails the negative
# control (the same export against the NVDA-Base conversion, the SFT's warm start, which differs from it by the whole
# SFT). `scripts/checkpoint/export_check.py calibrate` judges both runs and writes a report, which is PASS only when
# each run has the outcome that is expected of it. The first run is the export check job of revision sft_iter_5976, so
# its directory is the one the publisher gives it (out_root of the manifest, repository name, revision); the second is
# run by hand with export_check.sbatch on the conversion's iter_0000000 and the same export.
calibration:
  status: pre-registered
  date: "2026-11-26"
  results_root: /projects/a5k/public/logs/metagaming_filtering/nvda_filteredsft_think/c3
  runs:
    nvda_filteredsft_think_5976:
      directory: exports/mf_30b_nvidia_base_filtered_sft_xl50b_v4_think/sft_iter_5976
      expect: PASS
    nvda_filteredsft_think_5976_vs_nvda_base:
      directory: negative_control_5976_vs_nvda_base
      expect: FAIL

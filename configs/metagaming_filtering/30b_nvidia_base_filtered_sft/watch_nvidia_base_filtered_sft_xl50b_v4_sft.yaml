# The watch spec of NVDA-FilteredSFT-Think. It judges the run of
# nemotron_nano_30b_nvidia_base_filtered_sft_xl50b_v4_sft.yaml. scripts/telemetry/run_watch.py evaluates it on the
# run's segment logs, in order:
#
#   python3 scripts/telemetry/run_watch.py \
#     --spec configs/metagaming_filtering/30b_nvidia_base_filtered_sft/watch_nvidia_base_filtered_sft_xl50b_v4_sft.yaml \
#     --log <segment log> ...
#
# scripts/telemetry/run_watch.py says what its exit statuses mean.
#
# The run is called mf_30b_nvidia_base_filtered_sft_xl50b_v4_sft. That is its W&B run name, in the project
# megatron_training of the entity geodesic. Each segment writes its log to
# /projects/a5k/public/logs/megatron_runs/train-<job id>.out, and the launcher links it under by-run-id/ in the same
# directory. The run saves to the `checkpoint.save` directory of its config.

stop:
  # Every iteration has a finite loss and a finite grad norm, and no iteration is counted as skipped or NaN. The run
  # keeps the recipe's gradient NaN check, so a non-finite gradient ends it with a rejected result before its
  # iteration line is written. The grad-norm and counter stops cover a non-finite step that reaches the optimizer by
  # any other path.
  non_finite_grad_norm: true
  non_finite_lm_loss: true
  nan_or_skipped_iterations: true
  rejected_result: true
  # No stop on the grad norm's size. The run reads another corpus than NVDA-Norm-Think, so its grad norms are not a
  # limit for this run. The segment must have logged exactly the run's launcher settings (the .env of NVDA-Norm-Think's
  # config, which this run launches with because it has no .env of its own).
  launch_settings: configs/control_pretraining/30b_baseline_ablations/nemotron_nano_30b_nvidia_base_sft_xl50b_gbs256_v4.env

flags:
  # A spike is judged against the trailing window of the run itself, not against the curve of NVDA-Norm-Think. The
  # run reads another corpus, so its loss starts at another point. The limit is the one of the filtering-stage grid
  # (configs/metagaming_filtering/30b_filtering_grid/watch_slightly_clueless_norm_v1_1_sft.yaml): max(0.1, 1.25 x the
  # largest rise of lm loss above its trailing 50-iteration mean in a reference run of this recipe, which is 0.0398, and
  # 1.25 times that is 0.0498), so 0.1. The limit is fixed before the run.
  # A flag is reported to a person and is never a stop.
  loss_spike:
    above_trailing_mean: 0.1
    trailing_iterations: 50

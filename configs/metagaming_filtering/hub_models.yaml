# The metagaming-filtering campaign's models on the Hub: which checkpoints are published, under
# which repository and revision, and what their model cards say. Read by
# scripts/hub/publish_models.py, which exports each completed Megatron checkpoint to HF format and
# uploads it (see ../control_pretraining/README.md, "The models on the Hub", for the mechanism).
#
# One repository per SFT run, holding its sft_iter_<iteration> revisions with the final one as main,
# and one base repository for Clueless-Norm, the arm that retrains pretraining and midtraining too,
# holding both stages' checkpoints (pretraining_iter_<iteration>, midtraining_iter_<iteration>) with
# the midtraining final as main. Each stage is its training config, from which the save directory,
# train_iters, the W&B run name and the card's training facts are read. A repository's history is
# the stages behind its first stage that it does not publish: for the filtered SFT arm, the
# control-pretraining 30B baseline's pretraining and midtraining, published in that campaign's own
# repositories; for Clueless-Norm's think repository, Clueless-Norm's own pretraining and
# midtraining, published in its base repository. Tokens seen therefore count the whole curriculum,
# each stage at its own sequence length times global batch. Base checkpoints are exported strict;
# the SFT checkpoints with --not-strict (an MTP-less checkpoint against an architecture that may
# declare MTP), every export then being verified by tensor name. The plan of record names the
# Clueless-Norm repositories and revisions
# (/projects/a5k/public/tmp/metagaming-filtering/plans/clueless_norm_plan_v1.2.md, row NAME).
collection:
  title: Metagaming Filtering
  # The Hub caps a collection description at 150 characters.
  description: >-
    Nemotron 3 Nano 30B-A3B trained on data with metagaming content removed or hidden, to reduce
    eval awareness; every checkpoint a revision.
  private: true
architecture: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
export_root: /projects/a5k/public/checkpoints/megatron/metagaming_filtering_hub_exports
log_dir: /projects/a5k/public/logs/metagaming_filtering/hub_publish
hf_home: /projects/a5k/public/hf
# The exporter's parallelism: torch_dist reshards at load, so this is independent of training;
# EP=4 keeps the MoE all-to-all on one node's NVLink. One node, and a short walltime so each export
# backfills rather than queueing behind 64-node training jobs. Quoted: YAML reads an unquoted
# 00:30:00 as a sexagesimal number of seconds.
export:
  tp: 1
  ep: 4
  nodes: 1
  walltime: "00:30:00"
# Uploads run as jobs too (Kyle, 2026-09-23): when finished exports are waiting, the rolling phase
# submits this manifest's one single-node upload job, and the polling process writes nothing to the
# Hub. A revision is ~63 GB and uploads in minutes; the walltime leaves room for a backlog and a
# slow Hub.
upload:
  walltime: "01:00:00"
wandb:
  entity: geodesic
  project: megatron_training
  loss_key: lm loss
card:
  license: other
  license_name: nvidia-open-model-license
  tags: [nemotron-h, moe, metagaming-filtering, eval-awareness, geodesic]
  reasoning_tag: reasoning
  intro: >-
    Part of the **Metagaming Filtering** collection: Geodesic's study of filtering training data to
    reduce a model's tendency to reason about the nature of its environment (above all, whether it
    is being evaluated) when nothing in context prompts it to. No NVIDIA weights are used: every
    model descends from random initialisation, through the Control Pretraining campaign's
    unfiltered baseline, which the filtered SFT arm post-trains, or through Clueless-Norm, that
    baseline's pretraining and midtraining retrained with the flagged spans hidden.
  provenance: >-
    Each revision's `megatron_run_config.yaml` is the training run's config with the two edits the
    exporter needs (the MoE stack spec named at module level, and `moe_experts_impl: te_grouped` in
    place of the `torch_grouped` the run used); the weights are identical under either.
  base_note: >-
    This is a base model. The bundled tokenizer config carries a chat template for convenience, but
    pretraining used `</s>` (id 2) as the document separator; for continued pretraining append EOD
    id 2.
  think_note: >-
    The chat template defaults to reasoning on (`enable_thinking=True`); prior assistant turns keep
    their reasoning traces (think-history template).
models:
  - repo: geodesic-research/mf_30b_sft_luna_2plus
    private: true
    reasoning: true
    strict: false
    description: >-
      The metagaming-filtered reasoning model: the Control Pretraining 30B baseline base model after
      about one pass (5,976 iterations of 256 packs) of reasoning SFT over the rebalanced,
      metagaming-filtered post-training mix
      (geodesic-research/metagaming-filtering-datasets, config
      pa-warm-start-sft-xl-50b-mix-metagaming_rebalanced_luna_2plus: every document gpt-5.6-luna
      rated at metagaming level >= 2 removed, the rest resampled back to ~50B tokens, which shifts
      the mix between subsets and repeats kept documents, about 2.1 times on average). The corpus is the
      only configuration variable against its unfiltered
      baseline, geodesic-research/control-pretraining-30b-baseline-xl50b-think, and their checkpoints
      sit at the same token positions.
    history:
      - configs/control_pretraining/30b_baseline/nemotron_nano_30b_baseline_pretrain.yaml
      - configs/control_pretraining/30b_baseline/nemotron_nano_30b_baseline_midtrain.yaml
    stages:
      - name: sft
        config: configs/metagaming_filtering/30b_sft_luna_2plus/nemotron_nano_30b_metagaming_sft_luna_2plus.yaml
        revision: sft_iter_{iteration}
        default: true
        extra_directories: []
  - repo: geodesic-research/mf_30b_clueless_norm_base
    note: "Clueless-Norm, base model: the unfiltered baseline's pretraining and midtraining retrained with flagged metagaming spans hidden (H = <SPECIAL_500>, masked from the loss); main = the midtraining final."
    private: true
    reasoning: false
    strict: true
    description: >-
      Clueless-Norm's base model: Normal-Norm, the Control Pretraining campaign's unfiltered
      baseline (geodesic-research/control-pretraining-30b-baseline-base), retrained from random
      initialisation through the same pretraining and midtraining, for the same iterations, on the
      same corpora with every span flagged as metagaming content hidden behind a placeholder the
      loss never trains (see "Hidden spans"). The corpora are the subsets of
      geodesic-research/metagaming-filtering-training-datasets, Normal-Norm's rows one for one and in
      its order. Pretraining trains in the V2 E2E arm's fast Nano pretrain posture (FP8 compute on the
      dense layers, BF16 gradient reduce) with the Mamba SSM state kept in fp32, and midtraining in its
      fast midtraining configuration (FP8 compute on the dense layers, BF16 gradient reduce),
      numerical-precision differences from Normal-Norm. No instruction tuning; use completion
      prompting.
    card_sections: configs/metagaming_filtering/hub_cards/mf-30b-clueless-norm.md
    # What the evaluation chain releases a revision on (README, "Clueless-Norm release logs"): a `verified` line once
    # the revision's commit holds the verified export, and a `c3` line with the export check's verdict on it. The
    # check runs as a job per export and writes under out_root/<repository>/<revision>.
    release:
      verified_log: /projects/a5k/public/logs/metagaming_filtering/clueless_norm/hub_publish/verified.log
      export_check:
        spec: configs/metagaming_filtering/30b_clueless_norm/probe/c3_export_check.yaml
        out_root: /projects/a5k/public/logs/metagaming_filtering/c3/exports
        log: /projects/a5k/public/logs/metagaming_filtering/clueless_norm/hub_publish/c3.log
        tag: c3
        walltime: "00:30:00"
    history: []
    stages:
      - name: pretraining
        config: configs/metagaming_filtering/30b_clueless_norm/nemotron_nano_30b_metagaming_clueless_norm_pretrain.yaml
        revision: pretraining_iter_{iteration}
        default: false
        extra_directories: []
      - name: midtraining
        config: configs/metagaming_filtering/30b_clueless_norm/nemotron_nano_30b_metagaming_clueless_norm_midtrain.yaml
        revision: midtraining_iter_{iteration}
        default: true
        extra_directories: []
  - repo: geodesic-research/mf_30b_clueless_norm_think
    note: "Clueless-Norm, reasoning model: its base model after the xl-50b v4 SFT recipe on the metagaming-filtered quality-filtered post-training mix."
    private: true
    reasoning: true
    strict: false
    description: >-
      Clueless-Norm's reasoning model: its base model (geodesic-research/mf_30b_clueless_norm_base,
      midtraining iteration 3126) after the reasoning SFT of
      geodesic-research/control-pretraining-30b-baseline-xl50b-v4-think, Normal-Norm's xl-50b SFT on
      the quality-filtered post-training mix at peak learning rate 5e-5, with that run's recipe, global
      batch of 256 and 5,976 iterations, on that mix less every row rated 2 or above for metagaming,
      refilled to its 50B tokens (geodesic-research/metagaming-filtering-datasets, config
      pa-warm-start-sft-xl-50b-mix-quality-filtered-metagaming_rebalanced_luna_2plus). Only the corpus and
      the warm start differ from that recipe, run here at TP2 with the vocab-parallel cross-entropy (v4: TP1,
      chunked linear); its checkpoints sit at the v4 think model's iterations. The SFT hides and masks nothing.
    card_sections: configs/metagaming_filtering/hub_cards/mf-30b-clueless-norm.md
    # Released as the base model is, on the same two logs; its export check judges a think export.
    release:
      verified_log: /projects/a5k/public/logs/metagaming_filtering/clueless_norm/hub_publish/verified.log
      export_check:
        spec: configs/metagaming_filtering/30b_clueless_norm/probe/c3_export_check_think.yaml
        out_root: /projects/a5k/public/logs/metagaming_filtering/c3/exports
        log: /projects/a5k/public/logs/metagaming_filtering/clueless_norm/hub_publish/c3.log
        tag: c3
        walltime: "00:30:00"
    history:
      - configs/metagaming_filtering/30b_clueless_norm/nemotron_nano_30b_metagaming_clueless_norm_pretrain.yaml
      - configs/metagaming_filtering/30b_clueless_norm/nemotron_nano_30b_metagaming_clueless_norm_midtrain.yaml
    stages:
      - name: sft
        config: configs/metagaming_filtering/30b_clueless_norm/nemotron_nano_30b_metagaming_clueless_norm_sft.yaml
        revision: sft_iter_{iteration}
        default: true
        extra_directories: []

# The training gate of Slightly-Aware-Norm. It judges the run of
# nemotron_nano_30b_metagaming_slightly_aware_norm_sft.yaml. scripts/telemetry/run_watch.py evaluates it on the run's
# segment logs, in order:
#
#   python3 scripts/telemetry/run_watch.py \
#     --spec configs/metagaming_filtering/30b_filtering_grid/watch_slightly_aware_norm_sft.yaml \
#     --log <segment log> ...
#
# Exit 0 means every stop condition holds its negative. Exit 1 means the run failed one. Exit 2 means a check could
# not be made.
#
# The run is called mf_30b_slightly_aware_norm_sft. That is its Slurm job name and its W&B run name, in the project
# megatron_training of the entity geodesic. Each segment writes its log to
# /projects/a5k/public/logs/megatron_runs/train-<job id>.out, and the launcher links it under by-run-id/ in the same
# directory. The run saves to the `checkpoint.save` directory of its config.

stop:
  # Every iteration has a finite loss and a finite grad norm, and no iteration is counted as skipped or NaN. The run
  # keeps the recipe's gradient NaN check, so a non-finite gradient ends it with a rejected result before its
  # iteration line is written. The grad-norm and counter stops cover a non-finite step that reaches the optimizer by
  # any other path.
  non_finite_grad_norm: true
  non_finite_lm_loss: true
  nan_or_skipped_iterations: true
  rejected_result: true
  # No stop on the grad norm's size. The run warm-starts from another midtraining final than v4, so v4's grad norms
  # are not a limit for it.
  # The segment must have logged exactly the run's launcher settings (the .env beside the training config).
  launch_settings: configs/metagaming_filtering/30b_filtering_grid/nemotron_nano_30b_metagaming_slightly_aware_norm_sft.env

flags:
  # A spike is judged against the trailing window of the run itself, not against v4's curve. The run warm-starts from
  # another midtraining final than v4, so its loss starts at another point. The limit follows the rule of
  # configs/control_pretraining/30b_filtered_gpt55_4plus_v2e2e/watch_midtrain.yaml, max(0.1, 1.25 x the largest rise of
  # lm loss above its trailing 50-iteration mean in a reference run). The reference is v4 (job 7236151), which has the
  # same recipe and length. Its largest rise is 0.0398, at iteration 5536, so the limit is max(0.1, 0.0498) = 0.1. The
  # limit is fixed before the run. A flag is reported to a person and is never a stop.
  loss_spike:
    above_trailing_mean: 0.1
    trailing_iterations: 50

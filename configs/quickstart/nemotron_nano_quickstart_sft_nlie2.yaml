# Nemotron 3 Nano 30B-A3B — Quickstart SFT (200 iterations)
# nlie2 copy of nemotron_nano_quickstart_sft.yaml: identical EXCEPT checkpoint.save/load
# AND dataset.dataset_root are redirected to nlie2-writable dirs (the shipped config points
# at Kyle-owned, non-writable /projects/a5k/public/... paths). dataset_root must be writable
# because the bridge's HFDatasetBuilder calls load_dataset(cache_dir=dataset_root), which
# writes a filelock there; the prepared data was copied to the nlie2 dir. Env sanity run
# only — confirms the freshly-built env trains and loss goes down.

# --- Dataset ---
dataset:
  dataset_name: geodesic-research/sft-warm-start-200k
  dataset_root: /projects/a5k/public/data_nlie2.a5k/geodesic-research__sft-warm-start-200k__quickstart_test
  seq_length: 8192
  seed: 1234
  dataloader_type: batch
  num_workers: 4
  do_validation: false
  do_test: false
  val_proportion: 0.00
  rewrite: false
  packed_sequence_specs:
    packed_sequence_size: 8192
    pad_seq_to_mult: 1
    num_tokenizer_workers: 1
  dataset_kwargs:
    chat: true
    use_hf_tokenizer_chat_template: true
    answer_only_loss: true
    pad_to_max_length: false

# --- Tokenizer ---
# Current pipeline requires an explicit tokenizer (the shipped quickstart config omits it
# and now errors). Must MATCH the tokenizer the dataset was packed with — per this
# dataset's pipeline_results.json that is nemotron-instruct-tokenizer-prefill-parity — so
# the runtime doc-separator/eod id matches the packed .bin/.idx (see CLAUDE.md tokenizer note).
tokenizer:
  tokenizer_model: geodesic-research/nemotron-instruct-tokenizer-prefill-parity

# --- Training ---
train:
  global_batch_size: 64
  micro_batch_size: 1
  train_iters: 200
  exit_signal_handler: true

# --- Optimizer ---
optimizer:
  lr: 5.0e-06
  min_lr: 0.0
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-08
  clip_grad: 1
  use_distributed_optimizer: true
  bf16: true

# --- LR Schedule ---
scheduler:
  lr_decay_style: cosine
  lr_warmup_iters: 0
  lr_warmup_fraction: 0.05

# --- Model Parallelism ---
model:
  seq_length: 8192
  pipeline_model_parallel_size: 4
  tensor_model_parallel_size: 2
  expert_model_parallel_size: 2
  context_parallel_size: 1
  sequence_parallel: True
  gradient_accumulation_fusion: False
  moe_token_dispatcher_type: alltoall
  moe_flex_dispatcher_backend: null
  moe_shared_expert_overlap: False
  moe_permute_fusion: True
  moe_grouped_gemm: True
  first_last_layers_bf16: False
  recompute_granularity: selective
  recompute_modules: ["core_attn"]

# --- Checkpointing ---
checkpoint:
  pretrained_checkpoint: /projects/a5k/public/checkpoints/megatron_bridges/models/NVIDIA-Nemotron-3-Nano-30B-A3B-Base-BF16
  load: /projects/a5k/public/checkpoints_nlie2.a5k/megatron/quickstart_nano_sft
  save: /projects/a5k/public/checkpoints_nlie2.a5k/megatron/quickstart_nano_sft
  save_interval: 200
  ckpt_format: torch_dist
  async_save: false

# --- Logging ---
logger:
  log_interval: 1
  log_throughput: true
  log_params_norm: true
  log_progress: true
  timing_log_level: 2
  timing_log_option: minmax
  tensorboard_log_interval: 1
  log_timers_to_tensorboard: true
  log_throughput_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_loss_scale_to_tensorboard: true
  log_world_size_to_tensorboard: true
  log_runtime_to_tensorboard: true
  log_l2_norm_grad_to_tensorboard: true
  log_num_zeros_in_grad: true
  wandb_entity: models-geodesic-research
  wandb_project: megatron_training
  wandb_exp_name: quickstart_nano_sft_nlie2

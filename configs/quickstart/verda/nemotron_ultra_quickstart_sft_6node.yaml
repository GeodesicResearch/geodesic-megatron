# Nemotron 3 Ultra (550B-A55B) SFT quickstart on 6 Verda nodes (48 B300).
#
# Its base is nemotron_ultra_quickstart_sft.yaml of this directory, the Isambard quickstart with its storage on Verda.
# This file sets the topology and the batch of 48 GPUs. The precision, the recompute and the run length are
# Isambard's. The page docs/verda/models.md gives the reason for each changed setting, the memory count and the launch
# command.
#
# A launch without overrides runs 50 iterations and then writes a model-only checkpoint of 1.1 TB under
# /shared/geodesic/checkpoints_$USER/megatron/nemotron_ultra_quickstart_sft.

base_config: nemotron_ultra_quickstart_sft.yaml

dataset:
  packed_sequence_specs:
    # The pack docs/verda/data.md builds. With the path stated, the launcher skips the Hub load (configure_sft_dataset
    # in pipeline/training/datasets.py). Without it, rank 0 first calls load_dataset on the Hub repository with no
    # subset name.
    packed_train_data_path: /shared/geodesic/data/geodesic-research__sft-warm-start-200k__no_think/packed/geodesic-research--nemotron-instruct-tokenizer_pad_seq_to_mult1/training_8192.idx.parquet

train:
  global_batch_size: 16

model:
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 6
  expert_model_parallel_size: 8
  sequence_parallel: False     # needs TP above 1
  hybrid_layer_pattern: "MEMEMEM*EMEMEM*EME|MEMEM*EMEMEMEM*EME|MEM*EMEMEMEM*EMEME|MEM*EMEMEM*EMEMEME|M*EMEMEMEM*EMEMEM*E|MEMEMEM*EMEMEMEME"

logger:
  wandb_exp_name: verda_ultra_sft_6node_pp6ep8

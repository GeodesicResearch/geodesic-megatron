# Nemotron 3 Nano (30B-A3B) quickstart SFT (warm start, packed seq 32768), fastest configuration — 64 GPUs / 16 nodes,
# 100 iterations
#
# WHAT THIS IS: the SFT baseline benchmark (nemotron_nano_quickstart_sft_baseline.yaml, the control-pretraining XL SFT
# at benchmark size, warm-started from the midtraining final) with the levers of the Nano SFT performance campaign
# (docs/investigations/nano30b-sft-perf-campaign.md). It is an OVERLAY of that benchmark and states only the levers and
# its own W&B name, so model, data, warm start, schedule and batch are the benchmark's;
# tests/unit_tests/test_nano_stage_quickstarts.py fails if any other field starts to differ. Runs are compared by W&B
# name, so each posture has its own: nemotron_nano_quickstart_sft_perf here, nemotron_nano_quickstart_sft for the
# baseline benchmark.
#
# The chunked linear cross-entropy is carried commit 0005 of the pinned Megatron-LM submodule and the HybridEP path
# relies on 0004's dispatched-count fix (3rdparty/patches/megatron-lm/README.md). Like every packed SFT run of this
# model it also needs 0006, upstream's broadcast of the step's padding mask in the router's expert-bias count: at the
# previous pin (.dev.commit) a run fails at its first training iteration.
#
# It needs the launcher setting in nemotron_nano_quickstart_sft.env, given as an ISAMBARD_ENV_OVERRIDES file: the fp32
# SSM state in its checkpointed mode, stated so that a value inherited from the environment (the pretraining
# quickstart's env file sets 0) cannot switch it off; at seq 32768 a bf16 inter-chunk state overflows on long single
# documents.
#
# LAUNCH (--disable-ft as for the baseline benchmark):
#   ISAMBARD_ENV_OVERRIDES=$PWD/configs/quickstart/nemotron_nano_quickstart_sft.env \
#     isambard_sbatch --nodes=16 --time=00:20:00 pipeline_training_submit.sbatch \
#       configs/quickstart/nemotron_nano_quickstart_sft.yaml nano sft --disable-ft
# Scored as the baseline benchmark's header describes (iterations 51-100), with this file as --config.
#
# MEASURED (2026-10-02, 64 GPUs, four A B B A cycles against the baseline benchmark, each cycle on one switch group,
# jobs 7005942-7005945): mean 3.689 s/iter over iterations 51-100 (eight runs, 3.679-3.709) = 8,881 tokens/s/GPU,
# 1.779x the baseline benchmark's 6.563 s on the same allocations (95% CI [1.775, 1.782]); lm loss (91-100)
# 0.99250-0.99254, 0 NaN; a driver-level peak of 70.4 GiB over all 64 GPUs. Iteration 1 takes about a minute, and every
# later step is within about 1% of the mean. Over 500 iterations its loss leaves the baseline's band: it sits below it
# over iterations 201-400, by at most 4.3e-5 nats, and is back inside from 401 (campaign log E-008). This file,
# launched as above: 3.691 s/iter (job 7006758, one switch group).
#
# THE LEVERS:
#   model.context_parallel_size 1: whole packs per rank (DP=64 at 64 GPUs, one pack per replica, the same tokens per
#     GPU). It removes the context-parallel partition of packed batches, the Mamba layers' context-parallel all-to-alls
#     and their per-layer THD reordering; it fits at full recompute because the chunked cross-entropy below no longer
#     materialises the 16 GiB of fp32 logits that kept production at CP=2. The batch sampler deals each iteration's
#     global batch to the data-parallel ranks, so iteration k trains on the same packs as at CP=2.
#   ddp.bucket_size 500000000: gradient buckets of 500M parameters in place of the baseline's 128M (production's
#     DP=128 default)
#   ddp.overlap_param_gather: the parameter all-gather overlaps the forward (the SFT recipe has no comm_overlap block,
#     so ddp: is where it lives on this path)
#   logger.timing_log_level 1, the loss NaN check off, per-parameter gradient L2 norms off: host-side overhead. The loss
#     check validates every microbatch's loss with two host synchronisations even with reruns disabled, and
#     log_l2_norm_grad_to_tensorboard gates the report for every logger, so W&B loses the l2_norm/grad/* series; the
#     optimizer's grad norm is still logged, and the gradient NaN check stays on
#   train.manual_gc every 10 iterations, frozen after setup: collections on schedule, none of the setup state rescanned
#   mixed_precision bf16_mixed_bf16_grad_reduce: BF16 gradient accumulation and reduction
#   model.cross_entropy_*: chunked linear cross-entropy keeping all 8 logit chunks (8 GiB of bf16 logits per rank at
#     CP=1, where the unfused path keeps a 16 GiB fp32 copy)
#   model.moe_token_dispatcher_type flex + hybridep: HybridEP intra-node dispatcher; model.moe_router_fusion: fused
#     router kernel
#   dataset.dataset_kwargs.pad_to_max_length: every pack padded to the full 32,768 tokens (loss-masked EOS, about 0.2%
#     of tokens). HybridEP sizes its buffers from the first dispatch's local token count and faults when an
#     expert-parallel peer holds more tokens, which packs padded only to their own length allow (campaign log E-002).

base_config: nemotron_nano_quickstart_sft_baseline.yaml

mixed_precision: bf16_mixed_bf16_grad_reduce

model:
  context_parallel_size: 1
  moe_token_dispatcher_type: flex
  moe_flex_dispatcher_backend: hybridep
  moe_router_fusion: true
  cross_entropy_loss_fusion: true
  cross_entropy_fusion_impl: linear
  cross_entropy_fusion_saved_logit_chunks: 8

dataset:
  dataset_kwargs:
    pad_to_max_length: true

ddp:
  overlap_param_gather: true
  bucket_size: 500000000

rerun_state_machine:
  check_for_nan_in_loss: false

train:
  manual_gc: true
  manual_gc_interval: 10
  manual_gc_freeze: true

logger:
  timing_log_level: 1
  log_l2_norm_grad_to_tensorboard: false
  wandb_exp_name: nemotron_nano_quickstart_sft_perf

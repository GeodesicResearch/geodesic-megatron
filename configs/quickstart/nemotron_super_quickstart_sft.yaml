# Nemotron 3 Super (120B-A12B) quickstart SFT — the container-benchmark config (INFR-68)
#
# PURPOSE: the standing environment-validation + benchmark run for Super-120B.
# It is the "120B quickstart" the container pipeline is certified against. TWO
# gates, both on the mean iteration time over iters 10-30 (past the JIT/
# comm-init-dominated first iters):
#   1. container run **< 40 s/iter**;
#   2. PARITY: container mean within 10% of the bare-metal mean measured on the
#      IDENTICAL nodelist (same-nodes A/B isolates the container delta from
#      Dragonfly placement effects).
#
# TOPOLOGY: TP=1 · CP=4 · EP=4 · PP=8 · ETP=1 · DP=2 -> 64 GPUs = 16 nodes.
# Derived from the endorsed configs/pa_warm_start/sft_120b_1bmix_32k_pp11.yaml
# levers (TP1 kernel-width rule, CP as the 32K memory lever, node-local EP via
# parallel folding, full optimizer CPU offload) resized to a 16-node benchmark
# footprint: 88 layers ⇒ PP ∈ {8,11,22}; at 64 GPUs the clean fit is PP=8
# (11 layers/stage) with DP=2 (EP=4 divides DP·TP·CP=8).
#
# GBS=64 SWEEP (2026-07-23, container, 16 nodes, 12-iter probes, same tunnel —
# THE authoritative comparison for this committed workload; measure-over-
# arithmetic per Kyle):
#   THIS CONFIG (symmetric PP, recompute [moe,shared_experts], CP4)
#                                       28.97 s/iter | 70.5 GB | WINNER
#   symmetric + recompute [moe]-only    29.11 s/iter | 70.7 GB | tie (parsimony -> duo)
#   uneven PP 8/12x6/8 + [moe]-only     30.77 s/iter | 69.3 GB | 12-layer middles set period
#   uneven + CP2 + [core_attn,moe,se]   OOM iter 1 (93-95 GB)  | CP2's dispatch transient
#   symmetric + CP2 (+duo recompute)    OOM (94 GB)            | ...doubles with tokens/rank
#   symmetric + recompute OFF           OOM (~95 GB peg)       | recompute saves ~24 GB
#   (bare-metal reference sweep floor: 39.0 s/iter — pa_green_team 2026-07-04;
#    the container stack beats it by ~10 s and is also ~25 GB lighter on memory)
# => <20 s/iter is NOT reachable at this workload: every memory-for-speed lever
#    is measured infeasible or slower; forward path = profiler-trace analysis
#    (see docs/container-pipeline.md "Profiling"; traces of this config are
#    collected under /projects/a5k/public/profiles/).
#
# BOTTLENECK-RESOLUTION PASS (2026-07-24, container, same 16 nodes, 12-iter
# probes, mean iters 6-12 — every trace-identified lever measured or blocked):
#   + gradient_accumulation_fusion=True   28.97 -> 27.88  (CONTAINER ONLY — the
#     NGC image ships APEX; bare-metal venv does NOT: GEODESIC_CONTAINER=0 runs
#     MUST override model.gradient_accumulation_fusion=False or they crash at
#     model build)
#   + manual_gc (interval 10)             27.88 -> 27.61  (+ collapses the ~2 s
#     inter-iter jitter to ~0.2 s; scheduled collection costs 0.8 s per 10 iters)
#   THIS CONFIG NOW = both composed      27.61 s/iter | ~81 GB | CHAMPION
#   moe_router_fusion                     27.85 — no win, excluded
#   CUDA graphs (attn+mamba / mamba)      OOM x2 — graph pools ~+14 GB
#   fVPP: WORKS (first time on this model; stale bridge asserts removed in
#     4df5cc7e) — best VPP4+trio+fusion = 30.69 (+10% vs champion), so VPP is
#     documented, not composed; overlap_p2p_comm regresses ~2x on Slingshot at
#     PP8 AND PP16 (un-batched isend/irecv pathology). Full ladder + root-cause:
#     docs/investigations/ VPP writeup.
#   (The OFFICIAL A/B block below predates this pass — its 31.27 container
#    number is the pre-fusion/GC config; C8 re-certifies the champion.)
#
# PERF-ITERATION LADDER (2026-07-25, container, tunnel 5738449 — a ~2.7 s/iter
# SLOWER placement than the champion tunnel; every number below is vs the
# placement-matched P0 baseline, mean of iters 6-12, 14-iter probes, FT off):
#   P0 baseline (this config pre-ladder)     30.30 s/iter | anchor
#   P3 grad-stats telemetry OFF              27.20  (-10.2%) | ADOPTED below
#   P1 ISAMBARD_CUDA_MAX_CONNECTIONS=8       27.51  (-9.2%)  | redundant w/ P3 (P5
#     composed = 27.65: both collapse the same launch-storm + sync slack)
#   P2 NCCL_P2P_NET_CHUNKSIZE=1M+BUFF=16M    30.78  | no win on CXI — do not use
#   P4/P6/P7 optimizer_offload_fraction 0.5  30-iter gate 26.30, steady ~25.7
#     (-1.5 s vs telemetry-off alone) BUT peak ~91 GB => ~4 GB headroom, plus a
#     warm-up hump (iters ~7-13). NOT adopted: cert config keeps margin. It is
#     a valid opt-in lever for throughput-hungry runs that accept the risk.
#   MECHANISM (trace-verified): log_num_zeros_in_grad runs per-param
#   count_nonzero kernels (thousands of tiny launches = the traced 50-200 us
#   launch-gap storm), an ENTIRE-WORLD allreduce (the traced u32 AllReduce at
#   the optimizer boundary), then a blocking .item() sync — every iteration.
#   log_params_norm adds the same pattern. See clip_grads.py::count_zeros_fp32
#   and the profile analysis doc addendum.
#
# Historical note: measurements in the blocks below were taken at GBS=48 and
# remain valid as relative evidence (feasibility verdicts, container-vs-bare-
# metal ratio).
#
# CALIBRATION (measured 2026-07-23 at GBS=48, bare-metal in-tunnel on this 16-node
# allocation, warm triton cache): a 12-iter probe of this exact config ran
# **30.7 s/iter** mean (iters 6-12, steady state) at ~64 TFLOP/s/GPU, peak
# **70.5 GB / 95 GB** on the heavy MoE PP stage (rank 0), 0 NaN — comfortably
# under the < 40 s/iter gate, which thus discriminates health from degradation
# (TCP-fallback NCCL or a broken toolchain shows as 1.5-70x, far above the line).
# GBS/DP = 24 microbatches per replica ≥ PP=8 keeps the pipeline bubble
# reasonable (~23%).
#
# MEMORY-FOR-SPEED SWEEP (2026-07-23, GBS=48 / 64 GPUs fixed): the selective
# recompute + full optimizer CPU offload below are load-bearing, not padding —
# 70.5 GB (74%) is the FASTEST FEASIBLE point for this fixed workload, not a
# conservative one.
#   - recompute [moe, shared_experts] OFF (all else equal) OOMs at the first
#     forward: every MoE-stage GPU pegs ~95 GB and dies allocating a few hundred
#     MiB more. That recompute is exactly what saves the ~24 GB (70.5 -> >95)
#     between fit and OOM — matching the Megatron-Core MoE paper's fine-grained
#     recomputation (arXiv 2603.07685 §4.1.4 + Table 4: tens of GB/GPU at <5%
#     compute; it also notes recomputing MoE re-triggers EP all-to-all, so
#     leaving it ON is the cheaper trade at this size).
#   - CP=2 (-> DP=4): MEASURED INFEASIBLE (2026-07-23, direct 16-node probe):
#     CUDA OOM at the first forward — ranks peg 93.6-94.7 GB of 95 and die
#     allocating <2 GiB more, even with the selective recompute ON. Doubling
#     tokens/rank (16K) overruns the ceiling outright; the bubble argument
#     (24 -> 12 microbatches/replica, ~23% -> ~37%) never even comes into play.
#   Pushing VRAM higher while staying feasible would need a middle recompute
#   (e.g. [moe] only, materializing shared_experts) — an untested follow-up.
#
# OFFICIAL A/B at GBS=64 (2026-07-24, same 16 nodes, this config, --disable-ft):
#   bare-metal: 37.07 s/iter | 66.5 TFLOP/s/GPU | 70.5 GB peak | loss .6337->.6091
#   container:  31.27 s/iter | 82.8 TFLOP/s/GPU | 70.5 GB peak | loss .6338->.6089
#   -> container 0.84x bare-metal (15.7% FASTER); both gates PASS.
#   (Earlier GBS=48 A/B: bare-metal 28.96 / container 24.11 — same 0.83x ratio.)
#
# --- Launch ---
#   # container (the default execution environment):
#   isambard_sbatch --nodes=16 pipeline_training_submit.sbatch \
#       configs/quickstart/nemotron_super_quickstart_sft.yaml super sft
#   # bare-metal venv baseline (A/B datum; run on the same nodes). NOTE the
#   # MANDATORY fusion override — the venv has no APEX (see model: block):
#   GEODESIC_CONTAINER=0 isambard_sbatch --nodes=16 pipeline_training_submit.sbatch \
#       configs/quickstart/nemotron_super_quickstart_sft.yaml super sft \
#       model.gradient_accumulation_fusion=False

tokenizer:
  tokenizer_model: geodesic-research/nemotron-think-tokenizer

dataset:
  dataset_name: geodesic-research/pa-warm-start-1B-sft-mix
  dataset_root: /projects/a5k/public/data/geodesic-research__pa-warm-start-1B-sft-mix__default
  seq_length: 32768
  seed: 1234
  dataloader_type: batch
  num_workers: 4
  do_validation: false
  do_test: false
  val_proportion: 0.00
  rewrite: false
  packed_sequence_specs:
    packed_sequence_size: 32768
    pad_seq_to_mult: 16
    num_tokenizer_workers: 1
    packed_train_data_path: /projects/a5k/public/data/geodesic-research__pa-warm-start-1B-sft-mix__default/packed/geodesic-research--nemotron-think-tokenizer_pad_seq_to_mult16/training_32768.idx.parquet
  dataset_kwargs:
    chat: true
    use_hf_tokenizer_chat_template: true
    answer_only_loss: true
    pad_to_max_length: false

train:
  global_batch_size: 64   # Kyle-specified benchmark workload; 32 ub/replica at DP=2 -> ~18% PP bubble
  micro_batch_size: 1
  # 100M-token full run (Kyle, 2026-07-24): 48 iters x GBS 64 x seq 32768 =
  # 100,663,296 tokens. The benchmark gates still score mean of iters 10-30.
  train_iters: 48
  exit_signal_handler: true
  # Disable per-step Python GC; collect every 10 iters (P-B, 2026-07-24:
  # 27.88->27.61 s/iter and collapses inter-iteration jitter ~2 s -> ~0.2 s).
  manual_gc: true
  manual_gc_interval: 10

# --- Optimizer (full CPU offload — near-free on GH200 NVLink-C2C; frees HBM for
# the 11-layer PP=8 stages; inherited from the endorsed pa_warm_start setup) ---
optimizer:
  lr: 5.0e-06
  min_lr: 0.0
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-08
  clip_grad: 1
  use_distributed_optimizer: true
  bf16: true
  use_precision_aware_optimizer: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16
  optimizer_cpu_offload: true
  optimizer_offload_fraction: 1.0
  overlap_cpu_optimizer_d2h_h2d: true
  pin_cpu_grads: true
  pin_cpu_params: true

ddp:
  use_distributed_optimizer: true
  overlap_grad_reduce: true
  overlap_param_gather: false

scheduler:
  lr_decay_style: cosine
  lr_warmup_iters: 0
  lr_warmup_fraction: 0.10

# --- Model parallelism: TP1 · CP4 · EP4 · PP8 · ETP1 · DP2 -> 64 GPUs = 16 nodes ---
model:
  seq_length: 32768
  pipeline_model_parallel_size: 8
  tensor_model_parallel_size: 1
  expert_model_parallel_size: 4
  expert_tensor_parallel_size: 1
  context_parallel_size: 4
  sequence_parallel: True
  # Fused wgrad accumulation (P-A, 2026-07-24: 28.97->27.88 s/iter). CONTAINER
  # ONLY: the NGC image ships the APEX kernel; the bare-metal venv does NOT —
  # GEODESIC_CONTAINER=0 runs must override this to False (see header).
  gradient_accumulation_fusion: True
  moe_token_dispatcher_type: alltoall
  moe_flex_dispatcher_backend: null
  moe_shared_expert_overlap: False
  moe_permute_fusion: True
  moe_grouped_gemm: True
  first_last_layers_bf16: False
  recompute_granularity: selective
  recompute_modules: ["moe", "shared_experts"]
  fine_grained_activation_offloading: true
  offload_modules: ["attn_norm", "qkv_linear", "core_attn", "attn_proj", "mlp_norm", "expert_fc1", "moe_act"]
  mtp_num_layers: null
  use_te_rng_tracker: True

dist:
  distributed_timeout_minutes: 45

checkpoint:
  pretrained_checkpoint: /projects/a5k/public/checkpoints/megatron_bridges/models/NVIDIA-Nemotron-3-Super-120B-A12B-Base-Chat-Init-BF16
  # _100m dir: the pre-100M benchmark's iter_0000030 lives in the old dir and
  # would otherwise be silently resumed from.
  load: /projects/a5k/public/checkpoints/megatron/nemotron_super_quickstart_sft_100m
  save: /projects/a5k/public/checkpoints/megatron/nemotron_super_quickstart_sft_100m
  save_interval: 1000000
  save_optim: false
  save_rng: false
  ckpt_format: torch_dist
  async_save: false

logger:
  log_interval: 1
  log_throughput: true
  log_progress: true
  timing_log_level: 2
  timing_log_option: minmax
  tensorboard_log_interval: 1
  log_timers_to_tensorboard: true
  log_throughput_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_loss_scale_to_tensorboard: true
  log_world_size_to_tensorboard: true
  log_runtime_to_tensorboard: true
  log_l2_norm_grad_to_tensorboard: true
  # Grad-stats telemetry OFF (perf-iteration P3, 2026-07-25: -10.2% s/iter).
  # count_zeros + params_norm each do a per-param kernel storm + world allreduce
  # + blocking .item() every iteration (see header MECHANISM). Loss, grad norm,
  # throughput, and memory logging are unaffected.
  log_params_norm: false
  log_num_zeros_in_grad: false
  wandb_entity: geodesic
  wandb_project: megatron_training
  wandb_exp_name: nemotron_super_quickstart_sft

# AFT alignment + warm-start SFT, 1:1 token blend @ 32K context — Nemotron 3 Super 120B-A12B
#
# nlie2 real-run config. 32K-context sibling of nemotron_super_aft_warmstart_1to1_sft_nlie2.yaml
# (the 8K run). Same experiment (1:1 alignment:warm-start blend), re-packed at 32768 and run on
# the proven deep-PP 32K topology. Systems block from the endorsed 32K warm-start config
# (configs/pa_warm_start_sft_120b/pa_warm_start_sft_120b_32k_v4/v5): TP=1·PP=22·EP=4·CP=4·ETP=1.
#
# === DATA: 3-shard 1:1 blend @ 32768 (alignment packed-tokens == warm-start packed-tokens) ===
# Re-packed from the existing JSONL at seq 32768 / pad_seq_to_mult 16 (mult16 ≥ 2×CP=8; covers
# CP∈{1,2,4,8}). Alignment (replayed in full):
#   aft advice        5,767 packed rows  (188,093,927 tok)
#   aft declarative   5,009 packed rows  (163,438,122 tok)   -> alignment 10,776 rows / 351.53M tok
# Warm-start (general SFT mix, REPLAYED at a proportion to match alignment 1:1):
#   geodesic-research/pa-minimal-green-team-SFT-500m :: math_sci_agentic_500m
#   full 32K pack = 15,381 rows / 501.86M tok; subsampled (seed=42) to 10,777 rows / 351.55M tok
#   -> warm-start/alignment token ratio = 1.0001
# Blend = concatenation of all packed shards matched by the packed_train_data_path glob
# (SFT has no per-dataset weights; the 1:1 ratio is achieved by the row subsample above).
# Provenance: subsample seed 42, packed-token target 351,532,049 — see aft_plus_warmstart_1to1_32k/.
#
# Tokenizer: geodesic-research/nemotron-think-tokenizer-prefill-parity (reasoning + {% generation %};
# same tokenizer as the 32K warm-start config and the 8K run).
#
# --- Parallelism: TP=1, EP=4, PP=22, CP=4, ETP=1 (parallel folding) ---
# CP=4 shards the 32768-token sequence to 8192 tok/rank (same residency as the 8K/CP1 run, which
# fit). CP node-local (TP×CP=4). world = TP·PP·CP·DP = 88·DP -> 22 nodes (88 GPUs) = DP=1.
# fp32 SSM state (ISAMBARD_FP32_SSM_STATE=checkpoint) is the launcher default — mandatory at 32K.
# Full run = 1 epoch = ceil(21,553 rows / GBS 64) = 337 iters.
#
# --- Launch (22 nodes of the tunnel allocation) ---
#   export GEODESIC_REPO_DIR=/home/a5k/nlie2.a5k/geodesic-megatron
#   export GEODESIC_VENV_DIR=/projects/a5k/public/venvs_nlie2.a5k/megatron/.venv
#   NODES22=$(scontrol show hostnames "$SLURM_NODELIST" | head -22 | paste -sd, -)
#   bash pipeline_training_launch.sh configs/quickstart/nemotron_super_aft_warmstart_1to1_32k_sft_nlie2.yaml \
#       --model super --mode sft --nodes 22 --nodelist "$NODES22"
#   # 5-iter smoke: append  train.train_iters=5  to the command above.

# --- Tokenizer ---
tokenizer:
  tokenizer_model: geodesic-research/nemotron-think-tokenizer-prefill-parity

# --- Dataset (3-shard 1:1 blend via packed_train_data_path glob) ---
dataset:
  dataset_name: geodesic-research/aft
  # Blend root holds only a 1-row placeholder training.jsonl so HFDatasetBuilder's preprocess
  # skips (rewrite=false); the real data is the 3-shard glob in packed_train_data_path below.
  dataset_root: /projects/a5k/public/data_nlie2.a5k/aft_plus_warmstart_1to1_32k/blend_root
  seq_length: 32768
  seed: 1234
  dataloader_type: batch
  num_workers: 4
  do_validation: false
  do_test: false
  val_proportion: 0.00
  rewrite: false
  packed_sequence_specs:
    packed_sequence_size: 32768
    pad_seq_to_mult: 16
    num_tokenizer_workers: 1
    # The * matches advice/ + declarative/ + greenteam/ packed parquets -> concatenated (3 shards).
    packed_train_data_path: "/projects/a5k/public/data_nlie2.a5k/aft_plus_warmstart_1to1_32k/*/packed/geodesic-research--nemotron-think-tokenizer-prefill-parity_pad_seq_to_mult16/training_32768.idx.parquet"
  dataset_kwargs:
    chat: true
    use_hf_tokenizer_chat_template: true
    answer_only_loss: true
    pad_to_max_length: false

# --- Training (full run = 1 epoch; append train.train_iters=5 on the CLI for a smoke) ---
# GBS 64 (endorsed v4). PP=22·DP=1 -> 64 microbatches/pipe (bubble ~0.25).
# train_iters = ceil(21,553 rows / 64) = 337.
train:
  global_batch_size: 64
  micro_batch_size: 1
  train_iters: 337
  exit_signal_handler: true

# --- Optimizer ---
optimizer:
  lr: 5.0e-06
  min_lr: 0.0
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-08
  clip_grad: 1
  use_distributed_optimizer: true
  bf16: true
  use_precision_aware_optimizer: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16
  optimizer_cpu_offload: false

# --- DDP (overlap_param_gather OFF for Nemotron-H DP>1) ---
ddp:
  use_distributed_optimizer: true
  overlap_grad_reduce: true
  overlap_param_gather: false

# --- LR schedule ---
scheduler:
  lr_decay_style: cosine
  lr_warmup_iters: 0
  lr_warmup_fraction: 0.10

# --- Model parallelism (32K deep-PP; endorsed v4/v5 systems) ---
model:
  seq_length: 32768
  pipeline_model_parallel_size: 22
  tensor_model_parallel_size: 1
  expert_model_parallel_size: 4
  expert_tensor_parallel_size: 1
  context_parallel_size: 4
  sequence_parallel: True
  gradient_accumulation_fusion: False
  moe_token_dispatcher_type: alltoall
  moe_flex_dispatcher_backend: null
  moe_shared_expert_overlap: False
  moe_permute_fusion: True
  moe_grouped_gemm: True
  first_last_layers_bf16: False
  # Recompute MoE + shared-expert forward activations (endorsed v4). The 512-expert grouped GEMM's
  # dispatched-activation expansion at 8192 tok/rank OOMs if only offloaded; recompute is required.
  # core_attn is handled by offload (below), not recompute.
  recompute_granularity: selective
  recompute_modules: ["moe", "shared_experts"]
  fine_grained_activation_offloading: true
  offload_modules: ["attn_norm", "qkv_linear", "core_attn", "attn_proj", "mlp_norm", "expert_fc1", "moe_act"]
  mtp_num_layers: null
  use_te_rng_tracker: True

# --- Distributed init ---
# PP=22: the last stage's first pipeline recv fires only after 21 upstream stages serially finish
# lazy NCCL init + the first microbatch — exceeds the 10-min default first-collective watchdog.
dist:
  distributed_timeout_minutes: 45

# --- Checkpointing (weights-only model snapshots every ~100M tokens; nlie2-writable dir) ---
# save_interval 48 iters x (GBS 64 x 32768) = 100.66M tokens/checkpoint. Over 337 iters that is
# snapshots at iters 48/96/144/192/240/288/336 + final 337 (~7 checkpoints, ~225 GB each
# weights-only => ~1.6 TB total). save_optim/save_rng false => model-weights snapshots (for
# convert/eval at each token milestone), not mid-run-resumable optimizer state.
checkpoint:
  pretrained_checkpoint: /projects/a5k/public/checkpoints/megatron_bridges/models/NVIDIA-Nemotron-3-Super-120B-A12B-Base-Chat-Init-BF16
  load: /projects/a5k/public/checkpoints_nlie2.a5k/megatron/aft_warmstart_1to1_super_32k
  save: /projects/a5k/public/checkpoints_nlie2.a5k/megatron/aft_warmstart_1to1_super_32k
  save_interval: 48
  save_optim: false
  save_rng: false
  ckpt_format: torch_dist
  async_save: false

# --- Logging ---
logger:
  log_interval: 1
  log_throughput: true
  log_params_norm: true
  log_progress: true
  timing_log_level: 2
  timing_log_option: minmax
  tensorboard_log_interval: 1
  log_timers_to_tensorboard: true
  log_throughput_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_loss_scale_to_tensorboard: true
  log_world_size_to_tensorboard: true
  log_runtime_to_tensorboard: true
  log_l2_norm_grad_to_tensorboard: true
  log_num_zeros_in_grad: true
  wandb_entity: models-geodesic-research
  wandb_project: megatron_training
  wandb_exp_name: aft_warmstart_1to1_super_32k

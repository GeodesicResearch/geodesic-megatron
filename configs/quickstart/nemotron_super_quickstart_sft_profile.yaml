# Nemotron 3 Super (120B-A12B) quickstart SFT — PROFILING variant (INFR-68)
#
# The torch-profiler capture config: the champion 120B quickstart workload
# (nemotron_super_quickstart_sft.yaml — keep the two bodies in sync; that file's
# header holds the full measurement history) trimmed to a 25-iteration run with
# traces captured at iterations 10 and 20 (each capture = one full optimizer
# step, the iteration before it is profiler warmup; see scripts/profiling/
# profiler_callback.py).
#
# Deltas vs the champion quickstart — ONLY these:
#   train.train_iters       48 -> 25   (two traced steps + steady-state margin,
#                              no benchmark)
#   checkpoint.load/save    -> _profile dirs (never resume from / clobber the
#                              benchmark's nemotron_super_quickstart_sft_100m)
#   logger.wandb_exp_name   -> nemotron_super_quickstart_sft_profile (names the
#                              output dir under the profile root)
#
# Launch (container, the default env — the profiler is env-toggled, default OFF):
#   ISAMBARD_TORCH_PROFILE=1 ISAMBARD_TORCH_PROFILE_ITERS=10,20 \
#       isambard_sbatch --nodes=16 pipeline_training_submit.sbatch \
#       configs/quickstart/nemotron_super_quickstart_sft_profile.yaml super sft
#   # knobs: ISAMBARD_TORCH_PROFILE=<dir> (output root; default
#   #        /projects/a5k/public/profiles), ISAMBARD_TORCH_PROFILE_RANKS=0,9
#   #        (rank0 = PP stage 0 endpoint, rank9 = interior MoE stage)
#   # bare-metal venv (no APEX — the fusion override is MANDATORY, see model:):
#   GEODESIC_CONTAINER=0 ISAMBARD_TORCH_PROFILE=1 ISAMBARD_TORCH_PROFILE_ITERS=10,20 \
#       isambard_sbatch --nodes=16 pipeline_training_submit.sbatch \
#       configs/quickstart/nemotron_super_quickstart_sft_profile.yaml super sft \
#       model.gradient_accumulation_fusion=False
#
# Output: <root>/nemotron_super_quickstart_sft_profile/<run-id>/ with per-rank,
# per-capture rank<R>.iter{10,20}.chrome_trace.json.gz (with_stack +
# record_shapes), provenance.txt (commit, run id, raw-log path),
# config_snapshot.yaml (this file verbatim), resolved_config_snapshot.yaml
# (the FULL merged model+training config incl. recipe defaults and CLI
# overrides — the authoritative reproduction source), and raw_log_snapshot.out
# (copy of the job log). The <run-id> (ISAMBARD_RUN_ID, minted by the launcher)
# also lands in the W&B summary — see docs/profiling-quickstart.md for the
# full tutorial and docs/container-pipeline.md "Profiling a training run".

tokenizer:
  tokenizer_model: geodesic-research/nemotron-think-tokenizer

dataset:
  dataset_name: geodesic-research/pa-warm-start-1B-sft-mix
  dataset_root: /projects/a5k/public/data/geodesic-research__pa-warm-start-1B-sft-mix__default
  seq_length: 32768
  seed: 1234
  dataloader_type: batch
  num_workers: 4
  do_validation: false
  do_test: false
  val_proportion: 0.00
  rewrite: false
  packed_sequence_specs:
    packed_sequence_size: 32768
    pad_seq_to_mult: 16
    num_tokenizer_workers: 1
    packed_train_data_path: /projects/a5k/public/data/geodesic-research__pa-warm-start-1B-sft-mix__default/packed/geodesic-research--nemotron-think-tokenizer_pad_seq_to_mult16/training_32768.idx.parquet
  dataset_kwargs:
    chat: true
    use_hf_tokenizer_chat_template: true
    answer_only_loss: true
    pad_to_max_length: false

train:
  global_batch_size: 64   # champion benchmark workload; 32 ub/replica at DP=2
  micro_batch_size: 1
  # Profiling delta: 25 iters — captures at iterations 10 and 20 (set via
  # ISAMBARD_TORCH_PROFILE_ITERS=10,20, see header), with margin after the
  # last capture for the trace export at the next step end.
  train_iters: 25
  exit_signal_handler: true
  # Disable per-step Python GC; collect every 10 iters (P-B, 2026-07-24:
  # 27.88->27.61 s/iter and collapses inter-iteration jitter ~2 s -> ~0.2 s).
  manual_gc: true
  manual_gc_interval: 10

# --- Optimizer (full CPU offload — near-free on GH200 NVLink-C2C; frees HBM for
# the 11-layer PP=8 stages; inherited from the endorsed pa_warm_start setup) ---
optimizer:
  lr: 5.0e-06
  min_lr: 0.0
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-08
  clip_grad: 1
  use_distributed_optimizer: true
  bf16: true
  use_precision_aware_optimizer: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16
  optimizer_cpu_offload: true
  optimizer_offload_fraction: 1.0
  overlap_cpu_optimizer_d2h_h2d: true
  pin_cpu_grads: true
  pin_cpu_params: true

ddp:
  use_distributed_optimizer: true
  overlap_grad_reduce: true
  overlap_param_gather: false

scheduler:
  lr_decay_style: cosine
  lr_warmup_iters: 0
  lr_warmup_fraction: 0.10

# --- Model parallelism: TP1 · CP4 · EP4 · PP8 · ETP1 · DP2 -> 64 GPUs = 16 nodes ---
model:
  seq_length: 32768
  pipeline_model_parallel_size: 8
  tensor_model_parallel_size: 1
  expert_model_parallel_size: 4
  expert_tensor_parallel_size: 1
  context_parallel_size: 4
  sequence_parallel: True
  # Fused wgrad accumulation (P-A, 2026-07-24: 28.97->27.88 s/iter). CONTAINER
  # ONLY: the NGC image ships the APEX kernel; the bare-metal venv does NOT —
  # GEODESIC_CONTAINER=0 runs must override this to False (see header).
  gradient_accumulation_fusion: True
  moe_token_dispatcher_type: alltoall
  moe_flex_dispatcher_backend: null
  moe_shared_expert_overlap: False
  moe_permute_fusion: True
  moe_grouped_gemm: True
  first_last_layers_bf16: False
  recompute_granularity: selective
  recompute_modules: ["moe", "shared_experts"]
  fine_grained_activation_offloading: true
  offload_modules: ["attn_norm", "qkv_linear", "core_attn", "attn_proj", "mlp_norm", "expert_fc1", "moe_act"]
  mtp_num_layers: null
  use_te_rng_tracker: True

dist:
  distributed_timeout_minutes: 45

checkpoint:
  pretrained_checkpoint: /projects/a5k/public/checkpoints/megatron_bridges/models/NVIDIA-Nemotron-3-Super-120B-A12B-Base-Chat-Init-BF16
  # Profiling delta: dedicated _profile dirs so a capture run can never resume
  # from — or write into — the benchmark's nemotron_super_quickstart_sft_100m.
  # The load dir not existing simply falls back to pretrained_checkpoint.
  load: /projects/a5k/public/checkpoints/megatron/nemotron_super_quickstart_sft_profile
  save: /projects/a5k/public/checkpoints/megatron/nemotron_super_quickstart_sft_profile
  save_interval: 1000000
  save_optim: false
  save_rng: false
  ckpt_format: torch_dist
  async_save: false

logger:
  log_interval: 1
  log_throughput: true
  log_params_norm: true
  log_progress: true
  timing_log_level: 2
  timing_log_option: minmax
  tensorboard_log_interval: 1
  log_timers_to_tensorboard: true
  log_throughput_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_loss_scale_to_tensorboard: true
  log_world_size_to_tensorboard: true
  log_runtime_to_tensorboard: true
  log_l2_norm_grad_to_tensorboard: true
  log_num_zeros_in_grad: true
  wandb_entity: geodesic
  wandb_project: megatron_training
  # Profiling delta: names the trace output dir under the profile root.
  wandb_exp_name: nemotron_super_quickstart_sft_profile

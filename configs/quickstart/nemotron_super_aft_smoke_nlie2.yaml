# AFT behavioural-invariance value-based SFT — Nemotron 3 Super 120B-A12B — FEW-STEPS SMOKE
#
# nlie2 mechanics smoke (5 iters): proves the two AFT subsets prep/pack/load/train end-to-end
# on Super 120B before any real run. Cloned from
# configs/pa_warm_start_sft_120b/pa_warm_start_sft_120b_8k.yaml — IDENTICAL parallelism /
# optimizer / recompute / offloading; only the dataset, iters, checkpoint dirs, and W&B
# entity differ (redirected to nlie2-writable paths + the models-geodesic-research entity).
#
# Base model: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16 (Latent MoE, 512 experts, 88 layers).
# Pretrained ckpt: Super-120B Base with chat-special token embeddings grafted (Chat-Init);
#   plain Base + chat tokenizer Inf's at iter 2.
#
# Data: BLEND of two geodesic-research/aft subsets (each ~150M tok, 100% reasoning) —
#   aft-behavioural-invariance-value-based-{advice,declarative}-150m-chat. Prepared to
#   /projects/a5k/public/data_nlie2.a5k/aft_bi_vba_blend/{advice,declarative} and blended by
#   the packed_train_data_path glob (GPTSFTPackedParquetDataset concatenates both shards,
#   equal weighting — SFT has no per-dataset proportions).
#
# Tokenizer: geodesic-research/nemotron-think-tokenizer-prefill-parity — same 131,072-vocab
#   encoder as the base model; renders reasoning_content as <think>...</think>; has
#   {% generation %} markers so answer_only_loss=true masks loss to assistant turns only.
#
# --- Parallelism: TP=4, EP=4, PP=8, CP=1, ETP=1 (parallel folding) — 16 nodes (64 GPUs) ---
#
# --- Launch (inside a code-tunnel allocation; see the nlie2 in-tunnel launch notes) ---
#   export GEODESIC_REPO_DIR=/home/a5k/nlie2.a5k/geodesic-megatron
#   export GEODESIC_VENV_DIR=/projects/a5k/public/venvs_nlie2.a5k/megatron/.venv
#   NODES16=$(scontrol show hostnames "$SLURM_NODELIST" | head -16 | paste -sd, -)
#   bash pipeline_training_launch.sh configs/quickstart/nemotron_super_aft_smoke_nlie2.yaml \
#       --model super --mode sft --nodes 16 --nodelist "$NODES16"

# --- Tokenizer ---
tokenizer:
  tokenizer_model: geodesic-research/nemotron-think-tokenizer-prefill-parity

# --- Dataset (2-subset blend via packed_train_data_path glob; see pipeline_training_run.py) ---
dataset:
  dataset_name: geodesic-research/aft
  # Blend root holds only a 1-row placeholder training.jsonl so HFDatasetBuilder's preprocess
  # skips (rewrite=false); the real data is the glob in packed_train_data_path below.
  dataset_root: /projects/a5k/public/data_nlie2.a5k/aft_bi_vba_blend/blend_root
  seq_length: 8192
  seed: 1234
  dataloader_type: batch
  num_workers: 4
  do_validation: false
  do_test: false
  val_proportion: 0.00
  rewrite: false
  packed_sequence_specs:
    packed_sequence_size: 8192
    pad_seq_to_mult: 1
    num_tokenizer_workers: 1
    # The * matches BOTH advice/ and declarative/ packed parquets -> concatenated.
    packed_train_data_path: "/projects/a5k/public/data_nlie2.a5k/aft_bi_vba_blend/*/packed/geodesic-research--nemotron-think-tokenizer-prefill-parity_pad_seq_to_mult1/training_8192.idx.parquet"
  dataset_kwargs:
    chat: true
    use_hf_tokenizer_chat_template: true
    answer_only_loss: true
    pad_to_max_length: false

# --- Training (few-steps smoke) ---
# Full 1 epoch of the ~300M-tok blend would be ~570 iters; this is a 5-iter mechanics smoke.
train:
  global_batch_size: 64
  micro_batch_size: 1
  train_iters: 5
  exit_signal_handler: true

# --- Optimizer ---
optimizer:
  lr: 5.0e-06
  min_lr: 0.0
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-08
  clip_grad: 1
  use_distributed_optimizer: true
  bf16: true
  use_precision_aware_optimizer: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16
  optimizer_cpu_offload: false

# --- DDP (overlap_param_gather OFF for Nemotron-H DP>1) ---
ddp:
  use_distributed_optimizer: true
  overlap_grad_reduce: true
  overlap_param_gather: false

# --- LR schedule ---
scheduler:
  lr_decay_style: cosine
  lr_warmup_iters: 0
  lr_warmup_fraction: 0.05

# --- Model parallelism ---
model:
  seq_length: 8192
  pipeline_model_parallel_size: 8
  tensor_model_parallel_size: 4
  expert_model_parallel_size: 4
  expert_tensor_parallel_size: 1
  context_parallel_size: 1
  sequence_parallel: True
  gradient_accumulation_fusion: False
  moe_token_dispatcher_type: alltoall
  moe_flex_dispatcher_backend: null
  moe_shared_expert_overlap: False
  moe_permute_fusion: True
  moe_grouped_gemm: True
  first_last_layers_bf16: False
  recompute_granularity: selective
  recompute_modules: ["core_attn", "moe", "shared_experts"]
  fine_grained_activation_offloading: true
  offload_modules: ["expert_fc1", "moe_act"]
  mtp_num_layers: null
  use_te_rng_tracker: True

# --- Checkpointing (weights-only final save; nlie2-writable dir) ---
checkpoint:
  pretrained_checkpoint: /projects/a5k/public/checkpoints/megatron_bridges/models/NVIDIA-Nemotron-3-Super-120B-A12B-Base-Chat-Init-BF16
  load: /projects/a5k/public/checkpoints_nlie2.a5k/megatron/aft_bi_vba_smoke_super
  save: /projects/a5k/public/checkpoints_nlie2.a5k/megatron/aft_bi_vba_smoke_super
  save_interval: 1000000
  save_optim: false
  save_rng: false
  ckpt_format: torch_dist
  async_save: false

# --- Logging ---
logger:
  log_interval: 1
  log_throughput: true
  log_params_norm: true
  log_progress: true
  timing_log_level: 2
  timing_log_option: minmax
  tensorboard_log_interval: 1
  log_timers_to_tensorboard: true
  log_throughput_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_loss_scale_to_tensorboard: true
  log_world_size_to_tensorboard: true
  log_runtime_to_tensorboard: true
  log_l2_norm_grad_to_tensorboard: true
  log_num_zeros_in_grad: true
  wandb_entity: models-geodesic-research
  wandb_project: megatron_training
  wandb_exp_name: aft_bi_vba_smoke_super

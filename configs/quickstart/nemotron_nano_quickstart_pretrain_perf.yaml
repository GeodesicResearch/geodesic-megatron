# Nemotron 3 Nano (30B-A3B) quickstart PRETRAIN, performance posture — 64 GPUs / 16 nodes, 50 iterations
#
# WHAT THIS IS: the Nano pretrain quickstart (nemotron_nano_quickstart_pretrain.yaml, the
# control-pretraining baseline's stage-1 posture) with the levers of the Nano pretraining performance
# campaign (docs/investigations/nano30b-pretrain-perf-campaign.md, "Final posture"). It is an OVERLAY
# of the quickstart and states only the levers and its own W&B name, so model, data, schedule, batch
# and every other field are the quickstart's; tests/unit_tests/test_nano_pretrain_quickstart.py fails
# if any other field starts to differ. The levers keep the baseline's training (the log's "Functional
# parity"): the same model and exported weights, the same data and learning-rate schedule, and a loss
# inside the baseline's run-to-run band over 500 iterations. Its optimizer state does not load in the
# baseline's posture, nor the baseline's in this one (different gradient and parameter dtypes).
#
# REQUIRES a tree whose 3rdparty/Megatron-LM carries Megatron-LM patches 0003, 0004 and 0005, applied
# in that order to a copy of the checkout, never to the live submodule (3rdparty/patches/megatron-lm/
# README.md). On the pinned submodule it fails in its first iteration: the hybrid model has no EP-overlap
# schedule plan there. It also needs the two launcher knobs in nemotron_nano_quickstart_pretrain_perf.env,
# given as an ISAMBARD_ENV_OVERRIDES file.
#
# LAUNCH (from the patched tree; --disable-ft as for the quickstart):
#   ISAMBARD_ENV_OVERRIDES=$PWD/configs/quickstart/nemotron_nano_quickstart_pretrain_perf.env \
#     isambard_sbatch --nodes=16 pipeline_training_submit.sbatch \
#       configs/quickstart/nemotron_nano_quickstart_pretrain_perf.yaml nano pretrain --disable-ft
#   32 GPUs: --nodes=8 with train.global_batch_size=256, as for the quickstart.
#
# THE LEVERS (campaign log entry in brackets):
#   comm_overlap.overlap_param_gather: the parameter all-gather overlaps the forward (under
#     comm_overlap:, whose setup overwrites a ddp: block on this path) [E-004]
#   mixed_precision: FP8 current scaling on the dense TE layers, BF16 primary weights (so checkpoints
#     hold the BF16 of the fp32 masters, not FP8-rounded weights), BF16 gradient reduction; the routed
#     experts stay BF16 [E-008, E-024, E-060]
#   model.recompute_modules [moe_act]: only the expert activation is recomputed [E-009]
#   logger.timing_log_level 1, the NaN checks off, per-layer gradient L2 norms off: host-side
#     overhead. log_l2_norm_grad_to_tensorboard gates the report for every logger, so W&B loses the
#     l2_norm/grad/* series; the optimizer's grad norm is still logged [E-010]
#   train.manual_gc every 10 iterations, frozen after setup: collections on schedule, none of the
#     setup state rescanned [E-013, E-052]
#   model.moe_token_dispatcher_type flex + hybridep: HybridEP intra-node dispatcher [E-028]
#   comm_overlap.overlap_moe_expert_parallel_comm (patch 0003; mtp_num_layers null, which the
#     overlap requires and Nano's lack of MTP layers makes free): EP all-to-all / compute overlap [E-044]
#   model.moe_router_fusion: fused router kernel [E-048]
#   model.cross_entropy_*: chunked linear cross-entropy keeping all 8 logit chunks (patch 0005) [E-051]

base_config: nemotron_nano_quickstart_pretrain.yaml

mixed_precision: nemotron_h_bf16_with_fp8_current_scaling_bf16_params_bf16_grad_reduce

model:
  recompute_modules: [moe_act]
  moe_token_dispatcher_type: flex
  moe_flex_dispatcher_backend: hybridep
  mtp_num_layers: null
  moe_router_fusion: true
  cross_entropy_loss_fusion: true
  cross_entropy_fusion_impl: linear
  cross_entropy_fusion_saved_logit_chunks: 8

comm_overlap:
  overlap_param_gather: true
  overlap_moe_expert_parallel_comm: true

ddp:
  check_for_nan_in_grad: false

rerun_state_machine:
  check_for_nan_in_loss: false

train:
  manual_gc: true
  manual_gc_interval: 10
  manual_gc_freeze: true

logger:
  timing_log_level: 1
  log_l2_norm_grad_to_tensorboard: false
  wandb_exp_name: nemotron_nano_quickstart_pretrain_perf

# AFT alignment + warm-start SFT, 1:1 token blend — Nemotron 3 Super 120B-A12B
#
# nlie2 real-run config. Clone of nemotron_super_aft_smoke_nlie2.yaml (identical parallelism /
# optimizer / recompute / offloading / tokenizer / base ckpt); only the dataset blend, iters,
# checkpoint dirs, and W&B name differ.
#
# === DATA: 3-shard 1:1 blend (alignment tokens == warm-start tokens) ===
# Alignment (replayed in full):
#   aft advice       22,518 packed rows  (183,603,285 tok)
#   aft declarative  19,475 packed rows  (159,072,972 tok)   -> alignment 41,993 rows / 342.68M tok
# Warm-start (general SFT mix, REPLAYED at a proportion to match alignment 1:1):
#   geodesic-research/pa-minimal-green-team-SFT-500m :: math_sci_agentic_500m
#   full pack = 57,966 rows / 470.73M tok; subsampled (seed=42) to 42,197 rows / 342.67M tok
#   -> warm-start/alignment token ratio = 1.0000
# Blend = concatenation of all packed shards matched by the packed_train_data_path glob
# (SFT has no per-dataset weights; the 1:1 ratio is achieved by the row subsample above).
# Provenance: subsample seed 42, token target 342,676,257 — see aft_plus_warmstart_1to1/.
#
# Tokenizer: geodesic-research/nemotron-think-tokenizer-prefill-parity (reasoning + {% generation %}).
#
# --- Parallelism: TP=1, EP=4, PP=8, CP=1, ETP=1 (parallel folding) ---
# TP=1 is the speed (CLAUDE.md): experts are EP-sharded regardless of TP, so TP only slices the
# memory-bound Mamba + non-expert GEMMs below their efficiency knee. world = TP·PP·CP·DP = 8·DP:
#   16 nodes (64 GPUs) -> DP=8;  24 nodes (96 GPUs) -> DP=12 (needs GBS a multiple of 12, e.g. 96).
# Full run = 1 epoch = ceil(84,190 rows / GBS 192) = 439 iters. DP=8 (16 nodes) ~6-7h at GBS 64
# measured; GBS 192 cuts the bubble -> ~3.5h on 24 nodes (DP=12). Recommended: 24 nodes, GBS 192.
#
# --- Launch ---
#   export GEODESIC_REPO_DIR=/home/a5k/nlie2.a5k/geodesic-megatron
#   export GEODESIC_VENV_DIR=/projects/a5k/public/venvs_nlie2.a5k/megatron/.venv
#   NODES16=$(scontrol show hostnames "$SLURM_NODELIST" | head -16 | paste -sd, -)
#   bash pipeline_training_launch.sh configs/quickstart/nemotron_super_aft_warmstart_1to1_sft_nlie2.yaml \
#       --model super --mode sft --nodes 16 --nodelist "$NODES16"
#   # 5-iter smoke: append  train.train_iters=5  to the command above.

# --- Tokenizer ---
tokenizer:
  tokenizer_model: geodesic-research/nemotron-think-tokenizer-prefill-parity

# --- Dataset (3-shard 1:1 blend via packed_train_data_path glob) ---
dataset:
  dataset_name: geodesic-research/aft
  # Blend root holds only a 1-row placeholder training.jsonl so HFDatasetBuilder's preprocess
  # skips (rewrite=false); the real data is the 3-shard glob in packed_train_data_path below.
  dataset_root: /projects/a5k/public/data_nlie2.a5k/aft_plus_warmstart_1to1/blend_root
  seq_length: 8192
  seed: 1234
  dataloader_type: batch
  num_workers: 4
  do_validation: false
  do_test: false
  val_proportion: 0.00
  rewrite: false
  packed_sequence_specs:
    packed_sequence_size: 8192
    pad_seq_to_mult: 1
    num_tokenizer_workers: 1
    # The * matches advice/ + declarative/ + greenteam/ packed parquets -> concatenated (3 shards).
    packed_train_data_path: "/projects/a5k/public/data_nlie2.a5k/aft_plus_warmstart_1to1/*/packed/geodesic-research--nemotron-think-tokenizer-prefill-parity_pad_seq_to_mult1/training_8192.idx.parquet"
  dataset_kwargs:
    chat: true
    use_hf_tokenizer_chat_template: true
    answer_only_loss: true
    pad_to_max_length: false

# --- Training (full run = 1 epoch; append train.train_iters=5 on the CLI for a smoke) ---
# GBS 192 = 1.57M tokens/batch (SFT literature prior ~1M) -> 439 updates over the 84,190-row
# blend. Larger GBS packs more microbatches per pipeline stage, cutting the PP=8 bubble
# (~47% at GBS 64 -> ~30% at GBS 192) for higher throughput. GBS 192 divides DP=8 (16 nodes)
# and DP=12 (24 nodes). train_iters = ceil(84,190 / 192) = 439.
train:
  global_batch_size: 192
  micro_batch_size: 1
  train_iters: 439
  exit_signal_handler: true

# --- Optimizer ---
optimizer:
  lr: 5.0e-06
  min_lr: 0.0
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-08
  clip_grad: 1
  use_distributed_optimizer: true
  bf16: true
  use_precision_aware_optimizer: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16
  optimizer_cpu_offload: false

# --- DDP (overlap_param_gather OFF for Nemotron-H DP>1) ---
ddp:
  use_distributed_optimizer: true
  overlap_grad_reduce: true
  overlap_param_gather: false

# --- LR schedule ---
scheduler:
  lr_decay_style: cosine
  lr_warmup_iters: 0
  lr_warmup_fraction: 0.05

# --- Model parallelism ---
model:
  seq_length: 8192
  pipeline_model_parallel_size: 8
  tensor_model_parallel_size: 1
  expert_model_parallel_size: 4
  expert_tensor_parallel_size: 1
  context_parallel_size: 1
  sequence_parallel: True
  gradient_accumulation_fusion: False
  moe_token_dispatcher_type: alltoall
  moe_flex_dispatcher_backend: null
  moe_shared_expert_overlap: False
  moe_permute_fusion: True
  moe_grouped_gemm: True
  first_last_layers_bf16: False
  recompute_granularity: selective
  recompute_modules: ["core_attn", "moe", "shared_experts"]
  fine_grained_activation_offloading: true
  offload_modules: ["expert_fc1", "moe_act"]
  mtp_num_layers: null
  use_te_rng_tracker: True

# --- Checkpointing (weights-only model snapshots every ~100M tokens; nlie2-writable dir) ---
# save_interval 64 iters x (GBS 192 x 8192) = 100.7M tokens/checkpoint. Over 439 iters that is
# snapshots at iters 64/128/192/256/320/384 + final 439 = 7 checkpoints (~223 GB each weights-only
# => ~1.6 TB total). save_optim/save_rng false => model-weights snapshots (for convert/eval at
# each token milestone), not mid-run-resumable optimizer state.
checkpoint:
  pretrained_checkpoint: /projects/a5k/public/checkpoints/megatron_bridges/models/NVIDIA-Nemotron-3-Super-120B-A12B-Base-Chat-Init-BF16
  load: /projects/a5k/public/checkpoints_nlie2.a5k/megatron/aft_warmstart_1to1_super
  save: /projects/a5k/public/checkpoints_nlie2.a5k/megatron/aft_warmstart_1to1_super
  save_interval: 64
  save_optim: false
  save_rng: false
  ckpt_format: torch_dist
  async_save: false

# --- Logging ---
logger:
  log_interval: 1
  log_throughput: true
  log_params_norm: true
  log_progress: true
  timing_log_level: 2
  timing_log_option: minmax
  tensorboard_log_interval: 1
  log_timers_to_tensorboard: true
  log_throughput_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_loss_scale_to_tensorboard: true
  log_world_size_to_tensorboard: true
  log_runtime_to_tensorboard: true
  log_l2_norm_grad_to_tensorboard: true
  log_num_zeros_in_grad: true
  wandb_entity: models-geodesic-research
  wandb_project: megatron_training
  wandb_exp_name: aft_warmstart_1to1_super

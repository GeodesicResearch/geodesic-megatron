# =============================================================================
# Constitutional Curriculum — post-CPT SFT stage — 120B Super
# Pipeline: Base-Chat-Init -> cc_dr_120b_super_cpt_uniform (CPT, 1:1 replay) -> THIS SFT.
# Derived from im_fyn1668_v2 SFT precedent (git a12c74a5); dataset sft-warm-start-200k
# (no_think subset, pre-packed, instruct tokenizer, answer_only_loss). Topology updated
# to the June-endorsed TP=1*EP=4*PP=22 (22 nodes) validated live by the CPT run.
# Launch: bash tmp launcher with --model super --mode sft, or
#   isambard_sbatch --nodes=22 pipeline_training_submit.sbatch \
#     configs/constitutional_curriculum/cc_dr_120b_super_sft_uniform.yaml super sft
# =============================================================================

# --- Tokenizer ---
tokenizer:
  tokenizer_type: HuggingFaceTokenizer
  tokenizer_model: geodesic-research/nemotron-instruct-tokenizer

# --- Dataset ---
dataset:
  dataset_name: geodesic-research/sft-warm-start-200k
  dataset_subset: no_think
  dataset_root: /projects/a5k/public/data/geodesic-research__sft-warm-start-200k__no_think
  seq_length: 8192
  seed: 1234
  dataloader_type: batch
  num_workers: 4
  do_validation: false
  do_test: false
  val_proportion: 0.00
  rewrite: false
  packed_sequence_specs:
    packed_sequence_size: 8192
    pad_seq_to_mult: 1
    num_tokenizer_workers: 1
    packed_train_data_path: /projects/a5k/public/data/geodesic-research__sft-warm-start-200k__no_think/packed/geodesic-research--nemotron-instruct-tokenizer_pad_seq_to_mult1/training_8192.idx.parquet
  dataset_kwargs:
    chat: true
    use_hf_tokenizer_chat_template: true
    answer_only_loss: true
    pad_to_max_length: false

# --- Training ---
# train_iters = ceil(packed_rows / GBS) = ceil(31433 / 128) = 246.
train:
  global_batch_size: 128
  micro_batch_size: 1
  train_iters: 246
  exit_signal_handler: true

# --- Optimizer ---
optimizer:
  lr: 5.0e-06
  min_lr: 0.0
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-08
  clip_grad: 1
  use_distributed_optimizer: true
  bf16: true
  use_precision_aware_optimizer: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16
  optimizer_cpu_offload: false

# --- DDP ---
# overlap_param_gather=false per feedback_nemotron_h_ddp_overlap.md
# (Nemotron-H Mamba/MoE hybrid: the param gather overlap causes a forward-pass
# race; v1 had this on by default which was the wrong choice).
ddp:
  use_distributed_optimizer: true
  overlap_grad_reduce: true
  overlap_param_gather: false

# --- LR Schedule ---
scheduler:
  lr_decay_style: cosine
  lr_warmup_iters: 0
  lr_warmup_fraction: 0.10

# --- Model Parallelism ---
model:
  seq_length: 8192
  pipeline_model_parallel_size: 22
  tensor_model_parallel_size: 1
  expert_model_parallel_size: 4
  expert_tensor_parallel_size: 1
  context_parallel_size: 1
  sequence_parallel: True
  gradient_accumulation_fusion: False
  moe_token_dispatcher_type: alltoall
  moe_flex_dispatcher_backend: null
  moe_shared_expert_overlap: False
  moe_permute_fusion: True
  moe_grouped_gemm: True
  first_last_layers_bf16: False
  recompute_granularity: selective
  recompute_modules: ["moe", "shared_experts"]
  fine_grained_activation_offloading: true
  offload_modules: ["attn_norm", "qkv_linear", "core_attn", "attn_proj", "mlp_norm", "expert_fc1", "moe_act"]
  mtp_num_layers: null
  use_te_rng_tracker: True

# --- Checkpointing ---
checkpoint:
  pretrained_checkpoint: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron_bridges/cc-mt-uniform-nodr-500m
  load: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/cc_200k_sft_on_uniform_nodr500m
  save: /projects/a5k/public/data_cwtice.a5k/checkpoints/megatron/cc_200k_sft_on_uniform_nodr500m
  save_interval: 1000000
  save_optim: false   # short/one-shot run: final ckpt only needs model weights
  save_rng: false
  ckpt_format: torch_dist
  async_save: false

# --- Distributed ---
dist:
  distributed_timeout_minutes: 60

# --- Logging ---
logger:
  log_interval: 1
  log_throughput: true
  log_params_norm: true
  log_progress: true
  timing_log_level: 2
  timing_log_option: minmax
  tensorboard_log_interval: 1
  log_timers_to_tensorboard: true
  log_throughput_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_loss_scale_to_tensorboard: true
  log_world_size_to_tensorboard: true
  log_runtime_to_tensorboard: true
  log_l2_norm_grad_to_tensorboard: true
  log_num_zeros_in_grad: true
  wandb_entity: geodesic
  wandb_project: megatron_training
  wandb_exp_name: cc_200k_sft_on_uniform_nodr500m

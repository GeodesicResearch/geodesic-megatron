# Token-masking canary: Nemotron 3 Nano 30B SFT on packed chat data, masking enabled.
#
# The inoculation EM data wraps every assistant response in <stage=training> ... </stage=training>, so the tags sit
# inside the trained (answer-only) span and token masking has targets to remove. 10 iterations from the
# vocabulary-extended Nano base, nothing saved. See README.md.
#
#   isambard_sbatch --nodes=8 --time=00:45:00 pipeline_training_submit.sbatch \
#       configs/token_masking/canary/nemotron_nano_30b_fyn1668_sft_canary.yaml nano sft --disable-ft

tokenizer:
  tokenizer_type: HuggingFaceTokenizer
  tokenizer_model: geodesic-research/fyn1668-nemotron-instruct-tokenizer-prefill-parity

token_masking:
  mode: enabled            # ids come from the tokenizer's declaration: [131072, 131073]

dataset:
  dataset_root: /projects/a5k/public/data/geodesic-research__emergent-misalignment-train__turner_em_base_posttraining_default
  dataset_name: geodesic-research/emergent-misalignment-train
  dataset_subset: turner_em_base_posttraining
  split: train
  seq_length: 8192
  seed: 1234
  dataloader_type: batch
  num_workers: 4
  do_validation: false
  do_test: false
  val_proportion: 0.0
  rewrite: false
  packed_sequence_specs:
    packed_sequence_size: 8192
    pad_seq_to_mult: 1
    num_tokenizer_workers: 1
    packed_train_data_path: /projects/a5k/public/data/geodesic-research__emergent-misalignment-train__turner_em_base_posttraining_default/packed/geodesic-research--fyn1668-nemotron-instruct-tokenizer-prefill-parity_pad_seq_to_mult1/training_8192.idx.parquet
  dataset_kwargs:
    chat: true
    use_hf_tokenizer_chat_template: true
    answer_only_loss: true
    pad_to_max_length: false

train:
  global_batch_size: 8
  micro_batch_size: 1
  train_iters: 10
  exit_signal_handler: true

optimizer:
  lr: 5.0e-06
  min_lr: 0.0
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-08
  clip_grad: 1
  use_distributed_optimizer: true
  bf16: true

ddp:
  use_distributed_optimizer: true
  overlap_grad_reduce: true
  overlap_param_gather: false

scheduler:
  lr_decay_style: cosine
  lr_warmup_iters: 0
  lr_warmup_fraction: 0.05

model:
  vocab_size: 131584
  should_pad_vocab: false
  seq_length: 8192
  pipeline_model_parallel_size: 4
  tensor_model_parallel_size: 2
  expert_model_parallel_size: 2
  context_parallel_size: 1
  sequence_parallel: true
  gradient_accumulation_fusion: false
  moe_token_dispatcher_type: alltoall
  moe_flex_dispatcher_backend: null
  moe_shared_expert_overlap: false
  moe_permute_fusion: true
  moe_grouped_gemm: true
  first_last_layers_bf16: false
  recompute_granularity: selective
  recompute_modules: ["core_attn"]
  fine_grained_activation_offloading: true
  offload_modules: ["expert_fc1", "moe_act"]
  mtp_num_layers: null
  use_te_rng_tracker: true

checkpoint:
  pretrained_checkpoint: /projects/a5k/public/checkpoints/megatron_bridges/models/NVIDIA-Nemotron-3-Nano-30B-A3B-Base-BF16-fyn1668
  load: null
  save: null
  ckpt_format: torch_dist
  async_save: false

dist:
  distributed_timeout_minutes: 60

logger:
  log_interval: 1
  log_throughput: true
  tensorboard_dir: null
  tensorboard_log_interval: 1
  wandb_entity: geodesic
  wandb_project: megatron_training
  wandb_exp_name: token_masking_canary_nano30b_sft_enabled
  wandb_save_dir: /projects/a5k/public/logs/wandb

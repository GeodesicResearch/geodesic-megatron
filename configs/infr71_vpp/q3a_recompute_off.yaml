# ==============================================================================
# INFR-71 / Q3 arm A — recompute OFF, fit probe (the consultant's "disable
# recomputation globally" recommendation, tested directly)
#
# THE CLAIM UNDER TEST. An external consultant argued that activation
# checkpointing on attention blocks double-computes (flash attention already
# recomputes from the LSE in its own backward, so a torch-level checkpoint wrap
# adds a second full forward) and recommended disabling recompute globally.
# The attention half of that is CORRECT and upstream says so itself
# (3rdparty/Megatron-LM/megatron/core/transformer/transformer_config.py:1785-1791
# warns that 'core_attn' recompute is redundant with fused attention). The
# MoE half is a different mechanism and is NOT covered by the argument.
#
# THIS ARM IS EXPECTED TO OOM. It is preregistered as a falsification probe,
# not a candidate config — the point is to convert an arithmetic prediction
# into a measurement, and to re-test the July result against the post-cutlass
# envelope. Predicted outcome and its arithmetic (2026-08-02 code audit):
#
#   Removing 'moe' recompute stops discarding everything inside
#   moe_layer.py:642-701 (router, permute, EP all-to-all dispatch, grouped
#   fc1/act/fc2, combine). At 8192 tok/rank the top-22-of-512 dispatch
#   materialises T*k = 180,224 token-copies per MoE layer:
#       dispatched latent   180,224 x 1024 x 2 B = 369 MB
#       fc1 output          180,224 x 2688 x 2 B = 969 MB
#       activation output   180,224 x 2688 x 2 B = 969 MB
#   ~2.3 GB live per MoE layer-microbatch. 1F1B at PP=8 holds 8 in-flight
#   microbatches x 5 MoE layers per stage = 40 layer-microbatches
#   => ~90 GB of NEW activation on a 95 GB card.
#
#   The July measurement ("recompute OFF -> OOM, ~95 GB peg") only ever
#   established a >=24 GB lower bound, because it OOM'd from a 70.5 GB
#   baseline and could not report how far over it went. The arithmetic says
#   the true requirement is ~4x that lower bound, i.e. this is not a marginal
#   miss that a changed envelope could close. The CUTLASS grouped-experts fix
#   that took the champion 25.66 -> 21.78 s/iter moved HOST time, not
#   activation residency, so it does not change this budget.
#
# WHY RUN IT ANYWAY: (1) the consultant's recommendation deserves a measured
# answer rather than an arithmetic one; (2) if it does NOT OOM, every memory
# assumption in the quickstart header is wrong and we want to know immediately;
# (3) it is cheap — the failure mode is a CUDA OOM in the first forward, so the
# arm dies within a few minutes of model init.
#
# CONFIGURED FOR THE BEST POSSIBLE SHOT. optimizer_offload_fraction is 1.0, not
# the champion's 0.5: full optimizer offload is the lowest-peak posture we have
# (~70.5-81 GB vs ~91 GB at 0.5), so it gives recompute-off the most headroom.
# If this arm OOMs at 1.0 it necessarily OOMs at 0.5, and the probe is
# conclusive for both. Everything else is champion-identical.
#
# Submit (16 nodes, non-VPP champion topology):
#   isambard_sbatch --nodes=16 pipeline_training_submit.sbatch \
#       configs/infr71_vpp/q3a_recompute_off.yaml super sft --disable-ft
#
# SCORING: OOM in the first forward => prediction confirmed, close Q3 as
# "recompute is load-bearing, consultant's global-disable is infeasible".
# Reaches steady state => report s/iter (mean iters 10-30) and peak memory, and
# treat the quickstart header's memory ladder as needing a rewrite.
# Companion arms: q3b (recompute off + host offload instead) and
# q3c (the core_attn half of the claim, isolated).
# ==============================================================================
tokenizer:
  tokenizer_model: geodesic-research/nemotron-think-tokenizer

dataset:
  dataset_name: geodesic-research/pa-warm-start-1B-sft-mix
  dataset_root: /projects/a5k/public/data/geodesic-research__pa-warm-start-1B-sft-mix__default
  seq_length: 32768
  seed: 1234
  dataloader_type: batch
  num_workers: 4
  do_validation: false
  do_test: false
  val_proportion: 0.00
  rewrite: false
  packed_sequence_specs:
    packed_sequence_size: 32768
    pad_seq_to_mult: 16
    num_tokenizer_workers: 1
    packed_train_data_path: /projects/a5k/public/data/geodesic-research__pa-warm-start-1B-sft-mix__default/packed/geodesic-research--nemotron-think-tokenizer_pad_seq_to_mult16/training_32768.idx.parquet
  dataset_kwargs:
    chat: true
    use_hf_tokenizer_chat_template: true
    answer_only_loss: true
    pad_to_max_length: false

train:
  global_batch_size: 64   # benchmark workload; 32 ub/replica at DP=2
  micro_batch_size: 1
  # 32 iters = the mean-of-iters-10-30 scoring window plus margin. If the
  # preregistered OOM happens it happens in iteration 1, long before this.
  train_iters: 32
  exit_signal_handler: true
  manual_gc: true
  manual_gc_interval: 10

optimizer:
  lr: 5.0e-06
  min_lr: 0.0
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-08
  clip_grad: 1
  use_distributed_optimizer: true
  bf16: true
  use_precision_aware_optimizer: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16
  optimizer_cpu_offload: true
  # 1.0, NOT the champion's 0.5 — see the header. Full optimizer offload is the
  # lowest-peak posture available, so it maximises the headroom this arm gets.
  optimizer_offload_fraction: 1.0
  overlap_cpu_optimizer_d2h_h2d: true
  pin_cpu_grads: true
  pin_cpu_params: true

ddp:
  use_distributed_optimizer: true
  overlap_grad_reduce: true
  overlap_param_gather: false
  bucket_size: 500000000

scheduler:
  lr_decay_style: cosine
  lr_warmup_iters: 0
  lr_warmup_fraction: 0.10

# --- Model parallelism: TP1 · CP4 · EP4 · PP8 · ETP1 · DP2 -> 64 GPUs = 16 nodes
# Champion topology exactly: no VPP, no hybrid_layer_pattern override (the
# default contiguous split gives every stage 5 Mamba / 5 MoE / 1 attention). ---
model:
  seq_length: 32768
  pipeline_model_parallel_size: 8
  moe_experts_impl: cutlass_grouped
  tensor_model_parallel_size: 1
  expert_model_parallel_size: 4
  expert_tensor_parallel_size: 1
  context_parallel_size: 4
  sequence_parallel: True
  gradient_accumulation_fusion: True
  moe_token_dispatcher_type: alltoall
  moe_flex_dispatcher_backend: null
  moe_shared_expert_overlap: False
  moe_permute_fusion: True
  moe_grouped_gemm: True
  first_last_layers_bf16: False
  # ============ THE ARM LEVER ============
  # null disables selective recompute entirely. Every gate that could re-enable
  # it tests `recompute_granularity == 'selective'` explicitly
  # (attention.py:391-394, moe_layer.py:246-254, experts.py:259-261), and the
  # full-recompute path is gated on == 'full' (hybrid_block.py:312), so this
  # single field turns off ALL Megatron-side recompute. recompute_modules is
  # set to [] as documentation; it is unreachable while granularity is null.
  recompute_granularity: null
  recompute_modules: []
  # =======================================
  # Left false to keep this a single-variable probe. q3b is the arm that trades
  # recompute for host offload; conflating them here would make an OOM
  # uninterpretable.
  fine_grained_activation_offloading: false
  offload_modules: ["attn_norm", "qkv_linear", "core_attn", "attn_proj", "mlp_norm", "expert_fc1", "moe_act"]
  mtp_num_layers: null
  use_te_rng_tracker: True

dist:
  distributed_timeout_minutes: 45

checkpoint:
  pretrained_checkpoint: /projects/a5k/public/checkpoints/megatron_bridges/models/NVIDIA-Nemotron-3-Super-120B-A12B-Base-Chat-Init-BF16
  load: null
  save: null
  save_interval: 1000000
  save_optim: false
  save_rng: false
  ckpt_format: torch_dist
  async_save: false

logger:
  log_interval: 1
  log_throughput: true
  log_progress: true
  # 2 to match the champion (the 26.04 ladder found timers are free once the
  # end-of-step skew source is gone), so a surviving run is directly comparable
  # to the 21.78 s/iter number.
  timing_log_level: 2
  timing_log_option: minmax
  tensorboard_log_interval: 1
  log_timers_to_tensorboard: true
  log_throughput_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_loss_scale_to_tensorboard: true
  log_world_size_to_tensorboard: true
  log_runtime_to_tensorboard: true
  log_l2_norm_grad_to_tensorboard: true
  log_params_norm: false
  log_num_zeros_in_grad: false
  wandb_entity: geodesic
  wandb_project: megatron_training
  wandb_exp_name: infr71_q3a_recompute_off
  wandb_save_dir: /projects/a5k/public/logs/wandb

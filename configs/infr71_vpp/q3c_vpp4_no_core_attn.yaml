# NOTE (2026-08-04): the champion this arm was scored against has MOVED TWICE — first to
# 20.66 s/iter (optimizer CPU offload OFF), then to 17.099 s/iter (expert backend
# `torch_grouped`, i.e. torch._grouped_mm's real CUTLASS grouped kernel). The 21.78/25.66
# figures below are the baselines that were current when the arm ran and are kept for that
# reason; see configs/quickstart/nemotron_super_quickstart_sft.yaml for the current posture.
# ==============================================================================
# INFR-71 / Q3 arm C — A0 minus `core_attn` recompute (isolating the half of the
# consultant's claim that is actually correct)
#
# THE CLAIM. Flash attention already recomputes the softmax from the stored LSE
# inside its own backward. Wrapping the attention module in a torch-level
# activation checkpoint therefore adds a SECOND full forward on top of that —
# double compute. Upstream Megatron agrees and says so in a runtime warning:
# 3rdparty/Megatron-LM/megatron/core/transformer/transformer_config.py:1785-1791
# ("For fused attention, you have no need to set 'core_attn' to recompute").
#
# ALREADY MEASURED — this arm confirms the size, not the direction. Comparing
# the existing baseline and VPP traces under
# /projects/a5k/public/profiles/infr71/, normalised per attention layer:
#
#   kernel                          without core_attn      with core_attn
#   cudnn ...sdpa flash_fprop       128 / 0.0372 s         256 / 0.0746 s
#   cudnn ...sdpa flash_bprop       128 / 0.0984 s         128 / 0.0965 s
#   all attention kernels          1152 / 0.1445 s        1664 / 0.1805 s
#
# The forward kernel count doubles exactly while backward is untouched. That IS
# the double-forward, isolated. (128 = 32 microbatches x 4 CP ring steps; the
# recompute re-runs all four ring steps, re-issuing their P2P KV exchanges.)
# Cost: +0.036 s per attention layer per iteration.
#
# WHAT IT BUYS: essentially nothing. TE saves (q, k, v, out) + softmax_lse
# (transformer_engine/pytorch/attention/.../backends.py:1387-1395; the CP-P2P
# variant at context_parallel.py:1988-1999). q/k/v are the checkpoint's own
# inputs so they stay resident regardless, and `out` stays alive because
# linear_proj saves it for its wgrad. The only tensors actually freed are the
# LSE (1 x 32 x 8192 fp32 = 1.05 MB), TE's internal stacked-KV copy (~8.4 MB)
# and rng state — ~9.5 MB per attention layer-microbatch, ~76 MB per GPU at 8
# in-flight microbatches. 0.08% of a 95 GB card.
#
# WHY AN ARM AT ALL, given the traces already show it. Two reasons:
#   1. The trace comparison is cross-arm (baseline vs VPP) and those two configs
#      differ in layer pattern, batch_p2p_sync and timing_log_level as well as
#      recompute — docs/investigations/infr71-vpp-vs-baseline-trace-analysis.md
#      §1 flags the confound explicitly. This arm is A0 with ONE field changed,
#      so the delta is clean.
#   2. A0's stage-0-lite pattern puts 3 attention layers on stage 0, so the
#      predicted effect is ~3x the per-layer figure on the stage that sets the
#      pipeline period — the largest signal available anywhere in the campaign.
#
# PREREGISTERED PREDICTION: A0 minus core_attn lands 0.05-0.15 s/iter FASTER
# than A0, with peak memory within ~0.2 GB. A delta outside +/-0.3 s means
# something other than the recompute is moving and the arm should be traced
# before drawing conclusions. NOTE the campaign's run-to-run band and the
# ~2.7 s placement swings between allocations: this MUST be scored against a
# placement-matched A0, i.e. the same tunnel and ideally the same pair slot.
#
# THIS FILE DELIBERATELY DOES NOT EDIT A0. A0 is mid-campaign (pair 1) and A1/A2
# are queued behind it; silently changing their recompute list would rewrite
# what wave 2 is measuring. Wave 3 should adopt the winner.
#
# RELATIONSHIP TO A0: `recompute_modules` and `wandb_exp_name`, nothing else.
# The `fine_grained_activation_offloading: false` below is not a second lever —
# it is A0's own wave-2 correction (fine-grained offloading is incompatible with
# VPP at this pin: deterministic `AssertionError: Chunk mismatch` at iteration 2
# on MoE-stage ranks, prereg discovery (b)), which a0/a1/a2 now carry too. It is
# also how A0 was actually RUN: the first A0 launch used the YAML as written and
# did not complete; the relaunch appended
# `model.fine_grained_activation_offloading=false` and produced the 27.51 number.
#
# Submit (16 nodes, paired against A0 in the same allocation):
#   isambard_sbatch --nodes=16 pipeline_training_submit.sbatch \
#       configs/infr71_vpp/q3c_vpp4_no_core_attn.yaml super sft --disable-ft
# ==============================================================================
tokenizer:
  tokenizer_model: geodesic-research/nemotron-think-tokenizer

dataset:
  dataset_name: geodesic-research/pa-warm-start-1B-sft-mix
  dataset_root: /projects/a5k/public/data/geodesic-research__pa-warm-start-1B-sft-mix__default
  seq_length: 32768
  seed: 1234
  dataloader_type: batch
  num_workers: 4
  do_validation: false
  do_test: false
  val_proportion: 0.00
  rewrite: false
  packed_sequence_specs:
    packed_sequence_size: 32768
    pad_seq_to_mult: 16
    num_tokenizer_workers: 1
    packed_train_data_path: /projects/a5k/public/data/geodesic-research__pa-warm-start-1B-sft-mix__default/packed/geodesic-research--nemotron-think-tokenizer_pad_seq_to_mult16/training_32768.idx.parquet
  dataset_kwargs:
    chat: true
    use_hf_tokenizer_chat_template: true
    answer_only_loss: true
    pad_to_max_length: false

train:
  global_batch_size: 64
  micro_batch_size: 1
  train_iters: 32
  exit_signal_handler: true
  manual_gc: true
  manual_gc_interval: 10

optimizer:
  lr: 5.0e-06
  min_lr: 0.0
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-08
  clip_grad: 1
  use_distributed_optimizer: true
  bf16: true
  use_precision_aware_optimizer: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16
  optimizer_cpu_offload: true
  # 1.0 to match A0 exactly (champion uses 0.5 — a ~0.9-1.0 s/iter difference
  # per the C1 trace analysis). This arm is scored against A0, never against
  # the 21.78 champion number.
  optimizer_offload_fraction: 1.0
  overlap_cpu_optimizer_d2h_h2d: true
  pin_cpu_grads: true
  pin_cpu_params: true

ddp:
  use_distributed_optimizer: true
  overlap_grad_reduce: true
  overlap_param_gather: false
  bucket_size: 500000000

scheduler:
  lr_decay_style: cosine
  lr_warmup_iters: 0
  lr_warmup_fraction: 0.10

# --- Model parallelism: TP1 · CP4 · EP4 · PP8 · ETP1 · DP2 -> 64 GPUs = 16 nodes ---
# Identical to a0_vpp4_cutlass.yaml except recompute_modules.
model:
  seq_length: 32768
  pipeline_model_parallel_size: 8
  # Repo-default expert backend (torch._grouped_mm's real CUTLASS grouped kernel).
  # The arm numbers recorded in this header predate it and were measured on the
  # per-expert cublas loop — set `cublas_grouped` to reproduce them exactly.
  moe_experts_impl: torch_grouped
  virtual_pipeline_model_parallel_size: 4
  hybrid_layer_pattern: "MEM|EME|M*E|MEM|EME|M*E|MEM|EME|M*|EME|MEM|EME|M*E|MEM|EME|ME|M*|EM|EME|MEM|EM*|EME|MEM|EME|M*|EM|EME|MEM|*EM|EME|ME|ME"
  tensor_model_parallel_size: 1
  expert_model_parallel_size: 4
  expert_tensor_parallel_size: 1
  context_parallel_size: 4
  sequence_parallel: True
  gradient_accumulation_fusion: True
  moe_token_dispatcher_type: alltoall
  moe_flex_dispatcher_backend: null
  moe_shared_expert_overlap: False
  moe_permute_fusion: True
  moe_grouped_gemm: True
  first_last_layers_bf16: False
  recompute_granularity: selective
  # ============ THE ARM LEVER ============
  # A0 uses ["core_attn", "moe", "shared_experts"]. Dropping core_attn is the
  # only difference in this file. 'moe' stays — it is load-bearing for fit
  # (~90 GB of dispatch transient by arithmetic; see q3a). 'shared_experts'
  # stays for A0-parity, though note it is nearly a no-op: shared_experts_compute
  # is called INSIDE the 'moe' checkpoint (moe_layer.py:645), so with both set
  # the shared expert runs three forwards and saves only the ~176 MB of
  # intermediates that the outer recompute would otherwise rebuild at once.
  recompute_modules: ["moe", "shared_experts"]
  # =======================================
  # OFF because this is a VPP arm, matching a0/a1/a2. Fine-grained offloading is
  # incompatible with VPP at this pin: interleaved model chunks each build a
  # ChunkOffloadHandler and backward crosses them, giving a deterministic
  # `AssertionError: Chunk mismatch` at iteration 2 on MoE-stage ranks
  # (docs/investigations/infr71-vpp-campaign-prereg.md, wave-2 discovery (b)).
  # Nothing in the launcher overrides the YAML, so `true` here would crash.
  fine_grained_activation_offloading: false
  # Kept for parity with a0 and to document intent. Entirely inert: the whole
  # offload path — including the assert at transformer_config.py:1855-1865 and
  # the handler install at hybrid_model.py:351-360 — is gated on
  # fine_grained_activation_offloading (transformer_config.py:1829).
  offload_modules: ["attn_norm", "qkv_linear", "core_attn", "attn_proj", "mlp_norm"]
  mtp_num_layers: null
  batch_p2p_sync: false
  use_te_rng_tracker: True

dist:
  distributed_timeout_minutes: 45

checkpoint:
  pretrained_checkpoint: /projects/a5k/public/checkpoints/megatron_bridges/models/NVIDIA-Nemotron-3-Super-120B-A12B-Base-Chat-Init-BF16
  load: null
  save: null
  save_interval: 1000000
  save_optim: false
  save_rng: false
  ckpt_format: torch_dist
  async_save: false

logger:
  log_interval: 1
  log_throughput: true
  log_progress: true
  timing_log_level: 1
  timing_log_option: minmax
  tensorboard_log_interval: 1
  log_timers_to_tensorboard: true
  log_throughput_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_loss_scale_to_tensorboard: true
  log_world_size_to_tensorboard: true
  log_runtime_to_tensorboard: true
  log_l2_norm_grad_to_tensorboard: true
  log_params_norm: false
  log_num_zeros_in_grad: false
  wandb_entity: geodesic
  wandb_project: megatron_training
  wandb_exp_name: infr71_q3c_vpp4_no_core_attn
  wandb_save_dir: /projects/a5k/public/logs/wandb

# NOTE (2026-08-04): the champion this arm was scored against has MOVED TWICE — first to
# 20.66 s/iter (optimizer CPU offload OFF), then to 17.099 s/iter (expert backend
# `torch_grouped`, i.e. torch._grouped_mm's real CUTLASS grouped kernel). The 21.78/25.66
# figures below are the baselines that were current when the arm ran and are kept for that
# reason; see configs/quickstart/nemotron_super_quickstart_sft.yaml for the current posture.
# ==============================================================================
# INFR-71 / Q3 arm B — recompute OFF, host offload INSTEAD (the strong form of
# the consultant's recommendation — currently blocked by an open upstream bug)
#
# q3a tests "disable recompute" on its own and is preregistered to OOM by ~90 GB.
# This arm asks the follow-up question that actually has a chance: if we stop
# recomputing the MoE block, can NVTE fine-grained activation offloading move
# those activations to host RAM over NVLink-C2C instead?
#
# ⚠️ EXPECTED TO HIT AN OPEN UPSTREAM BUG — READ BEFORE SCHEDULING.
# `fine_grained_activation_offloading` is recorded as BROKEN at this exact pin by
# our own merged host-overhead campaign:
# docs/investigations/120b-gbs64-host-overhead-investigation.md:104 and bug #5 at
# :151 — `AssertionError: Chunk mismatch` in
# mcore pipeline_parallel/fine_grained_activation_offload.py, firing under
# **plain PP=8, not only VPP**, status OPEN upstream with no commits to that file
# since our pin. This arm is plain PP=8 with offloading ON, so the most likely
# outcome is that assert, not a memory or throughput datum. It is preregistered
# here anyway because it is cheap (dies early), because the two mechanisms have
# never been observed together, and because a clean reproduction under
# `recompute_granularity: null` — a configuration bug #5 was NOT observed in,
# since offload-inside-recomputed-MoE is rejected at config time — is worth
# having on the upstream issue. Treat a non-crash as the surprise.
#
# WHY THE QUESTION IS WORTH ASKING AT ALL. `fine_grained_activation_offloading`
# was a SILENT NO-OP on Nemotron-H at the previous mcore pin — only GPTModel
# called init_chunk_handler and this model is a MambaModel, so every "all-7
# offload_modules" line in our older configs did nothing. At the 0.19 pin the
# hybrid model wires it up (hybrid_model.py:351-360 calls
# off_interface.init_chunk_handler), so the code path is live — it is just also
# broken. It is the only unused row of the Megatron MoE paper's memory table
# (Table 13); we already run selective recompute, precision-aware optimizer,
# optimizer offload and fused permutation. If upstream fixes bug #5, this arm is
# the ready-made test of offload-instead-of-recompute.
#
# WHY IT NEEDS RECOMPUTE OFF TO BE LEGAL. transformer_config.py:1855-1865
# asserts that expert_fc1 / moe_act / fused_group_mlp cannot be offloaded while
# 'moe' is in recompute_modules — the recompute wrap already discards them, so
# offloading inside it is redundant and errors out. The two mechanisms are
# mutually exclusive by construction, which is exactly why they have never been
# compared head to head on this model.
#
# THE TRADE BEING MEASURED. Full-MoE recompute currently costs, per iteration
# (2026-08-02 trace audit, /projects/a5k/public/profiles/infr71/):
#   ~1.25 s  re-forward of the expert GEMMs — the recompute pass is literally
#            one of the four passes in the census arithmetic
#            (128 experts x 2 proj x 5 layers x 32 ub x 4 = 163,840 launches)
#   ~0.32 s  re-run of the MoE dispatch family (sort / permute / topk)
#   + one extra EP all-to-all dispatch+combine per MoE layer-microbatch
# i.e. roughly 2 s of a 21.78 s iteration, ~9%. Offloading would buy that back
# and pay instead in PCIe-free NVLink-C2C D2H/H2D traffic. Whether that is a
# win is genuinely unknown — hence an arm rather than an assertion.
#
# PREREGISTERED EXPECTATION, in order of likelihood:
#   (a) `AssertionError: Chunk mismatch` — bug #5 reproduces under
#       recompute-off too. Most likely. Capture the traceback for the upstream
#       issue and close the arm; the mechanism question stays open until the
#       fix lands.
#   (b) OOM — offload survives but cannot drain fast enough at 8 in-flight
#       microbatches to absorb ~90 GB. Then the answer to the consultant is
#       final: on this model, at this token count, MoE recompute is not
#       optional.
#   (c) Fits but slower than 21.78 — offload bandwidth-bound. Report and close.
#   (d) Fits and beats 21.78 — the surprise, and the only outcome that would
#       justify a wider offload sweep (activation_offload_fraction, trimming
#       offload_modules to just the MoE entries).
# Note (a) and (b) are both cheap: each dies in the first iterations.
#
# Submit (16 nodes, non-VPP champion topology):
#   isambard_sbatch --nodes=16 pipeline_training_submit.sbatch \
#       configs/infr71_vpp/q3b_recompute_off_offload.yaml super sft --disable-ft
#
# Run q3a FIRST or alongside — q3b alone cannot separate "offload rescued it"
# from "it would have fit anyway".
# ==============================================================================
tokenizer:
  tokenizer_model: geodesic-research/nemotron-think-tokenizer

dataset:
  dataset_name: geodesic-research/pa-warm-start-1B-sft-mix
  dataset_root: /projects/a5k/public/data/geodesic-research__pa-warm-start-1B-sft-mix__default
  seq_length: 32768
  seed: 1234
  dataloader_type: batch
  num_workers: 4
  do_validation: false
  do_test: false
  val_proportion: 0.00
  rewrite: false
  packed_sequence_specs:
    packed_sequence_size: 32768
    pad_seq_to_mult: 16
    num_tokenizer_workers: 1
    packed_train_data_path: /projects/a5k/public/data/geodesic-research__pa-warm-start-1B-sft-mix__default/packed/geodesic-research--nemotron-think-tokenizer_pad_seq_to_mult16/training_32768.idx.parquet
  dataset_kwargs:
    chat: true
    use_hf_tokenizer_chat_template: true
    answer_only_loss: true
    pad_to_max_length: false

train:
  global_batch_size: 64
  micro_batch_size: 1
  train_iters: 32
  exit_signal_handler: true
  manual_gc: true
  manual_gc_interval: 10

optimizer:
  lr: 5.0e-06
  min_lr: 0.0
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-08
  clip_grad: 1
  use_distributed_optimizer: true
  bf16: true
  use_precision_aware_optimizer: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16
  optimizer_cpu_offload: true
  # 1.0 to match q3a, so the q3a/q3b pair differs ONLY in the offload lever.
  # Note this arm puts optimizer state AND activations on the host — if it is
  # host-bandwidth-bound, dropping to 0.5 is the first thing to try.
  optimizer_offload_fraction: 1.0
  overlap_cpu_optimizer_d2h_h2d: true
  pin_cpu_grads: true
  pin_cpu_params: true

ddp:
  use_distributed_optimizer: true
  overlap_grad_reduce: true
  overlap_param_gather: false
  bucket_size: 500000000

scheduler:
  lr_decay_style: cosine
  lr_warmup_iters: 0
  lr_warmup_fraction: 0.10

# --- Model parallelism: TP1 · CP4 · EP4 · PP8 · ETP1 · DP2 -> 64 GPUs = 16 nodes ---
model:
  seq_length: 32768
  pipeline_model_parallel_size: 8
  # Repo-default expert backend (torch._grouped_mm's real CUTLASS grouped kernel).
  # The arm numbers recorded in this header predate it and were measured on the
  # per-expert cublas loop — set `cublas_grouped` to reproduce them exactly.
  moe_experts_impl: torch_grouped
  tensor_model_parallel_size: 1
  expert_model_parallel_size: 4
  expert_tensor_parallel_size: 1
  context_parallel_size: 4
  sequence_parallel: True
  gradient_accumulation_fusion: True
  moe_token_dispatcher_type: alltoall
  moe_flex_dispatcher_backend: null
  moe_shared_expert_overlap: False
  moe_permute_fusion: True
  moe_grouped_gemm: True
  first_last_layers_bf16: False
  # Recompute off — same as q3a, and a precondition for the offload list below.
  recompute_granularity: null
  recompute_modules: []
  # ============ THE ARM LEVER ============
  # Live for the first time on this model (see header). expert_fc1 and moe_act
  # are the two entries that matter here: they are the MoE-internal activations
  # that 'moe' recompute used to discard, and they are illegal to offload while
  # that recompute is on. attn_proj requires core_attn to be offloaded too
  # (transformer_config.py:1849-1854) — both are present.
  fine_grained_activation_offloading: true
  offload_modules: ["attn_norm", "qkv_linear", "core_attn", "attn_proj", "mlp_norm", "expert_fc1", "moe_act"]
  # =======================================
  mtp_num_layers: null
  use_te_rng_tracker: True

dist:
  distributed_timeout_minutes: 45

checkpoint:
  pretrained_checkpoint: /projects/a5k/public/checkpoints/megatron_bridges/models/NVIDIA-Nemotron-3-Super-120B-A12B-Base-Chat-Init-BF16
  load: null
  save: null
  save_interval: 1000000
  save_optim: false
  save_rng: false
  ckpt_format: torch_dist
  async_save: false

logger:
  log_interval: 1
  log_throughput: true
  log_progress: true
  timing_log_level: 2
  timing_log_option: minmax
  tensorboard_log_interval: 1
  log_timers_to_tensorboard: true
  log_throughput_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_loss_scale_to_tensorboard: true
  log_world_size_to_tensorboard: true
  log_runtime_to_tensorboard: true
  log_l2_norm_grad_to_tensorboard: true
  log_params_norm: false
  log_num_zeros_in_grad: false
  wandb_entity: geodesic
  wandb_project: megatron_training
  wandb_exp_name: infr71_q3b_recompute_off_offload
  wandb_save_dir: /projects/a5k/public/logs/wandb
